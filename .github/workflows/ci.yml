name: CI

# Vercel's Git integration is disabled in vercel.json, so this workflow is the
# only route to a deployment. The `deploy` job needs `test`, which means no
# commit reaches Vercel — preview or production — unless the checks passed
# first.

on:
  push:
    branches: [main, develop, 'parent/**', 'shared/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new PR revision may replace its checks. A main deployment must finish
  # both backend and frontend before the next revision can start deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify main release came from a delivered PR
        if: github.repository == 'kostasanastasioubusiness-lang/trak-football-hub' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: node scripts/governance/verify-delivery.mjs --repository "$REPOSITORY" --commit "$RELEASE_SHA" --previous-sha "$PREVIOUS_SHA" --forced "$FORCED_PUSH"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Governance regression tests
        run: node --test tests/governance/*.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Database security regressions
        run: npm run test:db

      - name: Parent migration after deployed reporting migration
        run: npm run test:db -- --parent-upgrade-review

      # tests/msw and tests/support hold the MSW fidelity contract and the
      # useCase() unknown-id guard — package.json's "test" script only runs
      # src, so these run nowhere else in CI.
      - name: Use-case harness
        run: npm run test:harness

      # Runs the use-case suite through the registry ratchet: enforced use
      # cases block, pending ones report without blocking. UC-C02 and UC-C04
      # are enforced; everything else is pending and reports coverage debt
      # without blocking.
      - name: Use cases
        run: npm run uc:check

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Parent invitation browser regressions
        run: npx playwright test --config playwright.pilot.config.ts

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ''

  # The `secrets` context is not available in a job-level `if`, so whether the
  # Vercel credentials exist has to be resolved in a job and passed on as an
  # output. Without this, a repo that has not yet added the secrets gets a red
  # Deploy job on every pull request instead of a clear skip.
  vercel-credentials:
    name: Check Vercel credentials
    runs-on: ubuntu-latest
    # Forks run regression checks only, even if somebody later adds secrets.
    if: github.repository == 'kostasanastasioubusiness-lang/trak-football-hub'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$DEPLOY_REF" = "refs/heads/main" ]; then
              echo "::error::Production deployment requires VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID."
              exit 1
            fi
            {
              echo "### Deployment skipped — Vercel credentials not configured"
              echo ""
              echo "\`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` must all be set"
              echo "as repository secrets under Settings → Secrets and variables → Actions."
              echo ""
              echo "**\`vercel.json\` disables Vercel's Git integration, so nothing is deploying"
              echo "at all until those secrets exist.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Migrations and edge functions do not travel with the frontend. Vercel
  # ships src/ on merge; Supabase ships nothing unless told to, which is how a
  # merged PR can look deployed while every RPC behind it is still missing.
  # This job closes that gap, and runs BEFORE Deploy so a build that calls a new
  # RPC never reaches production ahead of the migration that creates it.
  supabase:
    name: Supabase
    needs: [test, vercel-credentials]
    runs-on: ubuntu-latest
    # Production only. A pull request must never push migrations to the live
    # database, and there is no second Supabase project to point previews at.
    if: github.repository == 'kostasanastasioubusiness-lang/trak-football-hub' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      # Unlike the Vercel job, a missing credential here FAILS rather than
      # skips. A silent skip on main is precisely how a change quietly does not
      # ship, and this job exists to prevent that.
      - name: Require credentials
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_ID" ]            || missing="$missing SUPABASE_PROJECT_ID"
          [ -n "$DB_URL" ]                || missing="$missing SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            {
              echo "### Supabase deploy could not run"
              echo ""
              echo "Missing secrets:\`$missing\`"
              echo ""
              echo "Add them under Settings \u2192 Secrets and variables \u2192 Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deliberately no `supabase link`. Linking asks the Management API for
      # project metadata AND the project's API keys, so making it work would
      # mean granting this token read access to the service-role key — the one
      # credential that reads every player record while bypassing RLS. A token
      # that lives in CI should not be able to fetch it. Both commands below
      # take their target explicitly instead, which keeps the token down to
      # Edge Functions and Migrations.
      #
      # SUPABASE_DB_URL is the pooler connection string from the dashboard's
      # Connect panel; it carries the database password, so it is a secret.

      # Printed before anything is applied, so the run log carries a record of
      # what changed even when the push succeeds.
      - name: Show migration state
        run: supabase migration list --db-url "$DB_URL"

      - name: Push migrations
        # Reviewed branches may contain an older timestamp than a migration
        # already deployed from another PR. Include only unapplied migrations;
        # never rename applied versions or repair history to skip their SQL.
        run: |
          supabase db push --db-url "$DB_URL" --include-all --dry-run
          supabase db push --db-url "$DB_URL" --include-all

      # Deploys all four functions. Values come from supabase/config.toml, so
      # that file is the source of truth for verify_jwt \u2014 not the dashboard.
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"

      - name: Summary
        run: |
          {
            echo "### Supabase updated"
            echo ""
            echo "Migrations pushed and all edge functions deployed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [test, vercel-credentials, supabase]
    runs-on: ubuntu-latest
    # Skip rather than fail red when the credentials are absent, and on forked
    # pull requests, which cannot read secrets at all.
    # always() is required so that Deploy still runs on pull requests, where the
    # supabase job is skipped by design. The explicit result checks put back the
    # gating that always() would otherwise discard: a failed test or a failed
    # migration must still stop the deployment.
    if: >-
      always() &&
      github.repository == 'kostasanastasioubusiness-lang/trak-football-hub' &&
      needs.test.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.supabase.result == 'success') ||
       (github.ref != 'refs/heads/main' && needs.supabase.result == 'skipped')) &&
      needs.vercel-credentials.outputs.configured == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve target environment
        id: target
        env:
          SCOPE: ${{ secrets.VERCEL_SCOPE }}
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
          # A personal token cannot resolve a team-owned project without a
          # scope. Optional: set VERCEL_SCOPE to the team slug if the project
          # lives under a team.
          if [ -n "$SCOPE" ]; then
            echo "scope=--scope=$SCOPE" >> "$GITHUB_OUTPUT"
          else
            echo "scope=" >> "$GITHUB_OUTPUT"
          fi
          # A secret pasted with a trailing newline or stray space is stored
          # verbatim by GitHub and corrupts --token=. Report the shape (never
          # the value) so that cause is visible rather than guessed at.
          RAW_LEN=${#RAW_TOKEN}
          CLEAN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CLEAN_LEN=${#CLEAN}
          echo "VERCEL_TOKEN length raw=$RAW_LEN trimmed=$CLEAN_LEN"
          if [ "$RAW_LEN" -ne "$CLEAN_LEN" ]; then
            echo "::warning::VERCEL_TOKEN contains whitespace; using the trimmed value."
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls project settings and environment variables from Vercel, so the
      # build gets VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY from the
      # Vercel project rather than from a file committed to the repo.
      - name: Pull Vercel environment
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          vercel pull --yes --environment=${{ steps.target.outputs.env }} ${{ steps.target.outputs.scope }} --token="$TOKEN"

      # "Could not retrieve Project Settings" is opaque. Turn it into
      # something actionable rather than making the next person read Vercel's
      # docs to guess which of the three credentials is wrong.
      - name: Explain a failed Vercel link
        if: failure()
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Probing what the token can actually see..."
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          WHO=$(vercel whoami --token="$TOKEN" 2>&1 || true)
          PROJECTS=$(vercel project ls ${{ steps.target.outputs.scope }} --token="$TOKEN" 2>&1 || true)
          # Echo to stdout as well as the summary — the run log is what is
          # readable from a terminal, and a diagnostic nobody can reach is not
          # a diagnostic.
          echo "--- vercel whoami ---"
          echo "$WHO"
          echo "--- vercel project ls ---"
          echo "$PROJECTS"
          echo "--- end probe ---"
          {
            echo "### Vercel could not resolve the project"
            echo ""
            echo "Token identity (\`vercel whoami\`):"
            echo ""
            echo '```'
            echo "$WHO"
            echo '```'
            echo ""
            echo "Projects this token can see in the current scope (\`vercel project ls\`):"
            echo ""
            echo '```'
            echo "$PROJECTS"
            echo '```'
            echo ""
            echo "If \`whoami\` names a person but the project list is empty or missing"
            echo "**trak-football-hub**, the token is scoped to a personal account while the"
            echo "project belongs to a team — cause 3 below."
            echo ""
            echo "\`vercel pull\` failed. The credentials exist, so one of these is the cause:"
            echo ""
            echo "1. **\`VERCEL_PROJECT_ID\` is not the project id.** It must be the \`prj_...\`"
            echo "   value, not the project name. Vercel → Project → Settings → General."
            echo "2. **\`VERCEL_ORG_ID\` is not the owner id.** It must be \`team_...\` for a"
            echo "   team, or your personal account id — not the team slug."
            echo "3. **The token cannot see the project.** A personal token cannot reach a"
            echo "   team-owned project without a scope. Either issue the token under the"
            echo "   team, or set a \`VERCEL_SCOPE\` secret to the team slug."
            echo ""
            echo "The reliable way to get 1 and 2: run \`npx vercel link\` locally, then read"
            echo "\`orgId\` and \`projectId\` out of the generated \`.vercel/project.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          vercel build ${{ steps.target.outputs.flag }} --token="$TOKEN"

      - name: Deploy
        id: deploy
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} ${{ steps.target.outputs.scope }} --token="$TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
          {
            echo "### Deployed to ${{ steps.target.outputs.env }}"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Vercel's own PR comments stop once its Git integration is disabled, so
      # the preview URL is posted here instead.
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n**Preview deployed:** ${url}\n\nChecks passed before this deployment was created.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
