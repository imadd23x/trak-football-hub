name: Merge governance

# Extends the original non-main-base guard. No production secrets, writes or
# pull_request_target execution: candidate code runs with a read-only token.
on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck against current main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  base-reaches-main:
    name: Merge policy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current candidate and main
        id: candidate
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const number = context.payload.pull_request?.number ?? Number(process.env.REQUESTED_PR);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const args = { owner: context.repo.owner, repo: context.repo.repo };
            const [{ data: pr }, { data: main }] = await Promise.all([
              github.rest.pulls.get({ ...args, pull_number: number }),
              github.rest.repos.getBranch({ ...args, branch: 'main' }),
            ]);
            for (const value of [pr.head.sha, main.commit.sha]) {
              if (!/^[0-9a-f]{40}$/.test(value)) throw new Error('Invalid commit metadata');
            }
            if (context.payload.pull_request && context.payload.pull_request.head.sha !== pr.head.sha) {
              throw new Error('PR head changed since this event; this check cannot certify another revision');
            }
            core.setOutput('number', String(number));
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', main.commit.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dependencies and migration order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
          HEAD_SHA: ${{ steps.candidate.outputs.head }}
        run: node scripts/governance/check-pr.mjs --repository "$REPOSITORY" --pr "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  delivery:
    name: Verify merged delivery
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual merge result and changed-file inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/governance/verify-delivery.mjs --repository "$REPOSITORY" --pr "$PR_NUMBER"
