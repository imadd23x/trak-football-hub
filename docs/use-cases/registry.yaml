# Single source of truth for Trak's application use cases.
# Product-owner-owned. Changing a given/when/then requires bumping that
# entry's spec_version — scripts/uc-check.mjs enforces this via
# registry.lock.json.
version: 1
owner: "@kostasanastasioubusiness-lang"
use_cases:
  # PARKED 2026-09-21. Imad confirmed coach-only match logging for the pilot;
  # academy-led admission has no athlete self-reporting path. The route these
  # assert (/player/log) does not exist and is not planned, so the assertions
  # were failing against an absent feature rather than against a defect.
  #
  # `parked` is the harness's existing third status, not a new one invented
  # here — it is already in the UseCaseStatus type, the support test and
  # uc-report's sections. Only uc-check.mjs did not know it, which is fixed
  # alongside this.
  #
  # The disposition is stated, not silenced. `parked` would make useCase()
  # skip the suite, and a permanently skipped test reads as coverage; the file
  # is deleted instead. `then` keeps the PO's original words so the decision
  # stays auditable if athlete logging is ever revived.
  - id: UC-A02
    actor: athlete
    title: Log a match with position inputs and live band preview
    requirement: REQ-001
    status: parked
    tier: [1, 2]
    spec_version: 2
    given: A signed-in pilot athlete on mobile web
    when: They complete the match log form and tap save
    then:
      - A matches row is persisted with a computed rating
      - They are taken to the result screen for that match
      - No decimal number is rendered anywhere in the UI
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-21. Imad confirmed coach-only match logging for the pilot;
  # academy-led admission has no athlete self-reporting path. The route these
  # assert (/player/log) does not exist and is not planned, so the assertions
  # were failing against an absent feature rather than against a defect.
  #
  # `parked` is the harness's existing third status, not a new one invented
  # here — it is already in the UseCaseStatus type, the support test and
  # uc-report's sections. Only uc-check.mjs did not know it, which is fixed
  # alongside this.
  #
  # The disposition is stated, not silenced. `parked` would make useCase()
  # skip the suite, and a permanently skipped test reads as coverage; the file
  # is deleted instead. `then` keeps the PO's original words so the decision
  # stays auditable if athlete logging is ever revived.
  - id: UC-A03
    actor: athlete
    title: See band result after saving a match
    requirement: REQ-001
    status: parked
    tier: [1]
    spec_version: 2
    given: An athlete who has just saved a match
    when: The result screen renders
    then:
      - The band word for the computed score is shown
      - The band word is rendered in that band's configured colour
      - No decimal number is rendered anywhere in the UI
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # ENFORCED 2026-09-21. Its test passed on every uc:check run since the
  # 2026-09-21 merges; Imad approved promoting it (Tarek's offer, #77 thread).
  - id: UC-A04
    actor: athlete
    title: View match history and match detail
    requirement: REQ-001
    status: enforced
    tier: [1]
    spec_version: 2
    given: A signed-in athlete with previously logged matches
    when: They open the match history screen
    then:
      - Every logged match appears as a card
      - An athlete with no matches sees an explicit empty message
      - A failed load is distinguishable from an empty history
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). Goals are cut from the pilot (MVP Requirements, "Cut from the pilot"; TRAK-32).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-A06
    actor: athlete
    title: Create and track a goal
    requirement: REQ-001
    status: parked
    tier: [1]
    spec_version: 2
    given: A signed-in athlete
    when: They create a goal from the goals screen
    then:
      - The goal is persisted and appears in their goals list
      - The goals screen is reachable from the athlete navigation
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). Medals, recognition and awards are cut from the pilot (TRAK-31).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-A07
    actor: athlete
    title: Earn and see medals
    requirement: REQ-001
    status: parked
    tier: [1]
    spec_version: 2
    given: An athlete whose logged matches satisfy a medal rule
    when: They open the medals screen
    then:
      - Every earned medal is shown as earned
      - Medal eligibility is evaluated from their real match history
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). J1: children do not join by typing a name or a coach code; the academy roster and the invitation decide who is in (TRAK-36).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-A08
    actor: athlete
    title: Enter a TRK-XXXX code and claim the squad row
    requirement: REQ-003
    status: parked
    tier: [2]
    spec_version: 2
    given: An athlete holding a coach's TRK-XXXX code
    when: They submit the code
    then:
      - The squad row is linked to their account
      - The coach and athlete are genuinely connected in the database
      - An invalid or already-claimed code is rejected with a reason
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  - id: UC-A09
    actor: athlete
    title: See the coach's assessment as band and six category bars
    requirement: REQ-002
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A linked athlete whose coach has submitted an assessment
    when: They open their profile
    then:
      - The assessment's overall band is shown
      - All six category scores are shown as bars
      - The coach's private note is never shown to the athlete
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). J1/J2: the academy supplies every guardian email; a child does not generate a parent code (TRAK-36, TRAK-38).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-A10
    actor: athlete
    title: Generate a PAR-XXXX code for a parent
    requirement: REQ-003
    status: parked
    tier: [2]
    spec_version: 2
    given: A signed-in athlete
    when: They request a parent invite code
    then:
      - A unique PAR-XXXX code is stored against their account
      - The same code is shown to them until it is redeemed
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # REWRITTEN 2026-09-23 (Q-2026-09-23-01, TRAK-19). J1: "coaches do not add
  # players" — the academy roster is loaded by Trak (concierge). The old
  # spec asserted the opposite, so this is a spec change, not a weakened test.
  # Pending until TRAK-47 removes /coach/squad/add; TRAK-48 covers the backend
  # refusal under real roles.
  - id: UC-C02
    actor: coach
    title: Coaches do not add players; the academy roster decides the squad
    requirement: J1
    status: pending
    tier: [1, 2]
    spec_version: 2
    given: A signed-in coach
    when: They open their squad, or go to /coach/squad/add directly
    then:
      - The squad screen offers no way to add a player
      - /coach/squad/add shows no add-player form and sends the coach to their squad
      - A squad_players insert by a coach is refused by the backend
    source: MVP Requirements

  # ENFORCED 2026-09-21. Its test passed on every uc:check run since the
  # 2026-09-21 merges; Imad approved promoting it (Tarek's offer, #77 thread).
  - id: UC-C03
    actor: coach
    title: View the squad
    requirement: REQ-002
    status: enforced
    tier: [1]
    spec_version: 2
    given: A signed-in coach
    when: They open the squad screen
    then:
      - Every player in their squad is listed
      - A coach with an empty squad sees an explicit empty message
      - A failed load is distinguishable from an empty squad
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # SPEC v2 2026-09-25 (TRAK-68): Imad decided an assessment belongs to a
  # session that already happened, so the session is required. v1 had it
  # optional, and a same-day re-assessment silently moved the first one to
  # another match (second use-case test).
  - id: UC-C04
    actor: coach
    title: Assess a player on six sliders producing a band
    requirement: REQ-002
    status: enforced
    tier: [1, 2]
    spec_version: 2
    given: A signed-in coach with at least one squad player and at least one past session
    when: They select a player and a past session, set the six sliders and submit
    then:
      - A coach_assessments row is persisted with all six category scores and the chosen session
      - A band derived from the six scores is shown before submitting
      - Submitting is refused until a player and a session are selected
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). J1: coach TRK- codes are not an admission path in the pilot (TRAK-36).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-C07
    actor: coach
    title: Receive a real, stored, unique TRK-XXXX code
    requirement: REQ-003
    status: parked
    tier: [2]
    spec_version: 2
    given: A signed-in coach
    when: They view their invite code
    then:
      - The code is persisted, not generated for display only
      - The same code is returned on every subsequent view
      - No two coaches hold the same code
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). Player-entered match logging is parked with UC-A02/A03; the coach logs matches (J4, TRAK-37).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-C08
    actor: coach
    title: See linked athletes' logged matches, bands only
    requirement: REQ-003
    status: parked
    tier: [2]
    spec_version: 2
    given: A coach linked to an athlete who has logged matches
    when: They open that athlete's profile
    then:
      - Each logged match is shown with its band
      - The athlete's self-rating is never shown to the coach
      - The athlete's body-condition input is never shown to the coach
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # PARKED 2026-09-23 (Q-2026-09-23-01, TRAK-19). J2: guardians join through the academy-supplied invitation, not a PAR- code (TRAK-36).
  # The PO's original words are kept so the decision stays auditable.
  - id: UC-P01
    actor: parent
    title: Redeem PAR-XXXX, create an account and link to the child
    requirement: REQ-003
    status: parked
    tier: [2]
    spec_version: 2
    given: A parent holding a PAR-XXXX code
    when: They redeem it and complete sign-up
    then:
      - The parent account is linked to exactly that child
      - The code cannot be redeemed a second time
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  - id: UC-P02
    actor: parent
    title: See the child's season band
    requirement: REQ-004
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A linked parent
    when: They open the parent home screen
    then:
      - The child's season band is shown
      - A failed load is distinguishable from a child with no matches
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  - id: UC-P03
    actor: parent
    title: See the child's match feed
    requirement: REQ-004
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A linked parent
    when: They open the matches screen
    then:
      - Every match the child logged is listed with its band
      - The child's self-rating is never shown to the parent
      - The child's body-condition input is never shown to the parent
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  - id: UC-P06
    actor: parent
    title: See the coach's assessments
    requirement: REQ-004
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A linked parent whose child has been assessed
    when: They open the parent home screen
    then:
      - The assessment band is shown
      - The coach's private note is never shown to the parent
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # REWRITTEN 2026-09-23 (Q-2026-09-23-01, TRAK-19). The consent threshold is
  # 18, not 13–14, and consent is given by an academy-supplied guardian (J2).
  - id: UC-P07
    actor: parent
    title: A guardian gives recorded consent for a child under 18
    requirement: J2
    status: pending
    tier: [1, 2]
    spec_version: 2
    given: A guardian invited by the academy for a child under 18, or with no date of birth
    when: They complete the consent screen
    then:
      - The flow cannot complete without a recorded consent
      - The consent record stores the guardian's name, relationship and the notice version, and is timestamped
      - No development record about the child can be written before consent exists
      - One guardian can consent for siblings without a second account
    source: MVP Requirements

  - id: UC-T01
    actor: system
    title: Every enforced use case emits telemetry answering the Q4 metric
    requirement: REQ-005
    status: pending
    tier: [2]
    spec_version: 1
    given: A pilot in progress
    when: The founder runs the telemetry query
    then:
      - Weekly logging players can be counted for any given week
      - The count matches a manual count of the underlying rows
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  - id: UC-X01
    actor: system
    title: No role reads data belonging to anyone they are not linked to
    requirement: REQ-004
    status: pending
    tier: [2]
    spec_version: 1
    given: Two unlinked accounts of any roles
    when: One attempts to read the other's rows
    then:
      - The read is rejected rather than returning an empty result
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # ENFORCED 2026-09-21. Its test passed on every uc:check run since the
  # 2026-09-21 merges; Imad approved promoting it (Tarek's offer, #77 thread).
  - id: UC-X02
    actor: system
    title: A failed load never renders as a false empty state
    requirement: REQ-004
    status: enforced
    tier: [1]
    spec_version: 2
    given: Any data-backed screen
    when: The request fails or the network is unavailable
    then:
      - A retryable error is shown
      - The error is visibly different from the genuine empty state
    source: docs/superpowers/specs/2026-07-27-trak-pilot-mvp-design.md

  # ADDED 2026-09-23 (Q-2026-09-23-01, TRAK-19): use cases for the P0 journeys
  # J1–J4 in MVP Requirements. Pending until a test exists and passes.
  - id: UC-X03
    actor: system
    title: Only rostered children and academy-supplied guardians get a profile
    requirement: J1
    status: pending
    tier: [2]
    spec_version: 1
    given: A person with no valid academy invitation
    when: They sign up as a player or a parent, or try to link to a child by name or code
    then:
      - The backend refuses the player or parent profile
      - No squad row or parent link is created
      - An invited child and guardian can complete signup (positive control)
    source: MVP Requirements

  - id: UC-X04
    actor: system
    title: A player cannot change their own date of birth
    requirement: J1
    status: pending
    tier: [2]
    spec_version: 1
    given: A signed-in player
    when: They try to change their date of birth through the app or the API
    then:
      - The change is refused by the backend
      - A player with no date of birth is treated as under 18
    source: MVP Requirements

  - id: UC-P08
    actor: parent
    title: Guardian invitation is sent at admission to the academy-supplied address
    requirement: J2
    status: pending
    tier: [2]
    spec_version: 2
    given: A child admitted from the academy roster with one or more guardian emails
    when: Admission completes
    then:
      - Each academy-supplied guardian email receives an invitation within 60 seconds of admission
      - It arrives in the inbox, not in spam, at both a Gmail and an Outlook address
      - The invitation names the child, the academy and the purpose
      - It carries Trak branding and a safe-sender line
      - No invitation goes to an address the academy did not supply, or to the child's own address
    source: MVP Requirements

  - id: UC-P09
    actor: parent
    title: Withdraw consent in one tap, effective immediately
    requirement: J2
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A signed-in guardian whose consent for a child is active
    when: They withdraw consent from their profile
    then:
      - Withdrawal is one action from the parent profile, with the child named
      - New development writes about the child are refused at once, including from sessions already open
      - Published content about the child is hidden from the family at once
    source: MVP Requirements

  - id: UC-A11
    actor: athlete
    title: Activate an account only after a guardian consents
    requirement: J3
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A child admitted from the academy roster
    when: Their guardian consents and they open the one-use invitation sent to the academy-supplied email
    then:
      - No activation invitation is sent before consent exists
      - The account activates linked to the child's roster row
      - A reused or expired invitation is refused, and a resend works
    source: MVP Requirements

  - id: UC-C09
    actor: coach
    title: Log a match for the squad with no invented defaults
    requirement: J4
    status: pending
    tier: [1, 2]
    spec_version: 1
    given: A signed-in coach with a squad
    when: They log a match with date, opponent and result, and each child's position, minutes, goals and assists
    then:
      - Nothing about a child's minutes, goals or assists is pre-filled
      - A child whose guardian has not consented cannot be logged
      - A retry never creates a duplicate match, and a partial failure says what was and was not saved
    source: MVP Requirements

  - id: UC-C10
    actor: coach
    title: Log a training session
    requirement: J4
    status: pending
    tier: [1]
    spec_version: 1
    given: A signed-in coach
    when: They log a training session with date, type and notes
    then:
      - A coach_sessions row is persisted with that date, type and notes
      - A failed save says so and keeps what the coach typed
    source: MVP Requirements
