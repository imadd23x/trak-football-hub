fore games can make you sluggish and sick.","No food means no energy.","Sweets give a short burst, then a drop."],"coach":"Finn ate the planned meal and felt strong to the end. His friend felt sick at half-time.","why":{"you":"Food is fuel for performance.","club":"Nutrition staff plan match-day meals.","game":"Pros take match-day food seriously."},"tip":"Burger after the game. Pasta before it."},{"id":"m12","sec":"match","wk":5,"title":"Shirt number","type":"rank","panels":[{"cap":"Kit day. Theo wanted number 9. He’s given number 16."},{"who":"Theo","think":"Number 16 is for subs."}],"q":"Rank Theo’s responses from best (1) to worst (3).","opts":["Accept it. The number doesn’t decide how he plays","Ask the kit manager politely if 9 might be free next season","Refuse to wear it"],"fb":["The number on your back means far less than what you do in the shirt.","Asking politely is fine, but don’t make it a big deal.","Refusing kit is disrespectful and pointless."],"coach":"Theo wore 16 and scored on his debut. He kept the number for the whole season.","why":{"you":"Your performance is what people remember.","club":"Kit staff have a lot to organise.","game":"Plenty of great players wore unusual numbers."},"tip":"Make your number famous."},{"id":"m13","sec":"match","wk":11,"title":"Mixed messages","type":"mcq","panels":[{"cap":"During the game, a teammate shouts at Lucas to push up. The coach wants him to stay back."},{"who":"Teammate","say":"Push up!"},{"who":"Coach","say":"Hold!"}],"q":"What should Lucas do?","opts":["Follow the coach, and tell his teammate calmly at a break what the coach asked","Follow his teammate","Shout back at his teammate","Do half of each"],"fb":["The coach’s plan comes first. A calm word helps your teammate too.","Following a teammate over the coach breaks the plan.","Shouting mid-game causes more confusion.","Half of each leaves gaps."],"coach":"Lucas held his position. At half-time he explained. The two of them worked well together after that.","why":{"you":"Clear decisions help the whole team.","club":"One plan, followed by everyone.","game":"Communication fixes confusion."},"tip":"Two voices? Follow the coach. Talk it through later."},{"id":"m14","sec":"match","wk":11,"title":"Kicked on purpose","type":"mcq","panels":[{"cap":"An opponent kicks Jayden after the ball has gone. The referee misses it."},{"who":"Jayden","think":"I want to kick him back."}],"q":"What should Jayden do?","opts":["Get up, tell the referee or the captain, and carry on","Kick him back at the next chance","Shove him","Get his teammates to target him"],"fb":["Telling the referee and keeping control protects you and the team.","Retaliation is usually what gets seen and punished.","Pushing can get you sent off.","Planned revenge is dangerous and against the code."],"coach":"Jayden told the captain, who told the referee. The referee watched the opponent closely, and he was booked ten minutes later.","why":{"you":"Staying on the pitch helps your team.","club":"Retaliation costs teams points.","game":"Control is strength."},"tip":"Kicked? Get up and stay calm. Let the referee deal with it."},{"id":"m15","sec":"match","wk":11,"title":"3–0 at half-time","type":"rank","panels":[{"cap":"Half-time. Losing 3–0. The coach comes into the changing room."},{"who":"Theo","think":"We’re finished."}],"q":"Rank Theo’s options from best (1) to worst (3).","opts":["Listen to the coach and suggest one thing the team can fix","Stay quiet and listen","Blame the defence"],"fb":["Listening and adding solutions helps the team fight back.","Listening is good, but your ideas might help too.","Blame breaks the team apart."],"coach":"Theo suggested pressing their keeper. The team scored twice. They lost 3–2, but the second half was their best of the season.","why":{"you":"Solutions beat blame.","club":"Coaches want players who think.","game":"Comebacks start in the changing room."},"tip":"At half-time, bring a solution, not blame."},{"id":"m16","sec":"match","wk":11,"title":"Play to the whistle","type":"mcq","panels":[{"cap":"Sofia thinks the ball went out. She stops running. The referee hasn’t blown."},{"who":"Opponent","say":"(carries on and crosses)"}],"q":"What should Sofia have done?","opts":["Kept playing until the whistle","Stopped. It was obviously out","Stopped and put her hand up","Argued with the assistant referee"],"fb":["Play to the whistle. Only the referee decides.","If the referee doesn’t agree, you’re left behind.","Appealing while play continues gives away a chance.","Arguing doesn’t stop the cross."],"coach":"The cross led to a goal. In the review, the coach used the clip: always play to the whistle.","why":{"you":"Never assume.","club":"Referees make the decisions.","game":"Many goals come from players who stopped."},"tip":"Play to the whistle. Every time."},{"id":"m17","sec":"match","wk":11,"title":"Sub with five minutes left","type":"mcq","panels":[{"cap":"Maya comes on in the 85th minute."},{"who":"Maya","think":"Five minutes? What’s the point?"}],"q":"What should Maya do?","opts":["Run hard, communicate and make every touch count","Jog around. It’s only five minutes","Show she’s annoyed by not trying","Try to score a wonder goal to prove a point"],"fb":["Five minutes is enough to change a game, and coaches see who makes the most of it.","Low effort tells the coach you didn’t want the minutes.","Coaches remember attitude more than minutes.","Forcing it often loses the ball. Play the right way."],"coach":"Maya pressed their keeper into a mistake, and the team scored. The coach gave her more minutes the next week.","why":{"you":"Every minute is a chance.","club":"Coaches note impact subs.","game":"Games are decided late."},"tip":"Five minutes? Make it the best five of the game."},{"id":"m18","sec":"match","wk":11,"title":"The missed penalty","type":"mcq","panels":[{"cap":"Kai misses a penalty in the 30th minute."},{"who":"Kai","think":"Everyone hates me."}],"q":"What should Kai do?","opts":["Take a breath, then focus on his next job","Hide for the rest of the game","Ask to come off","Keep replaying it in his head"],"fb":["Resetting quickly is a skill. The team needs you for 60 more minutes.","Hiding lets the mistake beat you twice.","Coming off over a miss teaches you to quit.","Replaying it keeps you stuck."],"coach":"Kai reset with his breathing routine. He set up the winner in the second half.","why":{"you":"Mistakes happen. Responses define you.","club":"Coaches look for resilience.","game":"Every great penalty taker has missed."},"tip":"Miss? Breathe, reset, next job."},{"id":"m19","sec":"match","wk":11,"title":"The booing crowd","type":"rank","panels":[{"cap":"Away game. Some home parents boo every time Ade touches the ball."},{"who":"Ade","think":"It’s getting to me."}],"q":"Rank Ade’s options from best (1) to worst (3).","opts":["Focus on his game, and tell his coach if it gets personal","Ask to come off","Shout back at the crowd"],"fb":["Focusing on your game is the best reply. Personal abuse must be reported.","Coming off is understandable if it’s really affecting you, but focusing is better.","Shouting back can get you in trouble."],"coach":"Ade kept going and played well. The coach reported the parents’ behaviour to the other club afterwards.","why":{"you":"Play your game.","club":"Clubs deal with bad spectator behaviour.","game":"You’re not alone. Tell staff."},"tip":"Boos are noise. Your coach’s voice is the one that matters."},{"id":"m20","sec":"match","wk":11,"title":"Teammate sent off","type":"mcq","panels":[{"cap":"Ben is shown a red card. He’s furious and walks towards the referee."},{"who":"Ben","say":"That’s a joke!"}],"q":"What should Lucas do?","opts":["Step in calmly and guide Ben away from the referee","Join Ben in arguing","Stay away from it","Tell the referee Ben is right"],"fb":["Calming a teammate can stop a longer ban. That’s good teamwork.","Arguing adds to the problem.","Your teammate needs help to stay calm.","Arguing for Ben is still dissent."],"coach":"Lucas guided Ben off. Ben received only a one-match ban instead of a longer one for confronting the referee.","why":{"you":"Protecting teammates includes calming them.","club":"Teams need players available.","game":"Leaders step in."},"tip":"Teammate losing it? Arm round them, walk them away."},{"id":"m21","sec":"match","wk":11,"title":"Injury time","type":"mcq","panels":[{"cap":"Last minute, 1–1. An opponent goes down injured. Ollie has the ball."},{"who":"Teammate","say":"Keep going, we can win it!"}],"q":"What should Ollie do?","opts":["Kick the ball out so the player can get help","Keep going. It’s the last minute","Look at the referee and keep playing","Shout that the player is faking"],"fb":["Player safety comes first, even in the last minute.","If he’s really hurt, the result doesn’t matter.","Kicking it out is the safe, fair choice.","You can’t know if he’s faking."],"coach":"Ollie kicked it out. The player had twisted his knee. The opposition clapped Ollie’s team off at full time.","why":{"you":"Safety first, always.","club":"The academy is proud of fair play.","game":"Results don’t matter more than people."},"tip":"Someone hurt? Ball out. Every time."},{"id":"m22","sec":"match","wk":17,"title":"The handshake line","type":"mcq","panels":[{"cap":"Full time. Lost 4–0. The handshake line forms."},{"who":"Priya","think":"I don’t want to shake their hands."}],"q":"What should Priya do?","opts":["Shake every hand and say “well played”","Walk straight off","Shake hands without looking up","Shake hands but skip the referee"],"fb":["Respect in defeat is where it counts the most.","Walking off looks bitter.","It’s better than nothing, but look them in the eye.","Referees deserve thanks too."],"coach":"Priya shook every hand. The opposition coach told the academy her team was the most respectful they’d played.","why":{"you":"Respect costs nothing.","club":"The academy is judged on how it loses.","game":"Handshakes are part of the game."},"tip":"Handshake and eye contact. Win or lose."},{"id":"m23","sec":"match","wk":17,"title":"The interview","type":"mcq","panels":[{"cap":"The club’s media team asks Leo for a quick video interview after a loss."},{"who":"Media officer","say":"How did you think it went?"}],"q":"What should Leo say?","opts":["Something positive and honest that credits the team and the opponents","“The referee cost us the game.”","“Our defence was awful.”","“Nothing to say.”"],"fb":["Positive, honest answers reflect well on you and the academy.","Blaming the referee publicly can lead to trouble.","Criticising teammates publicly breaks trust.","Refusing can look sulky. Short and positive is fine."],"coach":"Leo said: ‘They were good today. We’ll learn from it.’ The clip was posted on the academy’s page.","why":{"you":"Interviews are practice for your future.","club":"The academy’s reputation is in your words.","game":"Professionals handle media every week."},"tip":"Credit the team, respect the opponent, look ahead."},{"id":"m24","sec":"match","wk":17,"title":"The car ride home","type":"mcq","panels":[{"cap":"In the car, Sami’s dad goes through every mistake Sami made."},{"who":"Dad","say":"And why didn’t you shoot?"},{"who":"Sami","think":"I just want quiet."}],"q":"What should Sami do?","opts":["Calmly say he’d like to talk about it tomorrow","Shout at his dad to stop","Put his headphones in and ignore him","Agree with everything to make it stop"],"fb":["Asking calmly for space is mature and honest. Many parents don’t realise how it feels.","Shouting starts an argument.","Ignoring can feel rude and doesn’t solve it.","Agreeing just to end it isn’t honest."],"coach":"Sami asked to talk the next day. His dad agreed. Player care also runs sessions for parents on this.","why":{"you":"Your relationship with your parents matters most.","club":"Academies help parents support players.","game":"The car ride home is a known pressure point."},"tip":"“Can we talk about it tomorrow?” is a fair request."},{"id":"m25","sec":"match","wk":17,"title":"Praise from the other coach","type":"mcq","panels":[{"cap":"The opposition coach tells Nia: “You were brilliant today.”"},{"who":"Nia","think":"Should I say something?"}],"q":"What should Nia do?","opts":["Say thank you, and that her team helped","Shrug and walk away","Say “I know”","Ask if he’d sign her"],"fb":["Thanks and credit to the team shows class.","It can look rude.","Arrogance leaves a poor impression.","That’s not the time, and approaches go through clubs and parents."],"coach":"Nia said thank you and credited her midfield. The coach mentioned her manners to the academy.","why":{"you":"Humility is noticed.","club":"You represent the academy.","game":"Football is a small world."},"tip":"Praise? Say thanks, then share it."},{"id":"m26","sec":"match","wk":17,"title":"Rate yourself","type":"rank","panels":[{"cap":"After every game, players rate themselves out of 10 in the academy app."},{"who":"Lucas","think":"What should I put?"}],"q":"Rank Lucas’s approaches from best (1) to worst (3).","opts":["An honest score with one example of what went well and one to improve","A high score to look good","A low score so the coach says he did well"],"fb":["Honest self-assessment with examples helps coaches help you.","Inflated scores make your feedback less useful.","Fishing for praise doesn’t help you improve."],"coach":"Lucas wrote: ‘6. Good pressing, poor first touch under pressure.’ The coach agreed, and they worked on his touch.","why":{"you":"Honesty speeds up improvement.","club":"Coaches compare your view with theirs.","game":"Self-awareness is a top skill."},"tip":"Rate the performance, not your mood."},{"id":"m27","sec":"match","wk":17,"title":"Kit return","type":"mcq","panels":[{"cap":"After the game, the kit manager collects shirts in a bag."},{"who":"Teammate","say":"Just leave yours on the floor."}],"q":"What should Finn do?","opts":["Put his kit in the bag the right way out and say thanks","Leave it on the floor","Take the shirt home as a souvenir","Throw it towards the bag"],"fb":["Small acts of respect make the kit manager’s job easier.","Someone else has to tidy it up.","Kit belongs to the academy.","Half effort is still leaving work for someone else."],"coach":"Finn put his kit in the bag and thanked the kit manager. The kit manager remembered him at the end-of-season awards.","why":{"you":"Respect is shown in small actions.","club":"Every staff member matters.","game":"Professionals respect kit staff."},"tip":"Kit in the bag, right way out, say thanks."},{"id":"m28","sec":"match","wk":17,"title":"Team photo","type":"mcq","panels":[{"cap":"After losing the tournament final, the academy wants a team photo."},{"who":"Teammate","say":"I’m not smiling for a loser’s photo."}],"q":"What should Maya do?","opts":["Join the photo and encourage others to join too","Refuse to join","Join but turn away","Make a rude gesture in the photo"],"fb":["Reaching a final is an achievement. The photo marks it.","Refusing looks bitter.","Turning away still shows bitterness.","Rude gestures in photos last forever."],"coach":"Maya joined and got others to come. Years later, it’s one of the squad’s favourite photos.","why":{"you":"Memories last longer than results.","club":"The academy celebrates journeys, not just wins.","game":"Finals are rare."},"tip":"Final lost? Still smile. You got there."},{"id":"m29","sec":"match","wk":17,"title":"Recovery after the game","type":"mcq","panels":[{"cap":"After the game, the plan is a protein snack, stretching and an early night."},{"who":"Friends","say":"Come to the shops and the park!"}],"q":"What should Ade do?","opts":["Follow the recovery plan, and see friends for a short time","Spend all evening out","Skip food and stretching","Play games until midnight"],"fb":["Recovery and a short time with friends is a good balance.","Long nights after games slow recovery.","Food and stretching are part of recovering.","Late nights hurt sleep and recovery."],"coach":"Ade followed his plan and saw friends for an hour. He felt fresh at Monday training.","why":{"you":"Recovery is part of performance.","club":"Staff plan recovery for a reason.","game":"Balance keeps football fun."},"tip":"After a game: eat, stretch, sleep."},{"id":"m30","sec":"match","wk":17,"title":"Leaving early","type":"mcq","panels":[{"cap":"After a game, Jayden’s parents want to leave before the team debrief."},{"who":"Mum","say":"Come on, we’re in a rush."}],"q":"What should Jayden do?","opts":["Ask his parents if he can stay for the short debrief, or let the coach know he has to go","Just leave without saying anything","Pretend he doesn’t hear the coach","Tell his parents the debrief is optional"],"fb":["The debrief is part of the game. If you must leave, telling the coach is respectful.","Leaving without a word is rude.","Pretending isn’t honest.","It isn’t optional, and lying to your parents isn’t either."],"coach":"Jayden asked his mum, who agreed to wait 10 minutes. He heard the feedback he needed.","why":{"you":"Debriefs help you improve.","club":"Coaches value players who stay.","game":"Communication solves clashes."},"tip":"Need to leave? Tell the coach first."},{"id":"o4","sec":"off","wk":6,"title":"The nasty comment","type":"mcq","panels":[{"cap":"Amara posts a clip of her goal. A stranger comments: “Lucky. You’re rubbish.”"},{"who":"Amara","think":"I want to reply."}],"q":"What should Amara do?","opts":["Don’t reply. Delete or hide it, block the account, and tell a trusted adult if it carries on","Reply with something clever","Reply with something rude","Delete her post and stop posting"],"fb":["Not engaging takes away their power. Adults can help if it becomes abuse.","Replies keep it going, even clever ones.","Rude replies can get you in trouble, and they get screenshotted.","You don’t have to give up posting because of one person."],"coach":"Amara hid the comment and blocked the account. She told her mum, who helped her tighten her privacy settings.","why":{"you":"Your peace is worth more than winning an argument.","club":"The academy can help with online abuse.","game":"Many players get online hate. Silence is strength."},"tip":"Don’t feed the trolls. Block, hide, tell."},{"id":"o5","sec":"off","wk":6,"title":"The funny photo","type":"mcq","panels":[{"cap":"Finn has a funny photo of Lucas falling over in training."},{"who":"Finn","think":"This would get loads of likes."}],"q":"What should Finn do?","opts":["Ask Lucas before posting anything","Post it. It’s just a laugh","Post it with a caption mocking him","Send it to the group chat instead"],"fb":["Asking first respects your teammate. If he says no, that’s the answer.","Something funny to you can be embarrassing for him.","Mocking captions turn a laugh into bullying.","Group chats get screenshotted too."],"coach":"Lucas said no. Finn deleted it. Lucas later sent Finn a different photo he was happy to share.","why":{"you":"Ask before you post other people.","club":"Training images may belong to the academy.","game":"Respect online is the same as respect in person."},"tip":"Not your face? Ask first."},{"id":"o6","sec":"off","wk":6,"title":"Training clip","type":"mcq","panels":[{"cap":"Kai films a training clip for his story. The coach’s tactics board is in the background."},{"who":"Kai","think":"It looks cool."}],"q":"What should Kai do?","opts":["Check the academy’s social media rules before posting anything from training","Post it. Nobody will notice","Post it but blur his face","Post it to close friends only"],"fb":["Academies often have rules about posting from training. Tactics can be private.","Other clubs watch academy players’ accounts.","Blurring your face doesn’t hide the tactics board.","Close friends can still screenshot it."],"coach":"Kai checked. The academy didn’t allow training content without permission. He asked the media team instead, who posted a clip officially.","why":{"you":"Rules protect you and the team.","club":"The academy has a media team for this.","game":"Professional clubs strictly control training footage."},"tip":"From training? Ask before you post."},{"id":"o7","sec":"off","wk":6,"title":"Buy followers","type":"mcq","panels":[{"cap":"An advert offers Jayden 10,000 followers for £10."},{"who":"Jayden","think":"I’d look like a proper pro."}],"q":"What should Jayden do?","opts":["Ignore it. Real followers come from real content","Buy them. It’s only £10","Ask friends to buy some too","Buy them and pretend they’re real"],"fb":["Fake followers are obvious and can make your account look dodgy to clubs.","Fake followers can get accounts flagged, and they aren’t real fans.","Spreading it doesn’t make it better.","Pretending is dishonest, and people notice."],"coach":"Jayden ignored it. He posted his training progress instead and slowly gained real followers.","why":{"you":"Real is better than fake.","club":"Clubs check social media authenticity.","game":"Your reputation is built over years."},"tip":"Followers don’t make you a footballer. Football does."},{"id":"o8","sec":"off","wk":6,"title":"Gaming abuse","type":"mcq","panels":[{"cap":"Playing online, another player starts sending racist messages to Sami."},{"who":"Sami","think":"Should I give it back?"}],"q":"What should Sami do?","opts":["Mute and report the player, and tell a trusted adult","Send abuse back","Keep playing and ignore it","Quit the game and tell nobody"],"fb":["Reporting and telling an adult is how abuse gets stopped.","Sending abuse back can get your account banned too.","Ignoring it lets them carry on with others.","Quitting protects you, but the abuser gets away with it."],"coach":"Sami reported the player and told his mum. The account was banned within a day.","why":{"you":"You don’t have to put up with abuse anywhere.","club":"Academies take racism seriously, online and off.","game":"Reporting protects others."},"tip":"Abuse online? Mute, report, tell."},{"id":"o9","sec":"off","wk":6,"title":"What to share","type":"rank","panels":[{"cap":"Maya is setting up her social media profile."},{"who":"Maya","think":"What’s OK to share?"}],"q":"Rank what Maya shares from safest (1) to least safe (3).","opts":["Match results and team photos, with permission","Her school name in her bio","Her home address and daily routine"],"fb":["Results and approved photos are safe, positive content.","Your school name can help strangers find you. Leave it out.","Your address and routine let strangers know where you’ll be. Never share them."],"coach":"Maya kept her account private, with no school or location. Player care praised her settings in their online safety session.","why":{"you":"Privacy protects you.","club":"Academies teach online safety.","game":"Young players in the spotlight need extra care."},"tip":"Never post where you are or where you’ll be."},{"id":"o10","sec":"off","wk":6,"title":"The screenshot","type":"mcq","panels":[{"cap":"A teammate screenshots the coach’s message to the group and adds a mocking caption."},{"who":"Teammate","say":"Share it on your story!"}],"q":"What should Theo do?","opts":["Refuse, and suggest they delete it","Share it. It’s funny","Like it but don’t share it","Send it to friends at other clubs"],"fb":["Mocking staff publicly damages trust and breaks academy rules.","Sharing makes you part of it.","A like is joining in.","Spreading it to other clubs makes it worse."],"coach":"Theo refused. The teammate deleted it before the coach found out.","why":{"you":"Loyalty includes respecting staff.","club":"Private messages stay private.","game":"Screenshots travel."},"tip":"Group messages from staff stay in the group."},{"id":"o11","sec":"off","wk":6,"title":"The challenge","type":"mcq","panels":[{"cap":"A dangerous viral challenge is trending. Friends dare Ollie to do it."},{"who":"Friends","say":"Everyone’s doing it!"}],"q":"What should Ollie do?","opts":["Say no. It’s not worth an injury","Do it once quickly","Do a safer version","Film a friend doing it"],"fb":["Dangerous challenges cause real injuries. Saying no takes courage.","Once is enough to get hurt.","If it’s dangerous, a ‘safer’ version often isn’t.","Encouraging others puts them at risk."],"coach":"Ollie said no. A boy at another school broke his wrist doing the challenge that week.","why":{"you":"Your body is your career.","club":"The academy needs you healthy.","game":"Likes aren’t worth injuries."},"tip":"If it could hurt you, it’s not a challenge. It’s a risk."},{"id":"o12","sec":"off","wk":6,"title":"The rival fan account","type":"rank","panels":[{"cap":"An anonymous account mocks players from a rival academy. Teammates follow it."},{"who":"Teammate","say":"Follow it! It’s hilarious."}],"q":"Rank Priya’s options from best (1) to worst (3).","opts":["Don’t follow, and say it isn’t fair","Don’t follow, but say nothing","Follow and like the posts"],"fb":["Not engaging and saying why can change others’ minds.","Not following is good, but speaking up helps more.","Liking mocking posts is joining in bullying."],"coach":"Priya said she wouldn’t follow it. A few others unfollowed too. The academy later asked players to report such accounts.","why":{"you":"Online bullying is still bullying.","club":"Rival players are young people too.","game":"Your clicks show your values."},"tip":"Would you want an account about you?"},{"id":"o13","sec":"off","wk":12,"title":"Primary school visit","type":"mcq","panels":[{"cap":"The academy asks players to help at a primary school football day."},{"who":"Mateo","think":"This is going to be boring."}],"q":"What should Mateo do?","opts":["Get stuck in, encourage the kids and make it fun","Do the minimum","Show off his skills and take the ball off the kids","Stand at the side on his phone"],"fb":["Young kids look up to academy players. Your energy makes their day.","The kids will notice.","Showing off makes kids feel worse, not inspired.","Being on your phone tells the kids you don’t care."],"coach":"Mateo coached a group of seven-year-olds. One of the kids’ parents wrote to the academy to thank him.","why":{"you":"Giving back feels good.","club":"Community work is part of the academy’s role.","game":"Footballers are role models."},"tip":"To a young kid, you’re a star. Act like a good one."},{"id":"o14","sec":"off","wk":12,"title":"PE lesson","type":"mcq","panels":[{"cap":"In school PE, Leo is by far the best footballer."},{"who":"Classmate","say":"Pass it to me!"},{"who":"Leo","think":"He’ll just lose it."}],"q":"What should Leo do?","opts":["Include everyone and encourage his classmates","Dribble past everyone himself","Criticise his classmates’ skills","Refuse to try because it’s too easy"],"fb":["Making PE fun for everyone shows the academy’s values outside football.","Taking over spoils it for others.","Criticism makes people hate PE.","Refusing is disrespectful to your teacher."],"coach":"Leo passed and encouraged. His PE teacher wrote a positive note to his parents.","why":{"you":"Kindness to beginners shows real class.","club":"Teachers talk to academies.","game":"Everyone deserves to enjoy sport."},"tip":"In PE, be the player who makes others better."},{"id":"o15","sec":"off","wk":12,"title":"Chores","type":"mcq","panels":[{"cap":"Sofia’s mum asks her to help with the washing-up."},{"who":"Sofia","say":"I’m an athlete. I need to rest!"}],"q":"What should Sofia do?","opts":["Help with the washing-up","Refuse because she’s tired from training","Do it badly so she isn’t asked again","Bargain for money first"],"fb":["Home life matters too. Athletes are still part of a family.","Families also give up a lot for academy football.","Doing it badly on purpose isn’t fair.","Helping your family shouldn’t need payment."],"coach":"Sofia helped. Her mum mentioned at parents’ evening how grounded she was.","why":{"you":"Football doesn’t make you special at home.","club":"Families support academy players in many ways.","game":"Grounded players handle pressure better."},"tip":"Thank the people who drive you to training. Then help them."},{"id":"o16","sec":"off","wk":12,"title":"Little brother","type":"mcq","panels":[{"cap":"Ben’s little brother wants to play football in the garden."},{"who":"Brother","say":"Please, Ben!"},{"who":"Ben","think":"I’m tired."}],"q":"What should Ben do?","opts":["Play for ten minutes and let his brother have fun","Say no","Play, but beat him every time and laugh","Tell him to watch YouTube instead"],"fb":["Ten minutes means the world to a little brother. Joy is part of football.","Fine sometimes, but it costs little to play.","Crushing a little kid isn’t fun for him.","He wants you, not a screen."],"coach":"Ben played for ten minutes. His brother joined a local team the next month.","why":{"you":"Football started as fun. Keep that.","club":"Families are part of the academy journey.","game":"You’re someone’s hero."},"tip":"Share the game with someone younger."},{"id":"o17","sec":"off","wk":12,"title":"In the park","type":"mcq","panels":[{"cap":"Theo is in the park wearing his academy tracksuit. His friends start damaging a bench."},{"who":"Friend","say":"Give us a hand!"}],"q":"What should Theo do?","opts":["Refuse and walk away","Join in. Nobody will know","Take his jacket off and join in","Film it"],"fb":["Damaging property is wrong, with or without the badge. Walking away is right.","Someone usually knows, and it’s still wrong.","Hiding the badge doesn’t change what you’re doing.","Filming makes you part of it."],"coach":"Theo walked away. The friends were caught on CCTV. Theo wasn’t involved.","why":{"you":"Your choices away from football matter.","club":"The badge is known in the community.","game":"Walking away is a strong choice."},"tip":"If you wouldn’t do it in front of your coach, don’t do it."},{"id":"o18","sec":"off","wk":12,"title":"Told off at school","type":"mcq","panels":[{"cap":"Ollie is told off by a teacher for talking in class."},{"who":"Ollie","say":"I’m tired. I play for the academy, you know."}],"q":"What should Ollie have done?","opts":["Apologised and got back to work","Mentioned the academy to get sympathy","Argued that the teacher was singling him out","Stayed silent, then complained to friends"],"fb":["Accepting it shows respect. Being at an academy doesn’t change school rules.","Using the academy as an excuse annoys teachers and reflects badly.","Arguing makes it worse.","Complaining doesn’t fix anything."],"coach":"The teacher emailed the academy. Ollie apologised the next day and was more careful after that.","why":{"you":"Respect for teachers is part of the code.","club":"Academies hear from schools.","game":"Being an academy player isn’t a free pass."},"tip":"Academy players follow school rules like everyone else."},{"id":"o19","sec":"off","wk":12,"title":"Photo request","type":"mcq","panels":[{"cap":"After a game, a little boy asks Nia for a photo."},{"who":"Boy","say":"You’re my favourite player!"},{"who":"Nia","think":"Me?"}],"q":"What should Nia do?","opts":["Smile, say yes and chat to him for a moment","Say she’s busy","Take the photo without smiling","Ask for money"],"fb":["You could make a young fan’s week. It takes 30 seconds.","Saying no can upset a young fan.","It’s better than nothing, but a smile costs nothing.","Never ask for money from fans."],"coach":"Nia took a selfie and signed his programme. His mum sent the academy the photo the next day.","why":{"you":"Being a role model starts early.","club":"Fans are part of the club.","game":"Kindness creates lifelong fans."},"tip":"If a kid asks, always say yes (with their parent nearby)."},{"id":"o20","sec":"off","wk":12,"title":"Charity match","type":"rank","panels":[{"cap":"The academy asks for volunteers for a charity match on Sunday."},{"who":"Kai","think":"It’s my day off."}],"q":"Rank Kai’s options from best (1) to worst (3).","opts":["Volunteer for part of the day","Say politely that he needs the rest","Agree, then not turn up"],"fb":["Giving some time to charity matters, and part of a day is fine.","Rest is important, and saying no politely is OK.","Breaking a commitment is worse than saying no."],"coach":"Kai helped for two hours. The event raised money for the local hospital.","why":{"you":"Giving back is part of being in a club.","club":"The community supports the academy.","game":"It’s OK to say no politely."},"tip":"If you say yes, turn up."},{"id":"o21","sec":"off","wk":12,"title":"Bullying at school","type":"mcq","panels":[{"cap":"At school, Priya sees a younger girl being bullied."},{"who":"Friend","say":"Stay out of it."}],"q":"What should Priya do?","opts":["Check on the girl, and tell a teacher","Stay out of it","Confront the bullies herself","Film it as evidence"],"fb":["Supporting the girl and telling a teacher is safe and effective.","Silence lets bullying continue.","Confronting bullies can put you at risk. Get an adult.","Filming can make the victim feel worse."],"coach":"Priya told a teacher, who stepped in. The younger girl now says hello to Priya every day.","why":{"you":"Standing up for others is strength.","club":"Your values don’t stop at the academy gates.","game":"Bullying stops when people speak up."},"tip":"See bullying? Help the person, tell an adult."},{"id":"o22","sec":"off","wk":18,"title":"Energy drinks","type":"rank","panels":[{"cap":"At a friend’s house, everyone is drinking big cans of energy drink."},{"who":"Friend","say":"Want one?"}],"q":"Rank Jayden’s choices from best (1) to worst (3).","opts":["Water or juice","One small can","Two big cans"],"fb":["Water keeps you healthy and sleeping well.","Energy drinks aren’t recommended for under-16s. Even one can affect your sleep.","High caffeine can affect your heart and your sleep."],"coach":"Jayden had water. He slept well and trained well the next day.","why":{"you":"Caffeine affects young bodies more.","club":"Academies advise against energy drinks.","game":"Sleep is your secret weapon."},"tip":"Under 16? Skip the energy drinks."},{"id":"o23","sec":"off","wk":18,"title":"The vape","type":"mcq","panels":[{"cap":"At a party, someone offers Ade a vape."},{"who":"Teen","say":"Go on, it’s just fruit flavour."}],"q":"What should Ade do?","opts":["Say “No thanks” and move on, or leave if he’s uncomfortable","Try it once","Hold it to fit in but not use it","Take it home"],"fb":["Vaping is addictive and harms your lungs. A simple no is enough.","Nicotine is very addictive, even after a few tries.","Holding it means others think you use it, and photos happen.","Taking it home brings the problem with you."],"coach":"Ade said no and played music instead. Nobody pushed him.","why":{"you":"Your lungs are your engine.","club":"Academy players are tested and watched.","game":"Saying no is easier than you think."},"tip":"“No thanks, I play football” works every time."},{"id":"o24","sec":"off","wk":18,"title":"Sleepover","type":"mcq","panels":[{"cap":"Friday sleepover. Match on Saturday at 10am."},{"who":"Friends","say":"We’re staying up all night!"}],"q":"What should Lucas do?","opts":["Go, but sleep at a sensible time, or leave early","Stay up all night with everyone","Skip the match and stay at the sleepover","Drink loads of fizzy drinks to stay awake"],"fb":["You can enjoy friends and still prepare. That’s balance.","No sleep means a poor game and a higher injury risk.","Missing a match for a sleepover breaks your commitment.","Sugar and caffeine late at night ruin sleep."],"coach":"Lucas went to sleep at 11pm. He played well in the morning, and his friends still had fun.","why":{"you":"Balance keeps football and friends.","club":"Coaches plan around your rest.","game":"Professionals protect their sleep."},"tip":"Friends and football can both win."},{"id":"o25","sec":"off","wk":18,"title":"Free boots","type":"mcq","panels":[{"cap":"A boot company messages Nia: free boots if she posts about them."},{"who":"Nia","think":"Free boots!"}],"q":"What should Nia do?","opts":["Show her parents and the academy before replying","Accept and post straight away","Ask for more free stuff","Agree but don’t tell anyone"],"fb":["Academies often have rules about sponsorship. Parents and staff can check if it’s real and allowed.","Some ‘offers’ are scams, and sponsorship can break academy rules.","Even if it’s real, you need advice first.","Secret deals cause problems later."],"coach":"Nia’s parents and the academy checked. It was a real company, but the deal wasn’t allowed. She thanked them and said no.","why":{"you":"Checking first keeps you safe.","club":"Academies protect players from bad deals.","game":"Professionals have advisers for this."},"tip":"Any offer? Parents and academy first."},{"id":"o26","sec":"off","wk":18,"title":"The betting app","type":"mcq","panels":[{"cap":"A 16-year-old friend shows Kai a betting app on his phone."},{"who":"Friend","say":"Bet on our match! Easy money."}],"q":"What should Kai do?","opts":["Say no. Gambling is illegal under 18, and betting on football can break football rules","Bet a small amount","Bet on another game instead","Ask his friend to place a bet for him"],"fb":["Gambling is illegal under 18, and betting on football can break football rules. No is the only answer.","Even small bets are illegal at your age.","It’s still gambling, and still illegal.","Getting someone else to bet for you is still breaking the rules."],"coach":"Kai said no. He told player care, who ran a session on gambling for the whole squad.","why":{"you":"Betting can become addictive.","club":"Football has strict rules on players betting.","game":"Careers have ended because of betting."},"tip":"Football and betting don’t mix. Ever."},{"id":"o27","sec":"off","wk":18,"title":"The fast lift","type":"mcq","panels":[{"cap":"After training, a teammate’s 17-year-old brother offers Sofia a lift. He drives very fast."},{"who":"Brother","say":"Hop in!"},{"who":"Sofia","think":"Mum’s 20 minutes away."}],"q":"What should Sofia do?","opts":["Say thanks but no, and wait for her mum or call her","Get in. It’s quicker","Get in and ask him to slow down","Get in but not tell her mum"],"fb":["Your safety matters more than 20 minutes. Your parents should know how you get home.","Fast driving puts everyone in danger.","Asking might not work, and you can’t get out once you’re moving.","Your mum needs to know where you are."],"coach":"Sofia waited and told her mum about the offer. Her mum spoke to the academy about safe lifts.","why":{"you":"Your safety comes first.","club":"Academies have rules about travel.","game":"Saying no politely is always OK."},"tip":"Parents should always know how you get home."},{"id":"o28","sec":"off","wk":18,"title":"Too much","type":"mcq","panels":[{"cap":"Exams, four sessions a week and a long journey. Maya feels overwhelmed."},{"who":"Maya","think":"I can’t keep up with everything."}],"q":"What should Maya do?","opts":["Talk to player care or a trusted adult about how she feels","Keep it to herself and push on","Quietly stop doing her homework","Quit football without talking to anyone"],"fb":["Feeling overwhelmed is common. Talking is the first step to fixing it.","Bottling it up usually makes things worse.","Dropping school creates new problems.","Big decisions are best made with support."],"coach":"Maya spoke to player care. They agreed a lighter week during exams. She felt in control again.","why":{"you":"Asking for help is a strength.","club":"Academies have staff for wellbeing.","game":"Your wellbeing comes before football."},"tip":"Feeling too much? Say it out loud to someone you trust."},{"id":"o29","sec":"off","wk":18,"title":"Bedtime routine","type":"rank","panels":[{"cap":"Theo struggles to sleep before matches."},{"who":"Theo","think":"How can I sleep better?"}],"q":"Rank Theo’s routines from best (1) to worst (3).","opts":["Same bedtime, phone away, reading before sleep","Same bedtime, but scrolling in bed","Gaming until he’s tired"],"fb":["Routines and no screens help your brain switch off.","A regular bedtime helps, but scrolling keeps your brain awake.","Gaming late keeps your brain buzzing."],"coach":"Theo started reading instead of scrolling. His sleep tracker showed he fell asleep 30 minutes earlier.","why":{"you":"Sleep makes you faster and sharper.","club":"Sports science staff track sleep.","game":"Professionals protect their sleep."},"tip":"Phone down 30 minutes before bed."},{"id":"o30","sec":"off","wk":18,"title":"Holiday kickabout","type":"mcq","panels":[{"cap":"On holiday abroad, Leo joins a kickabout with local kids. He’s wearing his academy shirt."},{"who":"Leo","think":"I could show them how good I am."}],"q":"What should Leo do?","opts":["Join in, pass, share the ball and have fun","Show off his skills and humiliate them","Refuse because they aren’t good enough","Tell everyone he’s going to be a pro"],"fb":["Football is a shared language. Sharing the ball makes friends.","Humiliating kids on holiday isn’t a good look.","Football is for everyone.","Bragging doesn’t make friends."],"coach":"Leo played all week with the local kids. They swapped shirts on the last day.","why":{"you":"Football connects people everywhere.","club":"You represent the academy abroad.","game":"The game is better shared."},"tip":"Wherever you are, play the game the right way."}];/*LIBRARY:END*/

/* ---------- pure helpers ---------- */
const DAY = 86400000;
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(key, n) {
  const idx = Array.from({ length: n }, (_, i) => i); let h = hash(key);
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}
/* Week number for a season that starts on `startsOn` (YYYY-MM-DD). null = no season set, 0 = not started, max 18. */
function weekFrom(startsOn, nowMs) {
  if (!startsOn || !/^\d{4}-\d{2}-\d{2}$/.test(startsOn)) return null;
  const d0 = new Date(startsOn + "T00:00:00").getTime();
  if (isNaN(d0)) return null;
  const days = Math.floor((nowMs - d0) / DAY);
  return days < 0 ? 0 : Math.min(18, Math.floor(days / 7) + 1);
}
function isGood(sc, a) { return sc.type === "mcq" ? a.pick === 0 : a.order[0] === 0; }
function isExact(sc, a) { return sc.type === "mcq" ? a.pick === 0 : a.order.join("") === "012"; }
/* Section levels. Secure: 5+ answered with 70%+ best calls. Leading: 15+ answered, 80%+ best calls and 2+ correct recalls. */
function masteryOf(sec, answers, recalls) {
  const list = ACADEMY.filter(s => s.sec === sec);
  const done = list.filter(s => answers[s.id]);
  if (!done.length) return "Not started";
  const rate = done.filter(s => isGood(s, answers[s.id])).length / done.length;
  const recalled = list.filter(s => recalls[s.id] && recalls[s.id].ok).length;
  if (done.length >= 15 && rate >= 0.8 && recalled >= 2) return "Leading";
  if (done.length >= 5 && rate >= 0.7) return "Secure";
  return "Learning";
}
function weekCalls(picks, w) { const ids = WEEKS[w - 1] || []; return picks.filter(p => ids.includes(p.s)).length; }
function weekNeed(w, size) { return Math.max(1, Math.ceil(size * (WEEKS[w - 1] || []).length * 0.6)); }
/* Consecutive weeks (ending this week, or last week if this week isn't there yet) where the squad made 60% of the week's calls between them. */
function streakOf(picks, week, size) {
  if (!week) return 0;
  let w = week;
  if (weekCalls(picks, w) < weekNeed(w, size)) w--;
  let n = 0;
  while (w >= 1 && weekCalls(picks, w) >= weekNeed(w, size)) { n++; w--; }
  return n;
}
function recallDue(answers, recalls, nowMs) {
  let best = null;
  for (const [sid, a] of Object.entries(answers)) {
    if (!BY_ID[sid] || nowMs - a.at < 7 * DAY) continue;
    const r = recalls[sid];
    if (r && nowMs - r.at < 21 * DAY) continue;
    if (!best || a.at < answers[best].at) best = sid;
  }
  return best;
}

const LS_KEY = "play-it-right-v2";
const S = {
  tab: "academy", open: null, seniorPillar: "commit",

  draft: {}, recallMsg: null, suggestDraft: "", suggestMsg: "", cfgMsg: "",
  cfg: null, picks: [], suggestions: [], live: false, canEdit: false, speaking: null

let DB = null, UID = null;
/* Trak: this page runs inside every signed-in account on a shared device and
   knows nothing about who is signed in, so answers stay in memory for this
   visit only. Earlier visits saved them under one origin-wide key; remove it. */
try { localStorage.removeItem(LS_KEY); } catch (e) {}
function saveLocal() {}
let saving = false, saveAgain = false;
async function saveProg() {
  saveLocal();
  if (!DB || !UID) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await DB.doc("data/users/" + UID + "/progress").set(JSON.parse(JSON.stringify(S.prog))); } catch (e) {}
  saving = false;
  if (saveAgain) { saveAgain = false; saveProg(); }
}

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const txt = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; return e; };
const secOf = id => CODE.find(c => c.id === id);
function week() { return weekFrom(S.cfg && S.cfg.startsOn, Date.now()); }
function unlocked() { const w = week(); return w == null ? 18 : w; }
function weekOfScenario(sid) { return BY_ID[sid].wk; }

/* ---------- render ---------- */
let pendingRender = false;
function scheduleRender() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });

function render() {
  const y = window.scrollY;
  const libOk = !S.live || S.canEdit;
  document.getElementById("tab-library").hidden = !libOk;
  if (S.tab === "library" && !libOk) S.tab = "academy";
  document.querySelectorAll(".track-btn").forEach(b => b.setAttribute("aria-selected", String(b.dataset.track === S.tab)));
  renderTell();
  const view = document.getElementById("view");
  view.innerHTML = "";
  view.classList.toggle("senior", S.tab === "senior");
  if (S.tab === "coach") view.appendChild(coachView());
  else if (S.tab === "senior") view.appendChild(seniorView());
  else if (S.tab === "library") view.appendChild(libraryView());
  else view.appendChild(academyView());
  window.scrollTo(0, y);
}

/* Who to tell: never scored, reachable from every tab */
function renderTell() {
  const box = document.getElementById("tell");
  box.innerHTML = "";
  box.appendChild(el("h2", null, "Need to talk to someone?"));
  box.appendChild(el("p", null, "This part is never scored and nothing you read here is recorded. <b>You will never be in trouble for telling.</b>"));
  const c = S.cfg || {};
  const contacts = el("div", "contacts");
  const add = (label, value) => { if (!value) return; const d = el("div", "contact"); d.appendChild(txt("b", null, label)); d.appendChild(txt("span", null, value)); contacts.appendChild(d); };
  add("Safeguarding lead", c.safeguardingLead);
  add("Player care", c.playerCare);
  add("Helpline", c.helpline);
  if (!contacts.children.length) contacts.appendChild(txt("p", "muted", "Your academy will add names here. Until then, tell a parent, your coach, or any academy staff member you trust."));
  box.appendChild(contacts);
  box.appendChild(el("p", null, "<b>Always tell a trusted adult if:</b>"));
  box.appendChild(el("ul", null, "<li>An adult at the club asks you to keep messages, gifts or meetings secret.</li><li>Someone online offers you trials, money or gifts, or asks for photos or your number.</li><li>Someone hurts you, threatens you, or makes you feel unsafe.</li><li>You’re being bullied, in person or online.</li><li>You feel low, worried, or not like yourself.</li>"));
}
document.getElementById("tell-btn").onclick = () => {

function academyView() {
  const root = el("div", "view");
  root.appendChild(el("p", "promise", "<b>Your answers are private.</b> Staff only see squad totals, never names, and nothing here is part of your review or retention decisions."));

  /* Corner progress */
  const corner = el("section", "corner");
  corner.appendChild(el("div", "eyebrow", "Your psychological and social corner"));
  const tiles = el("div", "tiles");
  CODE.forEach(c => {
    const lv = masteryOf(c.id, S.prog.answers, S.prog.recalls);
    const t = el("div", "tile");
    t.appendChild(txt("span", "nm", c.name));
    t.appendChild(txt("span", "lvl " + lv.toLowerCase().replace(" ", "-"), lv));
    tiles.appendChild(t);
  });
  corner.appendChild(tiles);
  corner.appendChild(el("p", "muted small", "Learning → Secure (5+ answered, 70% best calls) → Leading (15+ answered, 80% best calls, 2 correct recalls)."));
  root.appendChild(corner);

  /* Squad strip */
  const w = week();
  if (S.live && S.cfg && w) {
    const size = Number(S.cfg.squadSize) || 20;
    const st = streakOf(S.picks, w, size);
    const calls = weekCalls(S.picks, w), need = weekNeed(w, size);
    const sq = el("section", "squad");
    const left = el("div");
    left.appendChild(txt("div", "eyebrow", (S.cfg.squadName || "Squad") + " streak"));
    left.appendChild(el("div", "big", `${st} <span class="muted small">week${st === 1 ? "" : "s"}</span>`));
    sq.appendChild(left);
    sq.appendChild(el("p", "muted small", `This week the squad has made <b>${calls}</b> calls. <b>${need}</b> between you keeps the streak going (60% of ${size} players × 10 moments).`));
    root.appendChild(sq);
  }

  /* Recall */
  const due = recallDue(S.prog.answers, S.prog.recalls, Date.now());
  if (S.recallMsg) root.appendChild(recallResult());
  else if (due) root.appendChild(recallCard(due));

  /* Weeks: 10 match moments each */
  const n = unlocked();
  const list = el("section", "drops");
  if (n === 0) {
    list.appendChild(el("div", "eyebrow", "Match moments"));
    list.appendChild(txt("p", "locked", "The first 10 match moments drop on " + new Date(S.cfg.startsOn + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) + "."));
    root.appendChild(list); root.appendChild(suggestBox());
    return root;
  }
  if (!S.viewWeek || S.viewWeek > n) S.viewWeek = w ? Math.min(w, n) : 1;
  const vw = S.viewWeek;
  const rail = el("div", "rail"); rail.setAttribute("aria-label", "Weeks");
  for (let k = n; k >= 1; k--) {
    const done = WEEKS[k - 1].filter(id => S.prog.answers[id]).length;
    const b = el("button", "chip" + (done === 10 ? " done" : ""), `<span class="n">${k}</span>${weekSec(k).name} · ${done}/10`);
    b.id = "week-" + k; b.setAttribute("aria-pressed", String(k === vw));
    if (k === vw) b.setAttribute("aria-selected", "true");
    b.onclick = () => { S.viewWeek = k; S.open = null; render(); };
    rail.appendChild(b);
  }
  list.appendChild(el("div", "eyebrow", w == null ? "All 18 weeks open (no season start set)" : `This is week ${w} of 18`));
  list.appendChild(rail);
  const ids = WEEKS[vw - 1];
  const doneN = ids.filter(id => S.prog.answers[id]).length;
  list.appendChild(el("h3", null, `Week ${vw}: ${weekSec(vw).name}`));
  list.appendChild(el("p", "muted small", `${doneN} of 10 done. Aim for two a day, Monday to Friday.`));
  if (!S.open || !ids.includes(S.open)) S.open = ids.find(id => !S.prog.answers[id]) || ids[0];
  ids.forEach((sid, i) => {
    const sc = BY_ID[sid];
    const b = el("button", "drop");
    b.id = "drop-" + sid;
    b.setAttribute("aria-current", String(sid === S.open));
    const status = S.prog.answers[sid] ? `<span class="st done">Done</span>` : `<span class="st todo">To do</span>`;
    const kind = sc.type === "rank" ? "Rank three" : "Make the call";
    b.innerHTML = `<span class="wk">${vw}.${i + 1}</span><span class="tt"><b>${sc.title}</b><span>${kind}${sc.next ? " · with a follow-up" : ""}</span></span>${status}`;
    b.onclick = () => { S.open = sid; render(); document.getElementById("scen").scrollIntoView({ block: "start", behavior: "smooth" }); };
    list.appendChild(b);
  });
  if (w != null && n < 18 && S.cfg && S.cfg.startsOn) {
    const next = new Date(new Date(S.cfg.startsOn + "T00:00:00").getTime() + n * 7 * DAY);
    list.appendChild(txt("p", "locked", `Next drop: week ${n + 1} (${weekSec(n + 1).name}), on ${next.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}.`));
  }
  root.appendChild(list);

  if (S.open) root.appendChild(scenarioView(BY_ID[S.open]));
  root.appendChild(suggestBox());
  return root;
}

function speak(sc) {
  try {
    if (!("speechSynthesis" in window)) return;
    if (S.speaking === sc.id) { speechSynthesis.cancel(); S.speaking = null; render(); return; }
    speechSynthesis.cancel();
    const a = S.prog.answers[sc.id];
    const shown = order(sc.id, sc.opts.length);
    const parts = sc.panels.map(p => p.cap || `${p.who} ${p.think ? "thinks" : "says"}: ${p.say || p.think}`);
    parts.push(sc.q);
    shown.forEach((oi, pos) => parts.push(`Option ${"ABCD"[pos]}: ${sc.opts[oi]}.`));
    if (a) parts.push("What the coach saw. " + sc.coach + " " + sc.tip);
    const u = new SpeechSynthesisUtterance(parts.join(" "));
    u.rate = 0.95;
    u.onend = u.onerror = () => { S.speaking = null; scheduleRender(); };
    S.speaking = sc.id; speechSynthesis.speak(u); render();
  } catch (e) { S.speaking = null; }
}

async function lockIn(sc) {
  const d = S.draft[sc.id];
  const a = { at: Date.now(), conf: d.conf };
  if (sc.type === "mcq") a.pick = d.pick; else a.order = d.order.slice();
  S.prog.answers[sc.id] = a;
  delete S.draft[sc.id];
  render();
  saveProg();
  if (DB) {
    try {
      const ref = DB.collection("picks").doc();
      await ref.set({ s: sc.id, v: sc.type === "mcq" ? a.pick : a.order.join(""), c: a.conf });
      a.pid = ref.id;
      saveProg();
    } catch (e) {}
  }
}

function answered(sc, a) {
  const wrap = el("div", "q");
  wrap.appendChild(txt("p", "stem", sc.q));
  const opts = el("div", "opts");
  if (sc.type === "mcq") {
    order(sc.id, sc.opts.length).forEach((oi, pos) => {
      const b = el("button", "opt", `<span class="k">${"ABCD"[pos]}</span><span></span>`);
      b.lastChild.textContent = sc.opts[oi];
      b.disabled = true;
      b.classList.add(oi === 0 ? "right" : oi === a.pick ? "wrong" : "dim");
      opts.appendChild(b);
    });
  } else {
    [0, 1, 2].forEach(oi => {
      const yours = a.order.indexOf(oi) + 1;
      const b = el("button", "opt", `<span class="rk">${oi + 1}</span><span></span>`);
      b.lastChild.textContent = `${sc.opts[oi]}  (you ranked it ${yours})`;
      b.disabled = true;
      b.classList.add(yours === oi + 1 ? "right" : "wrong");
      opts.appendChild(b);
    });
  }
  wrap.appendChild(opts);

  const good = isGood(sc, a), exact = isExact(sc, a);
  const fb = el("div", "fb " + (good ? "good" : "miss"));
  const verdict = exact ? "Best call." : good ? "Close. You selected the best option first." : "Not the best call this time.";
  fb.appendChild(txt("p", "verdict", verdict + "  You were " + CONF[a.conf].toLowerCase() + "."));
  if (sc.type === "mcq") {
    if (a.pick !== 0) fb.appendChild(txt("p", null, sc.fb[a.pick]));
    fb.appendChild(txt("p", null, (a.pick !== 0 ? "Better: " + sc.opts[0] + ". " : "") + sc.fb[0]));
  } else {
    [0, 1, 2].forEach(i => fb.appendChild(txt("p", null, `${i + 1}. ${sc.fb[i]}`)));
  }
  if (!good && a.conf === 2) fb.appendChild(txt("p", "muted", "You were certain and it wasn’t the best call. That’s a good one to talk about in the huddle."));
  wrap.appendChild(fb);

  const coach = el("section", "coach");
  coach.appendChild(txt("div", "eyebrow", "What the coach saw"));
  coach.appendChild(txt("p", null, sc.coach));
  coach.appendChild(el("div", "why", `<div><b>For you</b>${sc.why.you}</div><div><b>For the club</b>${sc.why.club}</div><div><b>For football</b>${sc.why.game}</div>`));
  coach.appendChild(txt("p", "tip", sc.tip));
  wrap.appendChild(coach);

  wrap.appendChild(squadSplit(sc));

  const why = el("div", "conf");
  why.appendChild(txt("span", "small", "Why did you select your answer?"));
  REASONS.forEach((r, i) => {
    const b = txt("button", "chipb", r); b.id = `reason-${sc.id}-${i}`;
    b.setAttribute("aria-pressed", String(a.reason === i));
    b.onclick = async () => {
      a.reason = i; render(); saveProg();
      if (DB && a.pid) { try { await DB.doc("picks/" + a.pid).update({ r: i }); } catch (e) {} }
    };
    why.appendChild(b);
  });
  wrap.appendChild(why);

  if (sc.next) wrap.appendChild(followUp(sc, a));
  return wrap;
}

function squadSplit(sc) {
  const box = el("section", "split");
  box.appendChild(txt("div", "eyebrow", "How the squad called it"));
  if (!S.live) { box.appendChild(txt("p", "muted small", "The squad split appears when Play It Right is connected for your squad.")); return box; }
  const mine = S.picks.filter(p => p.s === sc.id);
  if (mine.length < 3) { box.appendChild(txt("p", "muted small", `Shows once 3 or more players have answered. So far: ${mine.length}.`)); return box; }
  if (sc.type === "mcq") {
    const shown = order(sc.id, sc.opts.length);
    const counts = shown.map(oi => mine.filter(p => p.v === oi).length);
    const max = Math.max(...counts, 1);
    shown.forEach((oi, pos) => {
      const r = el("div", "bar" + (oi === 0 ? " best" : ""));
      r.innerHTML = `<span class="k">${"ABCD"[pos]}</span><span class="tr"><span class="fl" style="display:block;width:${Math.round(100 * counts[pos] / max)}%"></span></span><span class="n">${counts[pos]}</span>`;
      box.appendChild(r);
    });
  } else {
    const first = mine.filter(p => String(p.v)[0] === "0").length;
    box.appendChild(txt("p", "small", `${first} of ${mine.length} players put the best option first.`));
  }
  box.appendChild(txt("p", "muted small", "Where the squad disagrees is a good place to start the huddle."));
  return box;
}

  coach.appendChild(txt("p", null, sc.coach));
  const why = el("div", "why");
  [["For you", sc.why.you], ["For the club", sc.why.club], ["For football", sc.why.game]].forEach(([h, v]) => { const d = el("div"); d.appendChild(txt("b", null, h)); d.appendChild(document.createTextNode(v)); why.appendChild(d); });
  coach.appendChild(why);
  coach.appendChild(txt("p", "tip", sc.tip));
  b.appendChild(coach);
  if (sc.next) {
    const n = el("section", "q");
    n.appendChild(txt("div", "eyebrow", "Follow-up"));
    n.appendChild(txt("p", "stem", sc.next.q));
    sc.next.opts.forEach((o, i) => {
      const r = el("div", "lib-opt" + (i === 0 ? " best" : ""));
      r.appendChild(txt("span", "tag", i === 0 ? "Best" : "Other"));
      const t = el("div"); t.appendChild(txt("p", null, o)); t.appendChild(txt("p", null, sc.next.fb[i]));
      r.appendChild(t); n.appendChild(r);
    });
    b.appendChild(n);
  }
  return b;
}

/* ---------- coach notes ---------- */
function coachView() {
  const n = el("div", "notes");
  const w = week();

  const totals = el("section");
  totals.appendChild(el("h2", null, "Squad totals"));
  if (!S.live) totals.appendChild(txt("p", "muted", "Squad totals appear when Play It Right is connected. Players’ own answers are never visible to staff, only these counts."));
  else {
    totals.appendChild(txt("p", "muted small", "Counts only. Answers are stored without names, and each player’s own progress is private to them."));
    const wrapT = el("div", "tbl-wrap");
    const t = el("table");
    t.innerHTML = "<thead><tr><th>Week</th><th>Section</th><th>Calls made</th><th>Best calls</th><th>Huddle choice: most split</th></tr></thead>";
    const tb = el("tbody");
    const isBest = (sc, p) => sc.type === "mcq" ? p.v === 0 : String(p.v)[0] === "0";
    WEEKS.forEach((ids, i) => {
      if (w != null && i + 1 > Math.max(w, 1)) return;
      const mine = S.picks.filter(p => ids.includes(p.s));
      const best = mine.filter(p => isBest(BY_ID[p.s], p)).length;
      let split = null, low = 2;
      ids.forEach(id => {
        const ps = S.picks.filter(p => p.s === id);
        if (ps.length < 3) return;
        const r = ps.filter(p => isBest(BY_ID[id], p)).length / ps.length;
        if (r < low) { low = r; split = BY_ID[id].title; }
      });
      const tr = el("tr", null, `<td class="num">${i + 1}</td><td>${weekSec(i + 1).name}</td><td class="num">${mine.length}</td><td class="num">${mine.length ? best : "–"}</td><td></td>`);
      tr.lastChild.textContent = split ? `${split} (${Math.round(low * 100)}% best)` : "Needs 3+ answers";
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrapT.appendChild(t); totals.appendChild(wrapT);
  }
  n.appendChild(totals);

  if (S.canEdit && DB) {
    const set = el("section");
    set.appendChild(el("h2", null, "Academy settings"));
    set.appendChild(txt("p", "muted small", "Only staff with edit access can change these. Contacts appear on every player’s “Need to talk to someone?” panel."));
    const c = Object.assign({ squadName: "", squadSize: 20, startsOn: "", safeguardingLead: "", playerCare: "", helpline: "" }, S.cfg || {});
    const form = el("form", "form"); form.id = "cfg-form";
    const field = (id, label, type, value, wide) => {
      const l = el("label", wide ? "wide" : null); l.appendChild(document.createTextNode(label));
      const i = document.createElement("input"); i.type = type; i.id = "cfg-" + id; i.value = value == null ? "" : value;
      if (type === "number") { i.min = 1; i.max = 60; }
      l.appendChild(i); form.appendChild(l);
    };
    field("squadName", "Squad name", "text", c.squadName);
    field("squadSize", "Players in the squad", "number", c.squadSize);
    field("startsOn", "Week 1 starts on (a Monday)", "date", c.startsOn);
    field("safeguardingLead", "Safeguarding lead (name and how to reach them)", "text", c.safeguardingLead, true);
    field("playerCare", "Player care contact", "text", c.playerCare, true);
    field("helpline", "Helpline (optional)", "text", c.helpline, true);
    const save = txt("button", "lock", "Save settings"); save.type = "submit"; save.id = "cfg-save";
    form.appendChild(save);
    form.onsubmit = async ev => {
      ev.preventDefault();
      const v = id => document.getElementById("cfg-" + id).value.trim();
      const size = parseInt(v("squadSize"), 10);
      if (!(size >= 1 && size <= 60)) { S.cfgMsg = "Squad size must be between 1 and 60."; render(); return; }
      if (v("startsOn") && weekFrom(v("startsOn"), Date.now()) == null) { S.cfgMsg = "Select a valid start date."; render(); return; }
      const next = { squadName: v("squadName").slice(0, 40), squadSize: size, startsOn: v("startsOn"), safeguardingLead: v("safeguardingLead").slice(0, 200), playerCare: v("playerCare").slice(0, 200), helpline: v("helpline").slice(0, 200) };
      try { await DB.doc("config/squad").set(next); S.cfgMsg = "Saved. Players see the changes straight away."; }
      catch (e) { S.cfgMsg = "Couldn’t save. Only staff with edit access can change settings."; }
      render();
    };
    set.appendChild(form);
    if (S.cfgMsg) set.appendChild(txt("p", "status", S.cfgMsg));
    n.appendChild(set);

    const sg = el("section");
    sg.appendChild(el("h2", null, "Scenario suggestions from players"));
    const items = S.suggestions.flatMap(d => Array.isArray(d.items) ? d.items : []).sort((a, b) => b.at - a.at);
    if (!items.length) sg.appendChild(txt("p", "muted", "No suggestions yet. Players can send one from the bottom of the Academy tab."));
    items.forEach(it => {
      const d = el("div", "sugg");
      d.appendChild(txt("span", "eyebrow", new Date(it.at).toLocaleDateString()));
      d.appendChild(txt("p", null, String(it.t || "")));
      sg.appendChild(d);
    });
    n.appendChild(sg);
  }

  const rest = el("div", "notes");
  rest.innerHTML = `
  <section>
    <h2>How the academy track works</h2>
    <ol class="plan">
      <li><b>Mon</b>Ten new match moments drop, all on one section of the code. Week 1 is Commitment, week 2 Behaviour &amp; Attitude, and so on, so every six weeks cover the whole code and each section comes round three times in 18 weeks.</li>
      <li><b>Mon–Fri</b>Players aim for two moments a day, about five minutes.</li>
      <li><b>Any time</b>Players read a short comic strip, make their call, say how sure they are, then see what the coach saw. Some weeks they rank three options instead.</li>
      <li><b>Huddle</b>Use the squad split. The question where the squad disagreed most, or where players were certain and wrong, is the one to discuss.</li>
      <li><b>Later</b>A week or more after answering, an earlier moment comes back as a quick recall. Getting it right moves that section to “Leading”.</li>
      <li><b>All week</b>Catch teachable moments in training and name the section (“That was Section 4”).</li>
    </ol>
    <p>There are no points and no rankings between players. Each player sees their own level per section (Learning, Secure, Leading). The squad shares one streak: it grows each week the squad makes 60% of the week’s calls between them. The Library tab shows every scenario with its answers, and only staff with edit access can see it.</p>
    <p>Safeguarding sits outside the scoring, behind “Need to talk to someone?” on every screen. Add your safeguarding lead and player care contact in the settings above.</p>
  </section>

  <section>
    <h2>What the research says</h2>
    <div class="find"><b>Values improve when they are taught on purpose, not just “caught”.</b><p>A six-week sportsmanship programme with 126 footballers aged 10–12 improved courtesy towards opponents, care for injured players, and respect for referees, even when the referee got it wrong.</p><a href="https://www.redalyc.org/pdf/2270/227041129013.pdf" target="_blank" rel="noopener">Redalyc study (PDF)</a></div>
    <div class="find"><b>Responsibility-based coaching works with 14–16-year-old footballers.</b><p>A nine-month programme built on Hellison’s Teaching Personal and Social Responsibility model raised responsibility, prosocial behaviour and self-efficacy compared with conventional coaching.</p><a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2021.624018/full" target="_blank" rel="noopener">Frontiers in Psychology, 2021</a></div>
    <div class="find"><b>Sport-specific dilemmas matter.</b><p>Bredemeier and Shields found that athletes often reason at a lower moral level about sport dilemmas than everyday ones (“game reasoning”). Every exercise here is set in football for that reason.</p><a href="https://profiles.umsl.edu/en/publications/divergence-in-moral-reasoning-about-sport-and-everyday-life/" target="_blank" rel="noopener">Divergence in moral reasoning about sport and everyday life</a></div>
    <div class="find"><b>Autonomy-supportive coaching builds life skills, including leadership.</b><p>Explaining the why, offering choices and inviting player input is linked to life-skill development. That is why players give reasons and can suggest scenarios.</p><a href="https://pubmed.ncbi.nlm.nih.gov/35060436/" target="_blank" rel="noopener">SDT and life skills in youth sport (PubMed)</a></div>
    <div class="find"><b>Separate codes for young and adult players.</b><p>The FA’s Respect programme has a short, concrete code for young players and a separate adult code.</p><a href="https://www.thefa.com/get.involved/respect/we-only-do-positive" target="_blank" rel="noopener">The FA Respect: We Only Do Positive</a></div>
  </section>

  <section>
    <h2>Methods by age</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th>Academy 13–16</th><th>Ages 17–20</th></tr></thead>
      <tbody>
        <tr><td>Format</td><td>Comic-strip match moment → player’s call → what the coach saw. One a week.</td><td>Dilemma → Leader’s move → Outcome, then three decisions.</td></tr>
        <tr><td>Motivation</td><td>Belonging and mastery. Levels per section and a shared squad streak. No individual points.</td><td>Reputation, selection, career and leadership. A judgement rate.</td></tr>
        <tr><td>Scenarios</td><td>Academy life: reviews and releases, hidden injuries, playing up, scouts and agents, touchline parents, school.</td><td>Grey areas: simulation, gamesmanship, betting, discrimination, social media.</td></tr>
        <tr><td>Feedback</td><td>Every option is plausible. Confidence rating, ranking questions, a follow-up, and spaced recall.</td><td>Explains consequences, then a reflection question.</td></tr>
        <tr><td>Safeguarding</td><td>Separate, unscored panel with named contacts on every screen.</td><td>Keep contact with under-18s through club channels.</td></tr>
      </tbody>
    </table></div>
  </section>

  <section>
    <h2>Gaps in the current code</h2>
    <ul>
      <li>It lists expectations but no consequences. Add a clear, proportionate ladder.</li>
      <li>It has no age-specific provisions or plain-language version for under-16s.</li>
      <li>It doesn’t name a welfare officer or a reporting route. Fill in the contacts above before players start.</li>
    </ul>
  </section>`;
  n.appendChild(rest);
  return n;
}

/* ---------- wiring ---------- */
document.querySelectorAll(".track-btn").forEach(b => b.onclick = () => {
  S.tab = b.dataset.track; saveLocal();
  try { speechSynthesis.cancel(); } catch (e) {}
  S.speaking = null; render();
});
render();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!db) return;
    DB = db;
    UID = user ? await user.id() : null;
    S.canEdit = user ? await user.canEdit() : false;
    S.live = true;
    if (UID) {
      try {
        const snap = await DB.doc("data/users/" + UID + "/progress").get();
        if (snap.exists) {
          const d = snap.data();
          S.prog = { answers: Object.assign({}, S.prog.answers, d.answers || {}), recalls: Object.assign({}, S.prog.recalls, d.recalls || {}) };
          saveLocal();
        } else if (Object.keys(S.prog.answers).length) saveProg();
      } catch (e) {}
    }
    DB.doc("config/squad").onSnapshot(s => { S.cfg = s.exists ? s.data() : null; scheduleRender(); }, () => {});
    DB.collection("picks").onSnapshot(q => { S.picks = q.docs.map(d => d.data()); scheduleRender(); }, () => {});
    if (S.canEdit) DB.collection("suggestions").onSnapshot(q => { S.suggestions = q.docs.map(d => d.data()); scheduleRender(); }, () => {});
    scheduleRender();
  } catch (e) {}
})();
</script>
