"The canteen","type":"mcq","panels":[{"cap":"Lunch at the academy. Ollie’s friends are being rude to the canteen staff about the food."},{"who":"Friend","say":"This is disgusting. Who made this?"},{"cap":"The staff can hear."}],"q":"What should Ollie do?","opts":["Not join in, and say thank you to the staff","Laugh along. It’s just a joke","Complain to the coach loudly about the food","Leave his tray on the table for someone else to clear"],"fb":["Treating every staff member with respect is the academy’s standard. Saying thanks also takes the sting out.","Laughing makes the staff feel worse and tells your friends it’s OK.","If there’s a real problem with food, raise it politely, not loudly.","Clearing your own tray is basic respect."],"coach":"Ollie said thanks to the staff. His friends noticed and toned it down. The head chef started saving him an extra yoghurt.","why":{"you":"Respect costs nothing.","club":"Visitors judge the academy by how players treat its staff.","game":"The best players are known for being good people too."},"tip":"Thank the people who feed you, drive you and wash your kit."},{"id":"a11","sec":"attitude","wk":2,"title":"The away fans","type":"mcq","panels":[{"cap":"Away match. Some home supporters jeer Amara every time she touches the ball."},{"who":"Amara","think":"I want to show them a gesture."}],"q":"What should Amara do?","opts":["Ignore it and focus on her game, and tell the referee if any of it is abusive","Make a rude gesture at them","Smile and wave sarcastically","Cup her ears after a good pass"],"fb":["Staying focused is the best answer. Abuse about who you are must always be reported.","A gesture can get you a card or a ban, and it ends up on someone’s phone.","Sarcasm winds the crowd up even more.","Taunting a crowd can get you booked."],"coach":"Amara kept her head down and played. When one comment crossed the line, she told the referee, who dealt with it.","why":{"you":"Your football is the best reply.","club":"The academy wants players who stay in control.","game":"Crowds go quiet when you ignore them."},"tip":"Jeers mean they’re worried about you. Use it."},{"id":"a12","sec":"attitude","wk":2,"title":"Five defeats","type":"mcq","panels":[{"cap":"The team has lost five in a row. The changing room is flat."},{"who":"Teammate","say":"This season’s over."},{"who":"Jayden","think":"What can I say?"}],"q":"What should Jayden say?","opts":["“We pressed really well for 20 minutes. Let’s do it for 40.”","“He’s right. We’re rubbish.”","“The defence keeps letting us down.”","Nothing at all"],"fb":["Specific, positive comments give the team something real to build on.","Agreeing makes everyone feel worse.","Blaming one unit splits the team.","Silence lets the negative voice win."],"coach":"Jayden’s comment changed the mood. The coach used his words in the next team talk. They drew the next game and won the one after.","why":{"you":"Positive players lift a group.","club":"Changing-room mood affects results.","game":"Every team goes through losing runs."},"tip":"Find one real positive and say it out loud."},{"id":"a13","sec":"attitude","wk":8,"title":"The review","type":"mcq","panels":[{"cap":"End-of-block review. Lucas’s report says: “Work on communication.”"},{"who":"Lucas","think":"I talk loads! That’s not fair."}],"q":"What should Lucas do?","opts":["Ask the coach for one example and what good communication would look like","Argue that the report is wrong","Ignore it","Ask his friends if it’s true"],"fb":["Asking for an example turns vague feedback into something you can work on.","Arguing means you stop listening.","Ignoring feedback means you’ll get the same comment next time.","Friends may be kind, but the coach knows what they meant."],"coach":"The coach explained: Lucas talks a lot, but not early enough when defending. They agreed on three words to use. His next review said ‘much improved’.","why":{"you":"Feedback is a map for getting better.","club":"Coaches give feedback because they believe in you.","game":"Professionals ask for feedback all the time."},"tip":"If feedback feels unfair, ask “Can you show me an example?”"},{"id":"a14","sec":"attitude","wk":8,"title":"The call-up","type":"mcq","panels":[{"cap":"Finn has been invited to a national development camp. Mateo hasn’t."},{"who":"Finn","say":"I can’t believe it!"},{"who":"Mateo","think":"Why him and not me?"}],"q":"What should Mateo do?","opts":["Congratulate Finn, and later ask him what he thinks helped","Say it’s about who you know","Ignore the news","Congratulate him in public, then moan about it in private"],"fb":["Being happy for a teammate while learning from them is real maturity.","That’s unfair on Finn, and it doesn’t help you.","Ignoring a friend’s big news hurts the friendship.","Saying one thing and meaning another eats away at trust."],"coach":"Mateo congratulated Finn and asked what he’d been working on. Finn shared his extra-touch routine. Mateo started it the next week.","why":{"you":"Jealousy wastes energy. Learning from others uses it.","club":"Squads grow when players celebrate each other.","game":"Everyone’s path is different. Many late developers make it."},"tip":"When a teammate succeeds, ask what you can learn from them."},{"id":"a15","sec":"attitude","wk":8,"title":"Weaker foot","type":"rank","panels":[{"cap":"The coach says Priya’s weaker foot is holding her back."},{"who":"Priya","think":"I never use my left."}],"q":"Rank Priya’s options from best (1) to worst (3).","opts":["Practise with her left foot for 10 minutes a day","Only use her right foot in matches, so she doesn’t make mistakes","Decide it’s fine because some pros are one-footed"],"fb":["Little and often is how weaker feet get stronger.","Playing safe in matches is understandable, but you also need to practise.","Some pros are one-footed, but nearly all of them worked hard on their weaker side."],"coach":"Priya did 10 minutes a day against a wall. By the end of the block she was taking corners with her left.","why":{"you":"Two good feet open the whole pitch.","club":"Coaches select players who keep improving.","game":"Small daily habits beat big one-off efforts."},"tip":"Select one weakness. Give it 10 minutes a day."},{"id":"a16","sec":"attitude","wk":8,"title":"A first-team player’s advice","type":"mcq","panels":[{"cap":"A first-team player watches the Under-14s train."},{"who":"First-team player","say":"Your first touch is a bit heavy, mate."},{"who":"Ade","think":"Who does he think he is?"}],"q":"What should Ade do?","opts":["Say thanks and ask for one tip","Tell him his own touch isn’t perfect","Laugh and walk off","Tell everyone afterwards that he was rude"],"fb":["Advice from experienced players is valuable, and asking for a tip shows you’re hungry to learn.","Being defensive closes the conversation.","Walking off wastes a chance to learn.","Spreading stories about a senior player won’t go down well."],"coach":"Ade asked for a tip. The player showed him how to cushion the ball with a softer ankle. They practised for five minutes after the session.","why":{"you":"Feedback from people further on is a gift.","club":"First-team players can be role models for the academy.","game":"Every pro was once told their touch was heavy."},"tip":"Feedback stings for a minute and helps for years."},{"id":"a17","sec":"attitude","wk":8,"title":"Scouts in the stand","type":"mcq","panels":[{"cap":"Scouts from bigger clubs are watching. Leo gives the ball away and it leads to a goal."},{"who":"Leo","think":"They all saw that. I’ve blown it."}],"q":"What should Leo do?","opts":["Demand the ball again in the next minute","Play safe passes for the rest of the game","Blame the teammate who passed it to him","Keep thinking about the mistake"],"fb":["Scouts watch how players respond to mistakes. Wanting the ball shows character.","Hiding shows the mistake has got to you.","Blaming others looks worse than the mistake itself.","Replaying it in your head makes the next mistake more likely."],"coach":"Leo asked for the ball straight away and played a brilliant pass a minute later. Staff noted how he responded.","why":{"you":"Your next action defines you, not your last.","club":"Coaches look for resilience.","game":"Every player makes mistakes in front of crowds."},"tip":"Mistake? Ask for the ball. Straight away."},{"id":"a18","sec":"attitude","wk":8,"title":"Lost in the tactics","type":"rank","panels":[{"cap":"The coach explains a new pressing plan. Theo didn’t follow it."},{"who":"Theo","think":"Everyone else is nodding."}],"q":"Rank Theo’s options from best (1) to worst (3).","opts":["Ask the coach to explain his part again","Copy what the teammate next to him does","Nod and hope he works it out"],"fb":["If you’re unsure, others probably are too. Asking helps everyone.","Copying can work, but if they’ve got it wrong, so will you.","Pretending to understand is how plans fall apart in matches."],"coach":"Theo asked. Three other players admitted they were confused too. The coach drew it again, and the press worked perfectly on Saturday.","why":{"you":"Asking questions is a sign of intelligence, not weakness.","club":"Plans only work when everyone understands them.","game":"Top players constantly ask coaches questions."},"tip":"“Can you show me my part again?” is a great question."},{"id":"a19","sec":"attitude","wk":8,"title":"Slow sprint","type":"mcq","panels":[{"cap":"Sprint testing. Maya finishes near the bottom of the squad."},{"who":"Maya","think":"This test is unfair. I’m quicker in matches."}],"q":"What should Maya do?","opts":["Ask the fitness coach what would help her improve","Tell everyone the test is unfair","Find a reason to miss the next test","Do sprints every day on her own"],"fb":["Results are information. Fitness staff can give you a plan that works.","Blaming the test means you won’t improve.","Avoiding tests doesn’t make you faster.","Sprinting every day without a plan can cause injuries."],"coach":"The fitness coach found Maya’s start was slow. Two weeks of technique work took a tenth of a second off.","why":{"you":"Every test shows you what to work on next.","club":"Staff design plans around test results.","game":"Speed can be trained."},"tip":"Compare yourself with your last score, not your friends’."},{"id":"a20","sec":"attitude","wk":8,"title":"Teacher’s pet","type":"mcq","panels":[{"cap":"The coach praises Nia’s attitude in front of the squad."},{"who":"Teammate (whispering)","say":"Teacher’s pet!"},{"cap":"A few people laugh."}],"q":"What should Nia do?","opts":["Laugh it off and keep her standards","Play worse so she fits in","Tease them back about something personal","Ask the coach to stop praising her"],"fb":["Good standards are worth keeping. Teasing usually fades when it gets no reaction.","Lowering your standards to fit in holds you back.","Getting personal starts a real argument.","Praise is earned. You don’t need to hide from it."],"coach":"Nia smiled and kept working. A month later, two of the players who teased her were copying her warm-up routine.","why":{"you":"Your standards are yours. Keep them.","club":"Coaches praise behaviour they want others to copy.","game":"Leaders often stand out before others follow."},"tip":"If it’s just teasing, ignore it. If it becomes bullying, tell someone."},{"id":"a21","sec":"attitude","wk":8,"title":"Setting a goal","type":"rank","panels":[{"cap":"Players set one personal goal for the next six weeks."},{"who":"Mateo","think":"What makes a good goal?"}],"q":"Rank Mateo’s goals from best (1) to worst (3).","opts":["“Win the ball back within five seconds more often”","“Score 10 goals”","“Be better than Theo”"],"fb":["It’s specific and under your control, so you can train it every session.","Goals are motivating, but they also depend on teammates and luck.","Comparing yourself to a teammate isn’t in your control and can damage the friendship."],"coach":"Mateo tracked his ball regains every session. The coach used his chart to show the whole squad how to set goals.","why":{"you":"Goals you control are goals you can chase every day.","club":"Coaches help players set goals that build skills.","game":"Process goals are what professionals use."},"tip":"Ask: can I work on this goal at every session?"},{"id":"a22","sec":"attitude","wk":14,"title":"The new signing","type":"mcq","panels":[{"cap":"Tomás has just joined the academy from abroad. He speaks very little English."},{"cap":"At lunch he sits alone."},{"who":"Teammate","say":"He probably doesn’t want to talk."}],"q":"What should Lucas do?","opts":["Sit with him, show him around, and learn a few words of his language","Leave it to the coaches to look after him","Talk to him really slowly and loudly","Wait until his English gets better"],"fb":["Small welcomes make a big difference. Learning a few of his words shows you care.","Coaches help, but feeling welcome comes from teammates.","Speaking loudly can feel patronising. Gestures and smiles work better.","Waiting means weeks of feeling alone."],"coach":"Lucas sat with Tomás every lunch. Within a month, Tomás was teaching the squad words in his language, and his football took off.","why":{"you":"You’d want the same if you moved abroad.","club":"Academies are made of players from everywhere.","game":"Football is a world language."},"tip":"Learn one word in a new teammate’s language this week."},{"id":"a23","sec":"attitude","wk":14,"title":"The nickname","type":"mcq","panels":[{"cap":"The squad has a nickname for Jayden about his weight."},{"cap":"He laughs along, but he’s been quiet lately."},{"who":"Finn","think":"Is he actually OK with it?"}],"q":"What should Finn do?","opts":["Stop using the nickname, and check privately how Jayden feels","Keep using it. He laughs, so he must be fine","Tell the coach in front of everyone","Make up a nickname for someone else to share it out"],"fb":["People often laugh to hide hurt. Checking privately gives him a safe way to say so.","Laughing along is often how people cope, not proof they’re fine.","Raising it publicly might embarrass Jayden more. Start privately.","Spreading nicknames spreads the hurt."],"coach":"Jayden told Finn he hated it. Finn stopped using it and quietly asked a few others to stop too. It disappeared within a week.","why":{"you":"Kindness takes courage.","club":"Teasing about bodies can damage how young players feel about food and fitness.","game":"Good teams make everyone feel safe."},"tip":"If you’re not sure a joke is OK, it probably isn’t."},{"id":"a24","sec":"attitude","wk":14,"title":"Ramadan","type":"mcq","panels":[{"cap":"Sami is fasting during Ramadan. Some teammates joke about him not drinking water."},{"who":"Teammate","say":"Go on, one sip, nobody will know!"}],"q":"What should Priya do?","opts":["Tell them it’s not on, and ask Sami if there’s anything that would help","Laugh. It’s just banter","Ignore it. It’s not her business","Ask Sami to explain fasting to everyone right now"],"fb":["Respecting faith is part of respecting people. Asking how to help makes him feel supported.","Jokes about someone’s religion aren’t banter.","Silence lets it carry on.","Putting him on the spot in front of everyone can make it worse."],"coach":"Priya spoke up. The coach later adjusted Sami’s session times, and the squad broke the fast together at the end of Ramadan.","why":{"you":"Standing up for others is real courage.","club":"Academies support players of all faiths.","game":"Football brings together people of every background."},"tip":"Respecting someone’s beliefs doesn’t require sharing them."},{"id":"a25","sec":"attitude","wk":14,"title":"The tactics board","type":"mcq","panels":[{"cap":"Ollie is dyslexic. He struggles to read the tactics board quickly."},{"who":"Teammate","say":"Can’t you read, Ollie?"},{"cap":"A couple of players laugh."}],"q":"What should Maya do?","opts":["Tell them to stop, help Ollie quietly, and suggest to the coach that diagrams help","Laugh along so she isn’t the odd one out","Read it out loud for him in front of everyone","Stay out of it"],"fb":["Helping quietly and suggesting a better way supports Ollie without making a scene.","Laughing makes it worse.","Reading it out loud can highlight the problem in a way Ollie may not want.","Saying nothing lets the mocking continue."],"coach":"The coach started using drawings and arrows. It helped half the squad, not just Ollie.","why":{"you":"Everyone learns in different ways.","club":"Good coaching works for every type of learner.","game":"Many top players have learning differences."},"tip":"If something helps one player learn, it often helps lots of others too."},{"id":"a26","sec":"attitude","wk":14,"title":"The groups","type":"rank","panels":[{"cap":"The squad has split into friendship groups. At meals, the same people always sit together."},{"who":"Coach","think":"The team feels divided."}],"q":"Rank Finn’s options from best (1) to worst (3).","opts":["Sit with different teammates sometimes, and invite others over","Stay with his own group but be friendly to everyone","Tell his group not to talk to the others"],"fb":["Mixing breaks down walls. Teams that know each other play better together.","Being friendly helps, but the groups stay stuck.","Excluding people splits the team and is a form of bullying."],"coach":"Finn started a ‘mixed table’ on Thursdays. The coach noticed the passing between the groups got better too.","why":{"you":"The more people you know, the more you enjoy the squad.","club":"A united squad is stronger on the pitch.","game":"Great teams have great relationships."},"tip":"Sit with someone new once a week."},{"id":"a27","sec":"attitude","wk":14,"title":"Homesick","type":"mcq","panels":[{"cap":"Maya has moved away from home to join the academy. She stays with a host family."},{"cap":"Lucas finds her crying behind the changing rooms."},{"who":"Maya","say":"I just miss home."}],"q":"What should Lucas do?","opts":["Listen, and encourage her to talk to player care","Tell her to toughen up","Tell the group so they can cheer her up","Pretend he didn’t see"],"fb":["Listening helps. Player care staff know how to support players who live away.","Homesickness is normal. Being told to toughen up makes it worse.","She may not want everyone to know. Ask her first.","Walking away leaves her alone with it."],"coach":"Maya spoke to player care, who arranged more video calls home and a buddy. She settled within a few weeks.","why":{"you":"Being there for a teammate matters more than knowing the right words.","club":"Academies have staff for wellbeing.","game":"Many players struggle with living away from home."},"tip":"You don’t need to fix it. Just listen, and point them to someone who can help."},{"id":"a28","sec":"attitude","wk":14,"title":"The rumour","type":"mcq","panels":[{"cap":"A rumour goes round that Ade is about to be released."},{"who":"Teammate","say":"Have you heard about Ade?"},{"cap":"Nobody knows if it’s true."}],"q":"What should Jayden do?","opts":["Not pass it on, and change the subject","Ask Ade if it’s true","Share it in the group chat","Tell the coach about the rumour"],"fb":["Rumours about releases hurt people, true or not. Not passing them on stops them spreading.","Asking Ade could upset him about something that might not be true.","Group chats spread rumours in seconds.","Coaches won’t discuss other players’ futures. Let it go."],"coach":"The rumour wasn’t true. Ade only heard about it months later, and thanked the players who never spread it.","why":{"you":"Rumours can hurt friends.","club":"Decisions about players are private.","game":"Trust in a squad is easy to break."},"tip":"If it isn’t yours to share, don’t."},{"id":"a29","sec":"attitude","wk":14,"title":"The second chat","type":"mcq","panels":[{"cap":"Jayden discovers a second squad group chat. Two players were left out of it."},{"who":"Chat","say":"Don’t add them, they’re weird lol"}],"q":"What should Jayden do?","opts":["Say it isn’t fair, and suggest everyone uses the main chat","Stay in the chat but say nothing","Screenshot it and post it publicly","Leave the chat quietly"],"fb":["Speaking up for the people left out is what a good teammate does.","Staying silent makes you part of it.","Posting publicly can make things worse for everyone, including the two players.","Leaving is better than staying, but the problem carries on."],"coach":"Jayden spoke up. The second chat was deleted. When it started again, he told the coach, who spoke to the squad.","why":{"you":"Speaking up for others takes courage.","club":"Online exclusion is a form of bullying.","game":"Teams win together."},"tip":"If a chat leaves people out on purpose, say something, or tell an adult."},{"id":"a30","sec":"attitude","wk":14,"title":"Saying sorry","type":"mcq","panels":[{"cap":"In training, Kai snapped at Sami: “Pass it properly!”"},{"cap":"Sami looks hurt."},{"who":"Kai","think":"I was out of order."}],"q":"What should Kai do?","opts":["Find Sami after the session and apologise","Wait for Sami to bring it up","Say “It’s just football” if Sami mentions it","Ask a friend to say sorry for him"],"fb":["A direct apology fixes things quickly and shows maturity.","Waiting leaves it hanging between you.","That brushes it off instead of owning it.","An apology means more coming from you."],"coach":"Kai apologised in the car park. Sami said it was fine. They practised passing together the next day.","why":{"you":"Saying sorry is a strength.","club":"Small arguments grow if they aren’t fixed.","game":"Respect includes fixing your mistakes."},"tip":"A quick sorry stops a small problem becoming a big one."},{"id":"s4","sec":"sport","wk":3,"title":"Creeping throw-in","type":"mcq","panels":[{"cap":"Leo has a throw-in near halfway. The referee is looking the other way."},{"who":"Teammate","say":"Walk it up! Ten yards, nobody’s watching."}],"q":"What should Leo do?","opts":["Take it from where the ball went out","Walk it up the line while the referee isn’t looking","Take it a couple of yards up. That’s normal","Wait for the referee to look, then argue it went out further up"],"fb":["Small honesty habits build a reputation referees trust.","Sneaking yards is cheating, even if it’s small.","It’s common, but it’s still taking what isn’t yours, and referees can award the throw to the other team.","Arguing for something you know is untrue is dishonest."],"coach":"Leo took it from the right place. Later in the game, the referee gave him a close decision. Referees remember honest players.","why":{"you":"Honesty in small things makes you trusted in big things.","club":"Academy players set the standard for the game.","game":"Fair play starts with the little moments."},"tip":"Take what the game gives you, not what you can sneak."},{"id":"s5","sec":"sport","wk":3,"title":"The yellow card","type":"mcq","panels":[{"cap":"Theo is booked for a tackle he thinks was clean."},{"who":"Theo","think":"I got the ball!"},{"who":"Referee","say":"Number 7, yellow card."}],"q":"What should Theo do?","opts":["Accept it, turn away and refocus","Give the referee a sarcastic thumbs-up","Ask the referee for her name","Kick the ball away in frustration"],"fb":["The card won’t change. Walking away protects you from a second yellow.","Sarcasm is dissent, and it can lead to a second card.","That sounds like a threat, even if you don’t mean it.","Kicking the ball away is a quick route to a red card."],"coach":"Theo walked away. In the video review, the coach agreed the tackle was clean. He also praised Theo’s reaction.","why":{"you":"Staying on the pitch helps your team.","club":"Dissent cards cost points and players.","game":"Referees can’t change decisions because of protests."},"tip":"Card given? Back to your position. Talk about it later."},{"id":"s6","sec":"sport","wk":3,"title":"Running the line","type":"mcq","panels":[{"cap":"Kai is asked to run the line for a younger age group’s friendly. His club is playing."},{"who":"Club parent","say":"Go on, help our lot out!"},{"cap":"A close offside call comes his way."}],"q":"What should Kai do?","opts":["Flag exactly what he sees, even if it goes against his club","Give it to his club. It’s only a friendly","Not flag anything close, so nobody gets upset","Flag against his club to show he’s fair"],"fb":["Being honest when you have the power to cheat is real integrity.","Cheating for your own side teaches the younger players the wrong lesson.","Not making decisions isn’t neutral. It lets the game down.","Giving decisions against your own side to look fair is still not honest."],"coach":"Kai flagged what he saw. The younger coach thanked him, and the opposition coach shook his hand.","why":{"you":"Seeing the game as an official makes you a smarter player.","club":"The academy trusts players to be honest.","game":"Officials keep the game fair."},"tip":"Try running the line once. You’ll never shout at an assistant again."},{"id":"s7","sec":"sport","wk":3,"title":"The cynical foul","type":"rank","panels":[{"cap":"An opponent drags Mateo down to stop a counter-attack."},{"who":"Mateo","think":"That’s a booking!"}],"q":"Rank Mateo’s options from best (1) to worst (3).","opts":["Get up quickly and play on","Appeal to the referee calmly, with his arms by his sides","Wave an imaginary yellow card at the referee"],"fb":["Getting up quickly keeps your team’s momentum. The referee saw it.","A calm appeal is OK, but it can slow your team down.","Waving a pretend card is a bookable offence in itself."],"coach":"Mateo got straight up. The referee booked the opponent anyway. Mateo kept his focus, and his team took the free kick quickly.","why":{"you":"Quick restarts create chances.","club":"Referees don’t need help deciding cards.","game":"Waving cards is unsporting."},"tip":"Let the referee do the refereeing."},{"id":"s8","sec":"sport","wk":3,"title":"Did it hit your hand?","type":"mcq","panels":[{"cap":"A shot hits Priya’s arm in the box. The referee didn’t see it clearly."},{"who":"Opponent","say":"Handball!"},{"who":"Referee","say":"Did it hit your hand?"}],"q":"What should Priya do?","opts":["Tell the truth","Say no","Say she doesn’t know","Shrug and walk away"],"fb":["Honesty when it costs you is the hardest and best kind. It also makes referees trust you.","Lying to a referee is cheating, and video often catches it.","If you felt it, you know.","Avoiding the question is still choosing not to tell the truth."],"coach":"Priya said yes. The referee gave the penalty, and the opposition coach found Priya after the game to thank her.","why":{"you":"Your word is worth more than one goal.","club":"The academy wants honest players.","game":"Fair play matters more than one result."},"tip":"If someone asks you a direct question, answer it honestly."},{"id":"s9","sec":"sport","wk":3,"title":"Running down the clock","type":"mcq","panels":[{"cap":"2–1 up, 85th minute. Ben has the ball for a throw-in."},{"who":"Teammate","say":"Take ages! Waste time!"}],"q":"What should Ben do?","opts":["Take the throw normally, and help the team keep possession","Take as long as possible over every throw","Pretend he can’t find a teammate to throw to","Throw it to an opponent so he can complain about the referee"],"fb":["Keeping the ball is the best way to see out a game, and it’s within the rules.","Deliberate delay can be booked, and referees add the time back.","Faking it is still time-wasting.","That doesn’t make sense, and it gives away the ball."],"coach":"Ben took a quick throw and the team kept the ball for two minutes. The coach called it ‘winning the right way’.","why":{"you":"Smart play beats delaying tactics.","club":"The academy wants teams that play to the end.","game":"Time-wasting spoils the game for everyone."},"tip":"Keeping the ball is better than wasting time."},{"id":"s10","sec":"sport","wk":3,"title":"A penalty for nothing","type":"mcq","panels":[{"cap":"Ollie stumbles over his own feet in the box. The referee gives a penalty."},{"who":"Teammate","say":"Get in! Penalty!"},{"who":"Ollie","think":"Nobody touched me."}],"q":"What should Ollie do?","opts":["Tell the referee he wasn’t fouled","Say nothing. The referee made the decision","Let someone else take it so he isn’t involved","Take it, but miss on purpose"],"fb":["Rare, brave and remembered. Fair play like this is what youth football should be about.","Lots of players would stay quiet, but the penalty is for something that didn’t happen.","Stepping back doesn’t change that the penalty is wrong.","Missing on purpose is confusing and still not honest. Just tell the referee."],"coach":"Ollie told the referee, who changed the decision. The opposition clapped him at full time, and the academy wrote to his parents.","why":{"you":"Honesty when nobody would know is real character.","club":"Fair play stories travel and make the academy proud.","game":"This is the game at its best."},"tip":"Ask: would I be proud if everyone knew exactly what happened?"},{"id":"s11","sec":"sport","wk":3,"title":"Ball kid","type":"mcq","panels":[{"cap":"Sofia is a ball kid at a first-team match. Her club is losing."},{"who":"Older ball kid","say":"Be slow giving the ball back to the away team."}],"q":"What should Sofia do?","opts":["Return the ball at the same speed to both teams","Be slow for the away team, as told","Be extra quick for the home team only","Hide a ball behind the board"],"fb":["Fairness for both teams is the job, and it’s what officials expect.","Ball kids slowing the game can lead to complaints and penalties for the club.","Treating teams differently is still unfair.","Hiding balls is cheating, and cameras see it."],"coach":"Sofia returned every ball fairly. The fourth official thanked the ball kids at full time.","why":{"you":"You represent the club even as a ball kid.","club":"Clubs get punished for unfair ball kids.","game":"Fair play includes everyone around the pitch."},"tip":"Fair is fair for both teams, every time."},{"id":"s12","sec":"sport","wk":3,"title":"Cramp","type":"rank","panels":[{"cap":"An opponent goes down with cramp late in the game. The ball is out of play."},{"who":"Theo","think":"He’s in agony."}],"q":"Rank Theo’s options from best (1) to worst (3).","opts":["Help stretch his calf until his physio arrives","Wait for his team’s staff to deal with it","Tell him to get up and stop wasting time"],"fb":["Helping an opponent shows respect. It’s one of football’s best traditions.","Fine, but you can show kindness while you wait.","You don’t know how much pain he’s in, and it isn’t kind."],"coach":"Theo stretched the opponent’s leg until help arrived. The away coach mentioned it in his email to the academy.","why":{"you":"Opponents are fellow players, not enemies.","club":"Kind acts get noticed.","game":"Respect lasts longer than results."},"tip":"Opponent hurt? Ask if they’re OK. Every time."},{"id":"s13","sec":"sport","wk":9,"title":"Targeting the stammer","type":"mcq","panels":[{"cap":"Before the game, a teammate suggests targeting an opponent who has a stammer."},{"who":"Teammate","say":"Copy him when he talks. He’ll lose it."}],"q":"What should Leo do?","opts":["Refuse, say it’s not on, and tell the coach if it carries on","Laugh and say nothing","Join in a little bit","Stay out of it but not stop it"],"fb":["Mocking someone’s disability is never acceptable. Stopping it is what leaders do.","Laughing tells everyone it’s acceptable.","There’s no such thing as joining in a little bit.","Silence lets it happen."],"coach":"Leo said no and told the coach. The coach spoke to the squad before kick-off. Nobody targeted the player.","why":{"you":"Speaking up when it’s hard is real courage.","club":"Discrimination is against football rules and the academy’s values.","game":"Everyone deserves to enjoy football."},"tip":"If a plan involves hurting someone, it isn’t a plan. It’s bullying."},{"id":"s14","sec":"sport","wk":9,"title":"Shirt pulling","type":"mcq","panels":[{"cap":"An opponent pulls Amara’s shirt at every corner. The referee hasn’t seen it."},{"who":"Amara","think":"Two can play at that game."}],"q":"What should Amara do?","opts":["Tell the referee calmly at a stoppage, and keep moving to lose her marker","Pull his shirt back","Throw herself to the floor at the next corner","Complain loudly to the opposition coach"],"fb":["Telling the referee and using smart movement is the honest way to beat it.","Then you’re both fouling, and you might be the one who gets caught.","Diving to win a penalty is simulation.","The referee runs the game, not the other coach."],"coach":"Amara told the referee, who watched the next corner and gave a free kick. Amara also started making early runs to escape her marker.","why":{"you":"Smart movement beats dirty tricks.","club":"The academy wants clean players.","game":"Referees respond to calm players."},"tip":"Being fouled? Tell the referee, then out-think your marker."},{"id":"s15","sec":"sport","wk":9,"title":"Off the line","type":"mcq","panels":[{"cap":"Penalty. Maya is in goal."},{"who":"Keeper coach (earlier)","say":"Stay on your line until it’s kicked."},{"who":"Teammate","say":"Step forward early. The referee won’t notice!"}],"q":"What should Maya do?","opts":["Stay on her line until the ball is kicked, as the laws say","Step forward early","Move early, but only a small step","Distract the taker by waving her arms and shouting"],"fb":["Following the laws is the honest choice, and the penalty is retaken if you’re caught.","Coming off the line early is against the laws, and the penalty is retaken.","A small step is still breaking the rule.","Shouting to put off the taker is unsporting and can be booked."],"coach":"Maya stayed on her line and guessed right. She saved it fairly, and no one could argue.","why":{"you":"A fair save is twice as satisfying.","club":"Keeper coaches teach legal technique.","game":"Laws exist so the game is fair."},"tip":"Practise penalty saves the legal way. It works."},{"id":"s16","sec":"sport","wk":9,"title":"The wall","type":"rank","panels":[{"cap":"Free kick against Jayden’s team. He’s in the wall."},{"who":"Jayden","think":"How can I help us?"}],"q":"Rank Jayden’s options from best (1) to worst (3).","opts":["Stand still in the wall at the right distance and stay brave","Talk to his own teammates about who’s marking whom","Shout “leave it!” as the taker strikes"],"fb":["A solid, legal wall is all your team needs from you.","Organising your teammates is useful, as long as you’re back in position in time.","Shouting to distract an opponent is unsporting and can be penalised."],"coach":"Jayden held his position. The shot hit the wall. The coach praised the wall’s discipline.","why":{"you":"Discipline wins set pieces.","club":"Coaches plan walls carefully.","game":"The laws protect both teams."},"tip":"Brave and still beats loud and sneaky."},{"id":"s17","sec":"sport","wk":9,"title":"Too old?","type":"mcq","panels":[{"cap":"A tournament. One opponent looks much older and bigger than everyone else."},{"who":"Teammate","say":"He’s definitely over-age! Let’s tell him!"}],"q":"What should Sofia do?","opts":["Let her coach raise it with the organisers if they’re worried","Shout that he’s cheating","Refuse to shake his hand after the game","Ask him to prove his age"],"fb":["Some players grow early. Staff can check through the proper route.","Accusing someone publicly is unfair if you’re wrong, and you probably are.","Snubbing someone because of their size isn’t respect.","It’s not a player’s job to check anyone’s age."],"coach":"The coach checked quietly. The player was the right age and had just grown early. Sofia’s team were glad they hadn’t said anything.","why":{"you":"Players grow at different speeds.","club":"Organisers check ages properly.","game":"Respect every opponent."},"tip":"Big for his age doesn’t mean cheating. Late developers often end up the better players."},{"id":"s18","sec":"sport","wk":9,"title":"Their team sheet","type":"mcq","panels":[{"cap":"Kai finds the opposition’s tactics notes left in the away changing room."},{"who":"Teammate","say":"Read it! We’ll know their whole plan!"}],"q":"What should Kai do?","opts":["Give it back to them, or to a member of staff, without reading it","Read it and share it with the team","Take a photo of it, then give it back","Throw it away"],"fb":["Winning with their secret plan isn’t really winning. Returning it is the honest choice.","Using it would be cheating, even if it’s not against a written rule.","A photo is the same as reading it.","Throwing it away still takes something from them."],"coach":"Kai handed it to the staff, who returned it. The opposition coach thanked the academy afterwards.","why":{"you":"Wins only feel good when they’re fair.","club":"Academies build relationships with other clubs.","game":"Integrity matters when nobody is watching."},"tip":"Would you be happy if they did it to you?"},{"id":"s19","sec":"sport","wk":9,"title":"The score in training","type":"mcq","panels":[{"cap":"Small-sided game. No referee. Players keep their own score."},{"who":"Teammate","say":"Say it’s 4–3 to us. It’s really 3–3."}],"q":"What should Finn do?","opts":["Say the real score","Go along with 4–3","Say he lost count","Let the other team argue it out"],"fb":["Honesty in training builds the habits you use in matches.","Cheating in training is still cheating, and it ruins the game.","Pretending you don’t know is dodging the truth.","Staying quiet leaves your teammate’s lie standing."],"coach":"Finn said 3–3. The coach heard it and said it was the most important moment of the session.","why":{"you":"Habits in training become habits in matches.","club":"Coaches notice who is honest when there’s no referee.","game":"Fair play matters most when no one is checking."},"tip":"Practise honesty like you practise passing."},{"id":"s20","sec":"sport","wk":9,"title":"Minute’s silence","type":"mcq","panels":[{"cap":"Before kick-off, there’s a minute’s silence for a club legend who has died."},{"cap":"Two teammates are whispering and giggling."}],"q":"What should Priya do?","opts":["Stand still and silent herself, then have a quiet word with them afterwards","Join in the giggling","Tell them to shut up during the silence","Ignore it"],"fb":["Showing respect yourself, then talking privately, is the right way to handle it.","Giggling during a silence is very disrespectful to the family and the club.","Speaking during the silence breaks it too.","The silence matters to the club. A quiet word helps your teammates understand."],"coach":"Priya kept still and spoke to the two afterwards. They hadn’t known who the legend was, and they apologised to the coach.","why":{"you":"Respect moments say who we are.","club":"Clubs carry their history with pride.","game":"Football is a community."},"tip":"A silence is for someone’s family. Treat it that way."},{"id":"s21","sec":"sport","wk":9,"title":"Smart or cheating?","type":"rank","panels":[{"cap":"On TV, a famous player dives to win a penalty in a big game."},{"who":"Friend","say":"That’s so smart."}],"q":"Rank the responses from best (1) to worst (3).","opts":["“I’d rather win honestly.”","“It’s part of the game now.”","“Let’s practise diving at training.”"],"fb":["Being proud of the right way to win, even when famous players don’t, shows real character.","It happens, but accepting it as normal is how cheating spreads.","Practising cheating is still cheating, and referees spot divers."],"coach":"The coach showed the squad the clip and asked them what the younger kids watching would learn. The squad agreed: no diving.","why":{"you":"Famous players aren’t always good role models.","club":"Academies teach honest football.","game":"Kids watching you copy what you do."},"tip":"Be the player you want younger kids to copy."},{"id":"s22","sec":"sport","wk":15,"title":"Seven–nil","type":"mcq","panels":[{"cap":"7–0 up, 20 minutes left."},{"who":"Teammate","say":"Let’s do rainbow flicks and nutmegs! Make them look stupid!"}],"q":"What should Theo do?","opts":["Keep playing properly, and respect the opponents","Do tricks to embarrass them","Stop trying altogether","Celebrate every goal like a cup winner"],"fb":["Playing properly respects the opponents and keeps your standards high.","Tricks to humiliate are disrespectful and can start fights.","Stopping trying is also disrespectful, and bad habits creep in.","Big celebrations at 7–0 rub it in."],"coach":"Theo kept playing well. After the match the opposition coach said Theo’s team were the most respectful side they’d played.","why":{"you":"Respect is easiest to show when you’re winning.","club":"Big wins show the academy’s character.","game":"You’ll be on the other side of a hammering one day."},"tip":"Score with skill, not to show off."},{"id":"s23","sec":"sport","wk":15,"title":"The runners-up medal","type":"mcq","panels":[{"cap":"Cup final lost on penalties. The medals are handed out."},{"who":"Ollie","think":"I don’t want a loser’s medal."}],"q":"What should Ollie do?","opts":["Stand for the presentation, take the medal, and clap the winners","Take the medal off straight away","Walk off before the presentation","Throw the medal on the floor"],"fb":["Respecting the winners when you’re hurting is real sportsmanship.","Taking it off in public looks like a tantrum.","Walking off disrespects the organisers and the winners.","Throwing a medal is the clip people remember."],"coach":"Ollie clapped the winners with tears in his eyes. The coach used a photo of it at the end-of-season awards.","why":{"you":"Losing well is a skill.","club":"The academy is judged on how it loses.","game":"Finals are special, whatever the result."},"tip":"Clap the winners. Next year it might be you."},{"id":"s24","sec":"sport","wk":15,"title":"Their wonder goal","type":"mcq","panels":[{"cap":"An opponent scores a brilliant volley from 30 yards to beat Ben’s team."},{"who":"Ben","think":"That was incredible, but they beat us."}],"q":"What should Ben do?","opts":["Tell the scorer “great goal” at full time","Say it was a lucky shot","Blame the keeper","Ignore the scorer"],"fb":["Recognising brilliance shows confidence and respect.","It wasn’t luck. Calling it that sounds bitter.","Blaming the keeper for a 30-yard volley isn’t fair.","Ignoring it doesn’t change the result."],"coach":"Ben shook the scorer’s hand and said ‘great goal’. The scorer grinned. They followed each other’s progress for years.","why":{"you":"Respecting a great moment is part of loving the game.","club":"Respectful players get noticed.","game":"Football is better when we celebrate great play."},"tip":"Great goal? Say so, even against you."},{"id":"s25","sec":"sport","wk":15,"title":"Snubbed","type":"mcq","panels":[{"cap":"Full time. An opponent refuses Maya’s handshake and walks off."},{"who":"Maya","think":"How rude!"}],"q":"What should Maya do?","opts":["Stay calm and carry on down the line","Follow him and confront him","Call him something rude","Tell her team not to shake their hands"],"fb":["His choice doesn’t change your standards. Carry on.","Confronting him can start a fight.","Insults lead to trouble, and the academy will hear about it.","One player’s rudeness isn’t the whole team’s."],"coach":"Maya carried on down the line. The opposition coach saw what happened and spoke to his player.","why":{"you":"Your manners are yours. Keep them.","club":"Staff notice who stays classy.","game":"One bad moment doesn’t define a team."},"tip":"You control your handshake, not theirs."},{"id":"s26","sec":"sport","wk":15,"title":"After the loss","type":"rank","panels":[{"cap":"A painful 2–1 defeat. The changing room is quiet."},{"who":"Lucas","think":"What do I say?"}],"q":"Rank Lucas’s options from best (1) to worst (3).","opts":["“That hurt. Let’s learn from it on Tuesday.”","Stay quiet and get changed","Throw his boots at the wall"],"fb":["Naming the feeling and looking forward helps everyone.","Staying quiet is OK, but your words could help the team.","Throwing things is dangerous and makes the mood worse."],"coach":"Lucas’s words got the team talking. On Tuesday they fixed the problem that cost them the goal.","why":{"you":"Your mood affects others.","club":"Healthy reactions build healthy teams.","game":"Every team loses. How they respond matters."},"tip":"It’s fine to hurt. It’s not fine to hurt others."},{"id":"s27","sec":"sport","wk":15,"title":"The mocking video","type":"mcq","panels":[{"cap":"After beating Kai’s team, an opponent posts a video mocking them online."},{"who":"Teammate","say":"Let’s make a video back!"}],"q":"What should Kai do?","opts":["Not respond, and show the academy staff","Post a video mocking them back","Comment something rude","Share it in the team chat to get everyone angry"],"fb":["Not responding stops it growing. Staff can deal with it properly with the other club.","A video back starts a war that both academies will hear about.","Rude comments get screenshotted.","Spreading it makes more people angry and spreads it further."],"coach":"Kai showed staff. The other academy dealt with it, and the video came down within a day.","why":{"you":"Silence beats a reply online.","club":"Clubs work together to stop online abuse.","game":"What you post follows you."},"tip":"Online wind-ups want a reaction. Don’t give one. Tell staff."},{"id":"s28","sec":"sport","wk":15,"title":"Player of the match","type":"mcq","panels":[{"cap":"Jayden is named player of the match. He scored twice."},{"who":"Jayden","think":"Honestly, Nia was better. She set both up."}],"q":"What should Jayden do?","opts":["Accept it graciously and credit Nia","Refuse the award","Brag about it all week","Say nothing and keep the trophy"],"fb":["Gracious and generous is the best of both. Credit costs nothing.","Refusing can embarrass the people who chose you.","Bragging wears thin quickly in a squad.","Mentioning teammates is part of a good team culture."],"coach":"Jayden thanked everyone and said Nia made both goals. The coach said that was the best part of his performance.","why":{"you":"Sharing credit makes people want to play with you.","club":"Coaches value team players.","game":"Goals are team efforts."},"tip":"Every goal has a pass before it. Mention it."},{"id":"s29","sec":"sport","wk":15,"title":"The visitors","type":"mcq","panels":[{"cap":"Home tournament. A visiting team is lost on the site and late for their next game."},{"cap":"Their coach looks stressed."},{"who":"Friend","say":"Not our problem."}],"q":"What should Sofia do?","opts":["Offer to show them the way to their pitch","Leave it. They’ll find it","Laugh at them for being lost","Point vaguely and walk off"],"fb":["Being a good host is part of the academy’s reputation.","It’s quick to help, and it makes a real difference.","Laughing makes visitors feel unwelcome.","Half-help can leave them still lost."],"coach":"Sofia walked them to the right pitch. Their coach wrote to the academy to say how welcome they felt.","why":{"you":"Kindness to strangers says a lot about you.","club":"Academies want visitors to leave impressed.","game":"Hosting well is part of football."},"tip":"On home ground, you’re the host."},{"id":"s30","sec":"sport","wk":15,"title":"Own goal winner","type":"mcq","panels":[{"cap":"Ben’s team wins 1–0 thanks to an opponent’s own goal."},{"cap":"The opposition defender is in tears."},{"who":"Teammate","say":"Ha! Thanks for the goal!"}],"q":"What should Ben do?","opts":["Tell his teammate to stop, and console the defender at full time","Laugh along","Thank the defender sarcastically","Celebrate in front of him"],"fb":["Kindness to a player who’s hurting is what real sportsmanship looks like.","Laughing at someone’s worst moment isn’t on.","Sarcasm is still mocking.","Rubbing it in is cruel."],"coach":"Ben put his arm round the defender at full time. The defender’s mum thanked the academy coach.","why":{"you":"It could be you next time.","club":"The academy wants winners with heart.","game":"Everyone makes mistakes on the pitch."},"tip":"Win the game, then be kind to the people who lost it."},{"id":"t4","sec":"train","wk":4,"title":"Over the fence","type":"mcq","panels":[{"cap":"Ben’s shot flies over the fence into a neighbour’s garden."},{"who":"Teammate","say":"Leave it, we’ve got loads of balls."},{"who":"Ben","think":"It was my shot…"}],"q":"What should Ben do?","opts":["Tell a coach, so it can be collected the right way","Leave it. There are plenty more balls","Climb the fence to get it","Say someone else kicked it"],"fb":["Telling staff means the ball comes back safely and neighbours are respected.","Balls cost money, and leaving it there is careless.","Climbing fences is dangerous and means going into someone’s property.","Blaming others is dishonest."],"coach":"Ben told the coach, who knocked on the neighbour’s door. The neighbour handed back three balls, all from previous weeks.","why":{"you":"Owning small things builds trust.","club":"Academies rely on good relationships with neighbours.","game":"Respect for equipment is part of the code."},"tip":"Lost a ball? Tell a coach. Don’t climb."},{"id":"t5","sec":"train","wk":4,"title":"The GPS vest","type":"mcq","panels":[{"cap":"Players wear GPS vests that track running."},{"who":"Ollie","think":"My numbers are always low. What if I swap vests with Kai?"}],"q":"What should Ollie do?","opts":["Wear his own vest properly and ask staff how to improve his numbers","Swap vests with Kai","Forget to wear it on purpose","Run around in the warm-up to boost his numbers"],"fb":["Honest data helps staff plan your training. They can help you improve.","Swapping gives staff wrong data for both of you, and it could affect your training load.","Avoiding data doesn’t make you fitter.","Boosting numbers without purpose doesn’t help your football."],"coach":"Ollie asked why his numbers were low. Staff found he was jogging when the ball was out of play. Small changes made a big difference.","why":{"you":"Real data shows real progress.","club":"Sports science staff plan your load with it.","game":"Professionals are tracked every day."},"tip":"The vest is there to help you, not judge you."},{"id":"t6","sec":"train","wk":4,"title":"Eyes on the coach","type":"rank","panels":[{"cap":"The coach is explaining a new drill."},{"who":"Teammate","say":"Watch this trick!"}],"q":"Rank Mateo’s options from best (1) to worst (3).","opts":["Listen with his eyes on the coach","Listen while juggling the ball","Watch his teammate’s trick"],"fb":["Full attention means you understand quickly and do the drill well.","You might hear, but juggling distracts you and others.","You’ll miss the instructions and slow the session down."],"coach":"Mateo listened carefully and was first to get the drill right. The coach asked him to demonstrate it.","why":{"you":"Good listeners learn faster.","club":"Coaches plan every minute of training.","game":"Focus is a skill top players train."},"tip":"Ball under your foot, eyes on the coach."},{"id":"t7","sec":"train","wk":4,"title":"Setting up","type":"mcq","panels":[{"cap":"The coach is setting up mannequins and goals alone."},{"who":"Coach","say":"Can someone give me a hand?"},{"cap":"Most players are still lacing their boots."}],"q":"What should Amara do?","opts":["Go and help straight away","Wait to see if someone else goes","Help, but very slowly","Say it’s not her job"],"fb":["Helping out shows you care about the team’s session.","If everyone waits, nobody helps.","Slow help isn’t much help.","Everyone pitches in at an academy."],"coach":"Amara helped carry the goals. The session started five minutes earlier, and the coach thanked her in front of the squad.","why":{"you":"Helping is part of being a teammate.","club":"Staff notice who helps.","game":"Good habits make good teams."},"tip":"Be the first to say ‘I’ll help’."},{"id":"t8","sec":"train","wk":4,"title":"Changing room mess","type":"mcq","panels":[{"cap":"After training, the changing room is covered in tape, bottles and mud."},{"who":"Teammate","say":"The cleaners will sort it."}],"q":"What should Lucas do?","opts":["Clear his own space and help tidy the rest","Leave it for the cleaners","Clear only his own things","Take a photo of the mess for a laugh"],"fb":["Leaving the room tidy respects the staff and the academy.","Cleaners aren’t there to clear up after you.","Better than nothing, but a team leaves the room tidy together.","A photo doesn’t help clean anything."],"coach":"Lucas started tidying and a few others joined in. The room was clean in two minutes.","why":{"you":"How you leave a room says who you are.","club":"Respect for staff is part of the academy’s culture.","game":"Many top clubs expect players to leave dressing rooms tidy."},"tip":"Leave the room better than you found it."},{"id":"t9","sec":"train","wk":4,"title":"The buzzing phone","type":"rank","panels":[{"cap":"Ben’s phone keeps buzzing in his bag during a session."},{"who":"Ben","think":"What if it’s important?"}],"q":"Rank Ben’s options from best (1) to worst (3).","opts":["Leave it until the break, then check","Ask the coach if he can quickly check it","Sneak over to check it during a drill"],"fb":["Phones wait. If it’s an emergency, parents will call the academy.","If you’re genuinely worried, asking is fine, but most things can wait.","Sneaking off mid-drill lets your group down."],"coach":"Ben checked at the water break. It was the group chat. Next time he put his phone on silent before the session.","why":{"you":"Focus wins sessions.","club":"Training is time for football.","game":"Professionals switch off their phones before sessions."},"tip":"Phone on silent before you walk on the pitch."},{"id":"t10","sec":"train","wk":4,"title":"Water break","type":"mcq","panels":[{"cap":"Two-minute water break. The squad starts chatting."},{"cap":"The coach blows the whistle. Nobody moves."}],"q":"What should Sofia do?","opts":["Head back straight away and call the others","Finish her conversation first","Wait until everyone else moves","Take another drink slowly"],"fb":["Getting back quickly keeps the session going, and calling others is leadership.","The conversation can wait.","Waiting for others wastes everyone’s time.","Slowing down on purpose is disrespectful."],"coach":"Sofia jogged back and called ‘let’s go!’. The squad followed. The coach made her a group leader for the next drill.","why":{"you":"Small moments show leadership.","club":"Lost minutes add up across a season.","game":"Good teams respond to the whistle."},"tip":"When the whistle goes, move."},{"id":"t11","sec":"train","wk":4,"title":"Messing about","type":"mcq","panels":[{"cap":"Before training, a few players start play-fighting near the goals."},{"who":"Teammate","say":"Join in!"}],"q":"What should Finn do?","opts":["Not join in, and suggest they warm up with a ball instead","Join in for a laugh","Watch and film it","Tell them to stop, then join in anyway"],"fb":["Play-fighting near goals can cause real injuries. Suggesting a ball game gives a better alternative.","Players get hurt in play-fights every season.","Filming encourages it and could end up online.","That sends mixed messages."],"coach":"Finn grabbed a ball and started a game of keepy-ups. The play-fighting stopped.","why":{"you":"Silly injuries cost you weeks.","club":"Staff can’t prevent every accident. Players have to help.","game":"Smart players avoid unnecessary risks."},"tip":"Want to mess about? Do it with a ball."},{"id":"t12","sec":"train","wk":4,"title":"The first-team pitch","type":"mcq","panels":[{"cap":"The groundsman asks the Under-14s to stay off the first-team pitch."},{"who":"Teammate","say":"Quick photo on the centre spot! Nobody will know."}],"q":"What should Maya do?","opts":["Respect the request and stay off","Run on for a quick photo","Ask the groundsman why, then go on anyway","Kick a ball on it"],"fb":["Groundsmen work hard to prepare that pitch. Respecting their request respects their work.","Even a few minutes can damage a pitch being prepared.","Asking why is fine. Ignoring the answer isn’t.","That damages it more."],"coach":"Maya stayed off. Later, the groundsman gave the squad a tour of the pitch and let them take photos from the touchline.","why":{"you":"Respect gets rewarded.","club":"Every staff member matters.","game":"Professional clubs protect their pitches carefully."},"tip":"Ask first. You might get a better offer."},{"id":"t13","sec":"train","wk":10,"title":"Misplaced passes","type":"mcq","panels":[{"cap":"Passing drill. Nia keeps getting bad passes from her partner."},{"who":"Nia","think":"This is making me look bad."}],"q":"What should Nia do?","opts":["Encourage her partner and give simple tips, like “firmer, to my right foot”","Ask the coach for a better partner","Sigh loudly after each bad pass","Stop trying, since it’s not her fault"],"fb":["Helping a teammate improve makes you better too, and it shows leadership.","Coaches pair players for reasons. Help instead.","Sighs knock your partner’s confidence.","Giving up affects both of you."],"coach":"Nia’s tips helped. By the end of the drill her partner was finding her right foot every time.","why":{"you":"Teaching others sharpens your own skill.","club":"Coaches notice players who help.","game":"Good teams make each other better."},"tip":"Tell your partner what you want: where, and how hard."},{"id":"t14","sec":"train","wk":10,"title":"Show us how","type":"mcq","panels":[{"cap":"The coach asks Lucas to demonstrate a skill in front of everyone."},{"who":"Lucas","think":"What if I mess it up?"}],"q":"What should Lucas do?","opts":["Give it a go. If it goes wrong, try again","Say no, he doesn’t want to","Do it half-heartedly so nobody expects much","Make a joke of it"],"fb":["Coaches select demonstrators to build confidence. Mistakes are fine.","Turning down a chance can look like a lack of confidence.","Half effort makes it more likely to go wrong.","A joke can take away from the learning."],"coach":"Lucas messed up the first try, laughed and nailed the second. The coach said the second try was more useful to watch.","why":{"you":"Confidence grows by doing scary things.","club":"Coaches want players to try.","game":"Every pro gets nervous."},"tip":"Nervous is normal. Have a go anyway."},{"id":"t15","sec":"train","wk":10,"title":"The new formation","type":"rank","panels":[{"cap":"The squad is switching to a new formation. The coach sends video clips."},{"who":"Kai","think":"That’s a lot of clips."}],"q":"Rank Kai’s options from best (1) to worst (3).","opts":["Watch the clips, make notes, and bring questions","Watch only the clips about his own position","Ignore them and learn it in the next match"],"fb":["Preparing properly means you understand your role and everyone else’s.","Better than nothing, but you need to know how your role links to others.","Learning in a match costs goals."],"coach":"Kai brought three questions to training. His understanding helped the team settle into the new formation quickly.","why":{"you":"Understanding the game helps your decisions.","club":"Coaches love players who study.","game":"Top players watch lots of football."},"tip":"Watch with a question in mind."},{"id":"t16","sec":"train","wk":10,"title":"Fifty finishes","type":"mcq","panels":[{"cap":"Finishing drill. Fifty shots each."},{"who":"Ollie","think":"This is boring. I’ll just smash them."}],"q":"What should Ollie do?","opts":["Focus on quality with every shot: placement, technique, aiming for a corner","Smash them all as hard as possible","Take his time so he does fewer shots","Chat between shots"],"fb":["Every shot is a chance to practise a habit you’ll use in matches.","Power without accuracy is a bad habit.","Avoiding reps means fewer chances to improve.","Chatting breaks your focus."],"coach":"Ollie aimed for a corner with every shot. His accuracy improved, and he scored two placed finishes on Saturday.","why":{"you":"Quality reps make quality players.","club":"Coaches plan drills to build habits.","game":"Repetition is how skills become automatic."},"tip":"Every rep: select a target first."},{"id":"t17","sec":"train","wk":10,"title":"Video homework","type":"mcq","panels":[{"cap":"The coach sends a 10-minute clip of last weekend’s match. Players should watch it before Thursday."},{"who":"Friend","say":"I’ll just ask you what happened."}],"q":"What should Priya do?","opts":["Watch it herself and note one thing for her own game","Let her friend tell her what was in it","Skip it. She played in the match","Watch it at double speed while gaming"],"fb":["Watching yourself is one of the best ways to improve.","Second-hand summaries miss the details you need.","Seeing it from outside shows things you didn’t notice on the pitch.","Half-watching is barely watching."],"coach":"Priya noticed she always turned the same way. She worked on turning both ways, and the coach noticed.","why":{"you":"Video shows what feelings hide.","club":"Analysis staff put work into clips.","game":"Professionals study their own games."},"tip":"Watch once for the team, once for yourself."},{"id":"t18","sec":"train","wk":10,"title":"Teammate’s advice","type":"mcq","panels":[{"cap":"In a drill, Sami tells Jayden: “Talk more! I don’t know where you are.”"},{"who":"Jayden","think":"Who’s he to tell me?"}],"q":"What should Jayden do?","opts":["Take it on board and start calling","Tell Sami to worry about himself","Ignore it","Complain to the coach about Sami"],"fb":["Feedback from teammates is often the most useful. Talking helps everyone.","Snapping back shuts down useful feedback.","Ignoring it means the problem continues.","Sami was trying to help."],"coach":"Jayden started calling ‘man on’ and ‘time’. The drill flowed better, and Sami thanked him.","why":{"you":"Good feedback can come from anyone.","club":"Teams that talk play better.","game":"Communication is a skill."},"tip":"Teammate feedback? Say ‘OK’ and try it."},{"id":"t19","sec":"train","wk":10,"title":"Freeze!","type":"mcq","panels":[{"cap":"The coach freezes play to correct Theo’s positioning in front of everyone."},{"who":"Theo","think":"Why always me?"}],"q":"What should Theo do?","opts":["Listen, and adjust his position","Argue that he was in the right place","Roll his eyes","Ask why the coach always singles him out"],"fb":["Freezes are teaching moments. Listening is how you learn fastest.","Arguing in front of the group doesn’t help.","Body language says a lot.","Coaches correct players they believe in."],"coach":"Theo adjusted. In the next game, he was in the right position for a key interception.","why":{"you":"Corrections are coaching, not criticism.","club":"Coaches invest time in players they rate.","game":"Every player gets corrected."},"tip":"Being corrected means the coach is investing in you."},{"id":"t20","sec":"train","wk":10,"title":"Losing the training game","type":"rank","panels":[{"cap":"Theo’s team loses the end-of-session match 4–1."},{"who":"Theo","think":"I hate losing."}],"q":"Rank Theo’s options from best (1) to worst (3).","opts":["Shake hands, and think about what his team could do better","Go quiet and walk off","Claim the score was wrong"],"fb":["Losing well in training builds the habits you need in matches.","Being disappointed is fine, but walking off isn’t a good habit.","Arguing about the score is a sign of a bad loser."],"coach":"Theo’s team discussed their mistakes. They won the next week’s training game 3–2.","why":{"you":"Training is where you practise losing well too.","club":"Coaches see how players handle defeat.","game":"Competitive but fair is the goal."},"tip":"Hate losing? Good. Use it, don’t show it."},{"id":"t21","sec":"train","wk":10,"title":"Out of position","type":"mcq","panels":[{"cap":"In training, the coach puts Ade in goal for a drill. He’s a midfielder."},{"who":"Ade","think":"This is a waste of time."}],"q":"What should Ade do?","opts":["Give it a proper go and see what he learns","Let every shot in to make a point","Ask to swap with someone","Stand there and not try"],"fb":["Playing other positions helps you understand the game from new angles.","Letting goals in on purpose spoils the drill for everyone.","Coaches set up drills for reasons.","Not trying wastes everyone’s time."],"coach":"Ade learned how keepers read shots. He started placing his own shots better.","why":{"you":"Every position teaches something.","club":"Coaches design drills to build understanding.","game":"Many great players played everywhere as kids."},"tip":"Out of position? Learn something new."},{"id":"t22","sec":"train","wk":16,"title":"Tackling a friend","type":"mcq","panels":[{"cap":"Training match. Mateo and his best friend go for a 50-50."},{"who":"Mateo","think":"It’s my best mate. Should I ease off?"}],"q":"What should Mateo do?","opts":["Go in competitively but with control","Go in as hard as possible to prove he’s tough","Pull out completely","Go in late, after the ball’s gone"],"fb":["Competitive and controlled is how elite training works. Your friend expects it too.","Reckless tackles injure teammates.","Pulling out can get you injured and doesn’t help your friend improve.","Late tackles are dangerous."],"coach":"Mateo won the ball cleanly. His friend laughed and said ‘next time’. That’s healthy competition.","why":{"you":"Controlled aggression is a skill.","club":"Squads need players fit for matches.","game":"Training intensity prepares you for games."},"tip":"Win the ball, not the player."},{"id":"t23","sec":"train","wk":16,"title":"The head knock","type":"mcq","panels":[{"cap":"Ollie clashes heads with a teammate. He feels dizzy and has a headache."},{"who":"Ollie","think":"I’ll be fine in a minute."}],"q":"What should Ollie do?","opts":["Stop, and tell a coach or the physio straight away","Sit out for a minute, then carry on","Carry on and see how he feels","Wait until after training to say anything"],"fb":["Dizziness and headaches after a knock can mean concussion. Stopping and telling staff is the only safe choice.","Concussion symptoms can come and go. A minute isn’t enough.","Carrying on with concussion can be very dangerous.","Waiting can make things much worse."],"coach":"Ollie told the physio. He had mild concussion and followed the return-to-play plan. He was back safely in two weeks.","why":{"you":"Your brain is more important than any session.","club":"Academies follow strict concussion rules.","game":"If in doubt, sit it out."},"tip":"If in doubt, sit it out. Always tell staff about a head knock."},{"id":"t24","sec":"train","wk":16,"title":"Swinging on the goal","type":"mcq","panels":[{"cap":"A portable goal isn’t pegged down. Two players start swinging on the crossbar."},{"who":"Teammate","say":"Have a go!"}],"q":"What should Sofia do?","opts":["Tell them to get off, and tell a coach the goal isn’t secured","Have a quick go","Ignore it","Film it"],"fb":["Unsecured goals can tip over and seriously hurt people. Telling staff fixes it.","Goals are heavy. Swinging on them is dangerous.","Ignoring a safety problem leaves everyone at risk.","Filming encourages it."],"coach":"Sofia called them off and told the coach, who pegged the goal straight away.","why":{"you":"Safety comes before fun.","club":"Staff need to know about hazards.","game":"Goal accidents can be very serious."},"tip":"Never swing on a goal. Tell staff if one isn’t secured."},{"id":"t25","sec":"train","wk":16,"title":"Thunder","type":"mcq","panels":[{"cap":"Thunder rumbles in the distance during training."},{"who":"Teammate","say":"It’s miles away, keep playing!"}],"q":"What should Kai do?","opts":["Follow the staff’s instructions, and go inside if told to","Keep playing until the rain comes","Stand under a tree for shelter","Hold a metal pole to look funny"],"fb":["Staff follow weather safety rules. Lightning can strike before the storm arrives.","Lightning can strike before the rain arrives.","Trees attract lightning. They’re one of the worst places to stand.","Never hold metal in a thunderstorm."],"coach":"The coach stopped the session. Ten minutes later, lightning struck near the training ground. Everyone was inside.","why":{"you":"Weather safety rules are there for a reason.","club":"Staff are responsible for your safety.","game":"No session is worth the risk."},"tip":"Thunder heard? Follow staff. Never shelter under trees."},{"id":"t26","sec":"train","wk":16,"title":"Heatwave session","type":"mcq","panels":[{"cap":"33°C. Halfway through training, Priya feels dizzy and sick."},{"who":"Priya","think":"I don’t want to look weak."}],"q":"What should Priya do?","opts":["Stop, tell staff, and get into the shade with water","Push through","Sit down quietly without telling anyone","Have an energy drink"],"fb":["Dizziness and sickness in heat can be signs of heat illness. Telling staff quickly is vital.","Pushing through heat illness can make you seriously ill.","Staff need to know, so they can help you cool down.","Energy drinks don’t help with heat illness."],"coach":"Priya told the coach, who cooled her down in the shade. She recovered within 20 minutes.","why":{"you":"Speaking up is strength, not weakness.","club":"Staff are trained to deal with heat illness.","game":"Players’ safety comes first."},"tip":"Dizzy in the heat? Stop and tell someone. Straight away."},{"id":"t27","sec":"train","wk":16,"title":"Gym show-off","type":"rank","panels":[{"cap":"Gym session. Some players are lifting heavy weights to impress."},{"who":"Lucas","think":"Should I go heavier too?"}],"q":"Rank Lucas’s options from best (1) to worst (3).","opts":["Keep good form with the weight the coach set","Go a bit heavier with a friend spotting","Lift the heaviest weight he can to impress"],"fb":["At your age, technique matters most. The coach sets the weight for a reason.","A spotter helps, but going above the plan isn’t smart.","Lifting too heavy with bad form is a common cause of injury."],"coach":"Lucas stuck to the plan. The strength coach praised his form and used him as an example.","why":{"you":"Good technique now means safe lifting later.","club":"Strength coaches plan your progress.","game":"Injuries from ego lifting are avoidable."},"tip":"Form first. Weight later."},{"id":"t28","sec":"train","wk":16,"title":"Go easy","type":"mcq","panels":[{"cap":"Big match on Saturday. On Thursday, teammates agree to train at half pace."},{"who":"Teammate","say":"Nobody wants to get injured before Saturday."}],"q":"What should Ade do?","opts":["Train at the intensity the coach asks for","Agree and go at half pace","Train at full pace, but avoid all tackles","Skip the session to stay fresh"],"fb":["Coaches plan intensity before big games. Their plan is the one to follow.","Half pace without the coach’s say-so means the plan doesn’t work.","Avoiding contact can be fine if the coach asks for it, but that’s their call.","Skipping sessions isn’t your decision."],"coach":"The coach had already planned a lighter session. Ade followed it, and the team was sharp on Saturday.","why":{"you":"Trust the plan.","club":"Staff manage intensity for the whole squad.","game":"Professionals follow the coach’s training plan."},"tip":"Worried about a session? Ask the coach about the plan."},{"id":"t29","sec":"train","wk":16,"title":"Nutmegged","type":"mcq","panels":[{"cap":"A teammate nutmegs Finn in training and laughs."},{"who":"Finn","think":"I’ll get him back next time."}],"q":"What should Finn do?","opts":["Laugh it off and focus on winning the next duel cleanly","Kick him in the next tackle","Sulk for the rest of the session","Complain to the coach about the laugh"],"fb":["Responding with a good clean duel is the competitive, respectful way.","Revenge tackles injure teammates and can end your session.","Sulking ruins your session.","A laugh after a nutmeg is part of the game."],"coach":"Finn won the next duel cleanly and grinned. The two of them battled all session. Both improved.","why":{"you":"Competition makes both players better.","club":"Coaches want competitive training, not revenge.","game":"Nutmegs happen to everyone."},"tip":"Beaten? Win the next one, fairly."},{"id":"t30","sec":"train","wk":16,"title":"Extra running","type":"mcq","panels":[{"cap":"Jayden wants to get fitter. He plans to run 5km every night as well as training."},{"who":"Jayden","think":"More is better, right?"}],"q":"What should Jayden do?","opts":["Talk to the fitness coach before adding extra running","Start running 5km every night","Run every night but don’t tell anyone","Do it on match days too"],"fb":["Fitness staff can plan extra work that helps without overloading you.","Too much running on top of training can cause injuries, especially while growing.","Staff need to know your full load.","Running on match days leaves you tired for the game."],"coach":"The fitness coach gave Jayden a plan of two short runs a week. His fitness improved without any injury.","why":{"you":"Smart training beats more training.","club":"Staff manage your total load.","game":"Overuse injuries are common in young athletes."},"tip":"Want to do more? Ask first."},{"id":"m4","sec":"match","wk":5,"title":"Butterflies","type":"mcq","panels":[{"cap":"Ten minutes before a big game, Nia’s stomach is churning."},{"who":"Nia","think":"What if I play badly in front of everyone?"}],"q":"What should Nia do?","opts":["Use her routine: slow breaths, then think of her first two jobs in the game","Hide in the toilets until kick-off","Tell the coach she feels ill so she can be a sub","Watch videos on her phone to forget about it"],"fb":["Nerves are normal and show you care. A routine turns them into focus.","Hiding makes nerves grow.","Nerves aren’t illness. Starting the game usually makes them fade.","Distraction can help a little, but it doesn’t prepare you."],"coach":"Nia breathed in for four and out for six, then thought: ‘first tackle, first pass’. She was calm within two minutes of kick-off.","why":{"you":"Nerves can sharpen you if you manage them.","club":"Psychology staff can teach you routines.","game":"Every top player feels nerves."},"tip":"Breathe in for 4, out for 6. Then think of your first job."},{"id":"m5","sec":"match","wk":5,"title":"Meet time","type":"rank","panels":[{"cap":"Kick-off is at 11am. The coach says meet at 10:00."},{"who":"Lucas","think":"When should I get there?"}],"q":"Rank Lucas’s arrival times from best (1) to worst (3).","opts":["9:55, ready to go","10:05, just a bit late","10:45, still before kick-off"],"fb":["Arriving a little early is on time. You’re relaxed and ready for the team meeting.","Five minutes late can mean missing the team talk, and it stresses you.","Arriving 15 minutes before kick-off leaves no proper warm-up and no team talk."],"coach":"Lucas arrived at 9:55. He heard the full team talk and had a relaxed warm-up.","why":{"you":"Arriving early takes away stress.","club":"Coaches plan the hour before kick-off carefully.","game":"Professionals are never late to meet times."},"tip":"Early is on time. On time is late."},{"id":"m6","sec":"match","wk":5,"title":"Forgot boots","type":"mcq","panels":[{"cap":"Away match. Kai unpacks his bag. No boots."},{"who":"Kai","think":"Oh no. Should I tell anyone?"}],"q":"What should Kai do?","opts":["Tell the staff straight away so they can help","Borrow someone’s spare boots without asking","Play in trainers and hope nobody notices","Say his parents forgot to pack them"],"fb":["Staff may have spares or a solution, but only if they know early.","Taking boots without asking upsets teammates.","Trainers on grass can cause slips and injuries.","It’s your kit, and blaming others isn’t honest."],"coach":"Kai told the kit manager, who found spare boots in his size. Kai started using a checklist the next week.","why":{"you":"Owning mistakes early limits the damage.","club":"Staff can usually help if they know.","game":"Preparation is part of performance."},"tip":"Check your bag the night before. Boots first."},{"id":"m7","sec":"match","wk":5,"title":"The team talk","type":"mcq","panels":[{"cap":"The coach is giving the pre-match team talk."},{"who":"Teammate (whispering)","say":"Did you see that video last night?"}],"q":"What should Maya do?","opts":["Whisper “later” and listen to the coach","Whisper back about the video","Look at her boots and switch off","Laugh quietly"],"fb":["The team talk is when you hear your job. Listen now, chat later.","Chatting means you both miss the plan.","Switching off means you won’t know your role.","Laughing during a team talk is disrespectful."],"coach":"Maya listened and remembered the set-piece plan. She scored from it in the first half.","why":{"you":"Team talks contain the game plan.","club":"Coaches prepare every word.","game":"Listening is a competitive advantage."},"tip":"Team talk: eyes up, mouth closed."},{"id":"m8","sec":"match","wk":5,"title":"The team sheet","type":"mcq","panels":[{"cap":"The starting team is announced. Sami isn’t in it."},{"who":"Sami","think":"I’ve trained really well this week."}],"q":"What should Sami do?","opts":["Warm up fully and support the team, then ask the coach later what to work on","Sulk in the corner","Ask the coach why straight away, in front of everyone","Tell teammates it’s unfair"],"fb":["Staying positive, ready and involved is what coaches remember.","Sulking affects the whole squad.","Just before kick-off isn’t the time. Ask after the game.","Moaning spreads and divides the squad."],"coach":"Sami asked after the game. The coach explained it was rotation and said he’d start next week. He did.","why":{"you":"Rotation is part of academy football.","club":"Coaches share minutes so everyone develops.","game":"Your attitude on the bench is noticed."},"tip":"Not starting? Be ready to change the game."},{"id":"m9","sec":"match","wk":5,"title":"Their warm-up","type":"mcq","panels":[{"cap":"The opposition are warming up with loud music and flashy drills."},{"who":"Teammate","say":"Look at them. They look unreal."},{"cap":"Half the squad is watching them."}],"q":"What should Ben do?","opts":["Focus on his own team’s warm-up and get others to do the same","Watch them too","Copy their flashy drills","Shout something to wind them up"],"fb":["Your warm-up prepares you. Theirs doesn’t matter.","Watching them gets in your head.","Your warm-up is planned for your team.","Winding opponents up before kick-off is unsporting."],"coach":"Ben called the squad back into their own warm-up. They started the game sharper and won 2–0.","why":{"you":"Focus on what you control.","club":"Coaches plan warm-ups for a reason.","game":"Flashy warm-ups don’t win games."},"tip":"Warm-up time: your team, your routine."},{"id":"m10","sec":"match","wk":5,"title":"The team coach","type":"mcq","panels":[{"cap":"Travelling to an away game. A teammate plays loud music from his phone."},{"who":"Driver","say":"Can you turn that down, please?"},{"who":"Teammate","say":"Ignore him."}],"q":"What should Priya do?","opts":["Ask her teammate to turn it down or use headphones","Ignore the driver too","Turn up her own music","Complain about the driver"],"fb":["Respecting the driver and the travel rules keeps everyone safe and calm.","The driver needs to concentrate. His request is about safety.","That makes it worse.","The driver is doing his job."],"coach":"Priya asked her teammate to use headphones. The driver thanked the squad at the end of the trip.","why":{"you":"Respect doesn’t stop when you leave the pitch.","club":"Travel behaviour reflects on the academy.","game":"Drivers need to concentrate."},"tip":"On the coach: headphones in, rules followed."},{"id":"m11","sec":"match","wk":5,"title":"Pre-match meal","type":"mcq","panels":[{"cap":"Three hours before kick-off. The meal plan says pasta, chicken and water."},{"who":"Friend","say":"Let’s get a burger and fries instead!"}],"q":"What should Finn do?","opts":["Stick to the planned meal","Get the burger. One won’t hurt","Skip eating so he feels light","Have sweets instead"],"fb":["Planned meals give you slow energy for the whole game.","Greasy food be
