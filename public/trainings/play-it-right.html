<style>
/* Layout: one 760px column on white. Academy track = weekly drops; each drop is a comic-strip match moment, the player's call, then "what the coach saw". White background in every theme. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f2f5f1;
  --line: rgba(20, 40, 25, 0.13);
  --ink: #142019;
  --fg: #142019;
  --muted: #5a6a5f;
  --accent: #4f7a00;
  --accent-ink: #ffffff;
  --accent-soft: rgba(79, 122, 0, 0.09);
  --good: #15803d;
  --good-soft: rgba(21, 128, 61, 0.09);
  --bad: #c2410c;
  --bad-soft: rgba(194, 65, 12, 0.08);
  --senior: #1d4ed8;
  --senior-soft: rgba(29, 78, 216, 0.08);
  --caption: #fff5c2;
  --care: #7c3aed;
  --care-soft: rgba(124, 58, 237, 0.08);
  --c1: #1d4ed8; --c2: #c2410c; --c3: #7c3aed; --c4: #0f766e; --c5: #be185d;
  --font-display: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 24px; }
@media (min-width: 1024px) { .wrap { max-width: 1180px; } }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Header */
header { display: grid; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: clamp(34px, 7vw, 50px); font-weight: 800; line-height: 1.02; }
header h1 span { color: var(--accent); }
header .lede { color: var(--muted); max-width: 60ch; }
.tell-btn { background: var(--care-soft); color: var(--care); border: 1px solid var(--care); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
.tell { border: 2px solid var(--care); border-radius: 14px; padding: 18px; display: grid; gap: 12px; background: var(--surface); }
.tell h2 { font-size: 22px; color: var(--care); }
.tell ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.contacts { display: grid; gap: 8px; }
.contact { background: var(--care-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.contact b { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--care); font-weight: 500; }
.contact span { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Tabs */
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.track-btn { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.track-btn b { font-size: 17px; font-weight: 700; }
.track-btn small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.track-btn[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.track-btn[data-track="senior"][aria-selected="true"] { border-color: var(--senior); background: var(--senior-soft); }
@media (max-width: 520px) { .tracks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.view { display: grid; gap: 24px; }
.promise { font-size: 14px; border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--muted); }
.promise b { color: var(--fg); }

/* Corner (mastery) */
.corner { display: grid; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.tile .nm { font-size: 14px; font-weight: 700; line-height: 1.25; }
.lvl { justify-self: start; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.lvl.learning { color: var(--c2); border-color: var(--c2); }
.lvl.secure { color: var(--accent); border-color: var(--accent); }
.lvl.leading { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

/* Squad strip */
.squad { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 20px; padding-block: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.squad .big { font-family: var(--font-mono); font-size: 26px; font-variant-numeric: tabular-nums; }

/* Recall */
.recall { border: 1px dashed var(--accent); border-radius: 14px; padding: 16px; display: grid; gap: 10px; background: var(--accent-soft); }

/* Drops */
.drops { display: grid; gap: 6px; }
.drop { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.drop[aria-current="true"] { border-color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.drop .wk { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.drop .tt { min-width: 0; display: grid; }
.drop .tt span { font-size: 13px; color: var(--muted); }
.st { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.st.done { background: var(--good-soft); color: var(--good); }
.st.todo { background: var(--surface-2); color: var(--muted); }
.st.now { background: var(--accent); color: var(--accent-ink); }
.locked { font-size: 14px; color: var(--muted); padding: 6px 2px; }

/* Scenario */
.scen { display: grid; gap: 18px; }
.scen-head { display: grid; gap: 4px; }
.scen-head h2 { font-size: 28px; font-weight: 800; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.panel { border: 2px solid var(--ink); border-radius: 6px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; background: var(--surface); }
.panel .cap { background: var(--caption); border: 1px solid var(--ink); padding: 6px 8px; font-size: 14px; font-weight: 500; }
.panel .who { display: flex; gap: 8px; align-items: flex-start; }
.av { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; }
.bubble { position: relative; border: 1.5px solid var(--ink); border-radius: 14px; padding: 7px 10px; font-size: 15px; background: var(--surface); min-width: 0; }
.bubble.think { border-style: dashed; font-style: italic; }
.bubble .nm { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-style: normal; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.q { display: grid; gap: 12px; }
.q .stem { font-weight: 700; font-size: 18px; max-width: 60ch; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .k { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.opt .rk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; border: 1px dashed var(--line); color: var(--muted); }
.opt.sel { border-color: var(--fg); background: var(--surface-2); }
.opt.sel .rk { background: var(--fg); color: var(--bg); border-style: solid; border-color: var(--fg); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: 0.6; }
.conf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chipb { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chipb[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lock { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; cursor: pointer; }
.lock:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.fb { border-radius: 10px; padding: 12px 14px; font-size: 15px; display: grid; gap: 6px; }
.fb.good { background: var(--good-soft); }
.fb.miss { background: var(--bad-soft); }
.fb .verdict { font-weight: 800; }
.coach { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.coach h3 { font-size: 19px; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.why div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; font-size: 14px; }
.why b { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
@media (max-width: 600px) { .why { grid-template-columns: 1fr; } }
.tip { font-size: 15px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
.split { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 28px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 14px; }
.bar .tr { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar .fl { height: 100%; background: var(--muted); border-radius: 6px; }
.bar.best .fl { background: var(--good); }
.bar .n { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.suggest { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
textarea, input[type="text"], input[type="number"], input[type="date"] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
textarea { min-height: 84px; resize: vertical; }

/* Senior track (unchanged design) */
.score { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: baseline; justify-content: space-between; padding-block: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.score .big { font-family: var(--font-mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.on { color: #fff; background: var(--senior); border-color: var(--senior); }
.reset { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }
.rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px 7px 8px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.chip .n { font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.chip[aria-selected="true"] { border-color: var(--fg); }
.chip.done .n { background: var(--senior); color: #fff; }
.pillar-head { display: grid; gap: 6px; }
.pillar-head h2 { font-size: 28px; font-weight: 800; }
.code-line { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.example { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 16px; }
.example h3 { font-size: 21px; font-weight: 700; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.step .lab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--senior); }
@media (max-width: 460px) { .step { grid-template-columns: 1fr; gap: 2px; } }
.senior .tip { background: var(--senior-soft); }
.qs { display: grid; gap: 18px; }
.sq { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }
.sq .stem { font-weight: 500; max-width: 65ch; }
.sq .qn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.fb .reflect { color: var(--muted); font-style: italic; }
.next { justify-self: start; background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }

/* Academy week chips */
.view:not(.senior) .chip.done .n { background: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); }
.drops h3 { font-size: 22px; font-weight: 800; }

/* Library */
.lib { display: grid; gap: 16px; }
.lib h2 { font-size: 28px; font-weight: 800; }
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.filters label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.filters select, .filters input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--surface); font: inherit; color: var(--fg); }
@media (max-width: 600px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lib-list { display: grid; gap: 6px; }
.lib-item { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.lib-item > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; }
.lib-item > summary::-webkit-details-marker { display: none; }
.lib-item > summary .wk { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.lib-item > summary .tt { display: grid; min-width: 0; }
.lib-item > summary .tt span { font-size: 13px; color: var(--muted); }
.lib-item[open] > summary { border-bottom: 1px solid var(--line); }
.lib-body { padding: 14px; display: grid; gap: 14px; }
.lib-opt { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 15px; }
.lib-opt.best { background: var(--good-soft); }
.lib-opt .tag { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 3px; }
.lib-opt.best .tag { color: var(--good); }
.lib-opt p + p { color: var(--muted); font-size: 14px; }
.kind { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

/* Coach notes */
.notes { display: grid; gap: 24px; }
.notes section { display: grid; gap: 12px; }
.notes h2 { font-size: 24px; font-weight: 800; }
.notes p, .notes li { max-width: 68ch; }
.notes ol, .notes ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.find { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.find a { color: var(--accent); font-size: 14px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.plan li b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--accent); margin-right: 6px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; min-width: 0; }
.form .wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.status { font-size: 14px; color: var(--muted); }
.sugg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.sugg p { white-space: pre-wrap; overflow-wrap: anywhere; }
footer { color: var(--muted); font-size: 13px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app">
  <header>
    <div class="top">
      <p class="eyebrow">Player Code of Conduct · Training</p>
      <button class="tell-btn" id="tell-btn" aria-expanded="false" aria-controls="tell">Need to talk to someone?</button>
    </div>
    <section class="tell" id="tell" hidden aria-label="Who to tell"></section>

<script>
const CODE = [
  { id: "commit", n: 1, name: "Commitment", line: "Attend training and matches, tell the coach in advance if you can’t, arrive on time with the right kit, give full effort, and put the team before yourself." },
  { id: "attitude", n: 2, name: "Behaviour & Attitude", line: "Respect coaches, teammates, referees, opponents and fans. Follow instructions and ask questions politely. No swearing or offensive gestures. Stay positive when things go wrong." },
  { id: "sport", n: 3, name: "Sportsmanship", line: "Play by the rules, accept the referee’s decisions without arguing, lift your teammates up, and acknowledge opponents respectfully after every match." },

  { id: "match", n: 5, name: "Match Day", line: "Arrive on time to warm up, respect the coach’s decisions on minutes, positions and tactics, represent the team with dignity, and handle setbacks maturely." },

/* Academy track. In every list the best option comes first; the page shuffles for display.
   type "mcq": opts + fb (fb[0] = why it is best). type "rank": three opts in best-to-worst order + fb for each.
   panels: {cap} = caption box, {who, say} = speech bubble, {who, think} = thought bubble. */
const ACADEMY = [
  { id: "c1", sec: "commit", title: "Double-session Thursday", type: "mcq",
    panels: [{ cap: "Wednesday lunch. Kai has an English essay due on Friday morning." }, { who: "Kai", say: "Thursday’s a double session. When am I meant to write this?" }, { who: "Amara", say: "Just skip the evening session. Coach won’t mind." }],
    q: "What should Kai do?",
    opts: ["Tell the education officer today, and start the essay in Wednesday’s study block", "Skip Thursday evening’s session and explain to the coach afterwards", "Stay up until 1am on Thursday to finish it", "Hand the essay in late. Football is the priority right now"],
    fb: ["He spotted the clash early and asked for help. The academy has study time for exactly this.", "Missing a session without warning lets the coach down, and telling them afterwards is too late for them to plan.", "Sleep is when your body recovers from a double session. Five hours of sleep makes you slower and more likely to get injured.", "Academies take school seriously, and so do the coaches. Most academy players don’t become professionals, so school is your safety net."],
    coach: "Kai spotted the clash on Wednesday, not Thursday night. The education officer helped him plan, and he trained and handed the essay in on time.",
    why: { you: "Planning ahead means no all-nighters and no missed sessions.", club: "Academies are judged on players’ school results as well as football.", game: "Professionals plan their week around training, rest and everything else." },
    tip: "Look at your week every Sunday night. Spot the clashes before they happen." },
  { id: "c2", sec: "commit", title: "The rest day", type: "rank",
    panels: [{ cap: "The academy won a weekend tournament. Monday is a recovery day." }, { who: "Leo", say: "I feel fine. I could do an extra session and get ahead of everyone." }, { who: "Physio", say: "Today’s plan is sleep, stretching, a walk and good food." }],
    q: "Rank Leo’s options from best (1) to worst (3).",
    opts: ["Follow the recovery plan: sleep, stretch, walk, eat well", "Have a gentle kickabout with friends for an hour", "Do a two-hour solo session to get ahead"],
    fb: ["Recovery is part of training. Muscles get stronger while they rest, not while they work.", "Light activity is OK, but it isn’t the plan the staff set for you.", "Hard extra training on a recovery day is how overuse injuries happen. More isn’t always better."],
    coach: "The best players take recovery as seriously as training. Leo’s extra session would have looked keen, but it would have put him at risk.",
    why: { you: "Rest days prevent overuse injuries, which are more likely while you’re still growing.", club: "Staff plan the whole week. Recovery days are part of that plan.", game: "Top players protect their bodies so they can play for years." },
    tip: "Growing fast? Tell the physio about any aches. Growth spurts make some injuries more likely." },
  { id: "c3", sec: "commit", title: "The press", type: "mcq",
    panels: [{ cap: "60th minute. The plan is to press as a team. First-team staff are watching." }, { who: "Theo", think: "I’m tired. If I save my legs, I’ll have more when we attack." }, { cap: "The ball goes to their centre-back. That’s Theo’s trigger to press." }],
    q: "What should Theo do?",
    opts: ["Press as planned, and tell the coach at the next break that he’s tiring", "Save his energy for attacking moments the staff will notice", "Press only when the ball comes near him", "Ask to come off without saying why"],
    fb: ["Doing your job for the team, and being honest about how you feel, is what the coach needs.", "If one player stops pressing, the whole press breaks. Staff notice who works for the team.", "A half-press is easy to play through and leaves gaps behind you.", "Coaches need the real reason. Being honest about tiredness helps them plan the subs."],
    coach: "Theo pressed when his trigger came and told the coach he was tiring. A fresh player came on ten minutes later and the plan held.",
    why: { you: "Staff judge players on their work without the ball as well as with it.", club: "The team’s plan only works if all eleven follow it.", game: "Teams beat talented individuals." },
    tip: "Staff watch what you do when you don’t have the ball." },

  { id: "a1", sec: "attitude", title: "Kept on, let go", type: "mcq",
    panels: [{ cap: "End-of-season reviews are done. Mateo has been kept on. His friend Josh has been released." }, { who: "Group chat", say: "LET’S GO! See you all next season!!" }, { cap: "Josh hasn’t been online since this morning." }],
    q: "What should Mateo do?",
    opts: ["Message Josh privately to check he’s OK, and keep his own celebrating low-key", "Post a celebration. He worked hard and earned it", "Give Josh space for a few weeks so it isn’t awkward", "Tell Josh the coaches got it wrong"],
    fb: ["Being a good teammate includes looking after people when they leave. Josh will remember who checked in.", "You did earn it, and it’s fine to be happy. Celebrating loudly where Josh can see it can hurt, though.", "Silence can feel like being dropped by your friends as well as by the club.", "It sounds kind, but it can give false hope and undermines staff who know more than you do."],
    coach: "Mateo was happy for himself and still thought about his friend. That is what respect looks like in an academy.",
    why: { you: "One day you might be the player who is released. Kindness comes back round.", club: "How players treat released teammates shapes how families see the academy.", game: "Many released players go on to play elsewhere. Football is a small world." },
    tip: "Being released is common, and many released players still have great careers. Be the friend who stays in touch.",
    next: { q: "Josh replies: “Leave me alone.” What now?", opts: ["Say “No problem, I’m here when you want to talk”, and check in again in a few days", "Keep messaging until he answers", "Tell the group chat he’s struggling"], fb: ["Giving him space while staying available is the kind response. If you’re worried about him, tell a staff member.", "Pushing can make him feel worse.", "That shares his private feelings without his permission."] } },
  { id: "a2", sec: "attitude", title: "Video review", type: "rank",
    panels: [{ cap: "Video review. The clip shows Sofia losing her runner twice before a goal." }, { who: "Coach", say: "Talk me through this one, Sofia." }, { who: "Sofia", think: "Everyone’s watching me." }],
    q: "Rank Sofia’s replies from best (1) to worst (3).",
    opts: ["“I see it. What should I look for earlier?”", "Nod and say nothing", "“The centre-back should have marked him.”"],
    fb: ["Owning it and asking a question shows you’re coachable, one of the main things academy staff look for.", "Not harmful, but the coach can’t tell if you’ve understood.", "Blaming a teammate in front of the group damages trust, even if they were partly at fault."],
    coach: "Feedback in front of the group is hard. Sofia owned her part and asked a question, so the session moved on to fixing it.",
    why: { you: "Players who take feedback well improve faster.", club: "Review sessions only work if players are honest.", game: "Every professional watches clips of their own mistakes." },
    tip: "Try: “I see it. What should I do differently?” It works every time." },
  { id: "a3", sec: "attitude", title: "Playing up", type: "mcq",
    panels: [{ cap: "Nia has been asked to train with the Under-15s for the first time." }, { who: "U15 player", say: "Who invited the little one?" }, { cap: "In the rondo, the older players keep passing around her." }],
    q: "What should Nia do?",
    opts: ["Keep moving to show for the ball, and tell the coach if the comments carry on", "Go quiet and only play safe passes", "Make a joke back about the older player", "Ask to go back to her own age group"],
    fb: ["Staying brave on the ball earns respect. If comments about you carry on, staff need to know.", "Hiding means the coaches don’t see why you were moved up.", "Getting into it with an older group usually makes it worse, and it isn’t why you’re there.", "It’s natural to want to, but you were selected because staff think you’re ready."],
    coach: "Nia kept showing for the ball. By the end of the week the older players were passing to her.",
    why: { you: "Playing up is a sign staff rate you. Make the most of it.", club: "Moving players up only works if older players make them welcome.", game: "Most top players were once the youngest in the group." },
    tip: "When you’re the youngest, be the loudest communicator, not the quietest." },

  { id: "s1", sec: "sport", title: "The penalty", type: "mcq",
    panels: [{ cap: "International tournament. The referee, about 16, gives a penalty against Ben for a dive he says he didn’t make." }, { cap: "Three teammates surround her, shouting." }, { who: "Captain", say: "Leave it, I’ll speak to her." }],
    q: "What should Ben do?",
    opts: ["Step away, pull a teammate back, and let the captain speak", "Join the group. It was unfair and she needs to hear it", "Stay out of it but tell her, “That’s a joke”", "Say nothing now, but skip her handshake at full time"],
    fb: ["Taking the heat out of it protects your team from cards and shows the academy’s standards.", "Surrounding a referee is intimidating and gets cards. Abuse is a big reason young referees quit.", "That’s dissent, and it can still earn a card.", "Snubbing her is still disrespect, and staff will notice."],
    coach: "Ben walked away and brought a teammate with him. The captain asked one calm question. That’s the standard.",
    why: { you: "Cards for dissent cost you minutes.", club: "Academies are watched on tour. Behaviour abroad reflects on the whole club.", game: "Football needs young referees to stay in the game." },
    tip: "Only the captain talks to the referee." },
  { id: "s2", sec: "sport", title: "Light contact", type: "rank",
    panels: [{ cap: "Late in a tight game, Leo feels a light clip on his heel near the box." }, { who: "Leo", think: "If I go down, I might win a free kick." }],
    q: "Rank Leo’s options from best (1) to worst (3).",
    opts: ["Stay on his feet and keep playing", "Go down, because there was some contact", "Go down holding his face"],
    fb: ["Staying up keeps the attack alive and builds a reputation with referees as an honest player.", "There was contact, so it isn’t outright cheating, but going down easily becomes a habit referees notice.", "That’s simulation. It’s a yellow card, and the kind of clip that follows a player around."],
    coach: "Leo stayed up and the attack carried on. Referees remember honest players and trust them on the big decisions.",
    why: { you: "If referees see you as honest, you get the fouls you deserve.", club: "The academy wants to be known for clean, honest football.", game: "Fans need to trust that results are earned." },
    tip: "If a younger player copied what you just did, would you be proud of it?" },
  { id: "s3", sec: "sport", title: "The winner", type: "mcq",
    panels: [{ cap: "Theo scores a late winner against the rival academy." }, { who: "Teammate", say: "Run to their bench!" }, { cap: "The other team’s players are already upset." }],
    q: "How should Theo celebrate?",
    opts: ["Celebrate with his team and his own supporters", "Run to their bench and cup his ears", "Celebrate, then shush the opposition parents", "Don’t celebrate at all, to be respectful"],
    fb: ["Enjoy the moment with the people on your side, and leave the other team alone.", "Taunting the other bench can start a fight and lead to a ban.", "Provoking the crowd is unsporting and can get you booked.", "You don’t need to hide your joy. Enjoy it with your team."],
    coach: "Theo celebrated with his teammates, then shook every opponent’s hand at full time.",
    why: { you: "A celebration that provokes can get you a yellow card.", club: "Rival academies play each other every season. Respect keeps those games safe.", game: "Winning with class is part of the game." },
    tip: "Celebrate towards your own people, never at theirs." },

  { id: "t1", sec: "train", title: "The hidden knock", type: "mcq",
    panels: [{ cap: "Tuesday. Ben’s hamstring feels tight. Saturday is the biggest game of the season." }, { who: "Ben", think: "If I tell the physio, I might miss Saturday." }, { who: "Amara", say: "You OK? You’re limping a bit." }],
    q: "What should Ben do?",
    opts: ["Tell the physio today", "Train lightly and see how it feels by Thursday", "Tell Amara but not the staff", "Take painkillers and train as normal"],
    fb: ["Telling the physio early is the fastest way back. A small problem caught on Tuesday might still let you play on Saturday.", "Training on a tight hamstring is how a small problem becomes a long injury.", "Your teammates can’t treat it. The physio can.", "Painkillers hide the warning sign without fixing anything. Never take medicine without your parents or the medical team knowing."],
    coach: "Ben told the physio. It was a minor strain, and with treatment he was fit for the second half on Saturday.",
    why: { you: "Hidden injuries become long injuries.", club: "Medical staff can only plan if players are honest.", game: "Honest players have longer careers." },
    tip: "Being honest with medical staff is part of commitment, not a lack of it.",
    next: { q: "The physio says rest for five days. You’ll miss Saturday.", opts: ["Accept it, do the rehab properly, and support the team on Saturday", "Ask a different physio for a second opinion", "Rest for three days, then train anyway"], fb: ["Doing your rehab properly is how you get back fastest.", "The medical team works together. Looking for a different answer wastes time.", "Coming back too early is one of the biggest causes of getting injured again."] } },
  { id: "t2", sec: "train", title: "Stuck in the middle", type: "mcq",
    panels: [{ cap: "Rondo drill. Kai has been stuck in the middle for four rounds." }, { who: "Teammate", say: "Kai lives in there now!" }, { cap: "Everyone laughs. Kai’s face goes red." }],
    q: "What should Kai do?",
    opts: ["Ask the coach or a teammate for one tip, then go again", "Start fouling to win the ball back", "Stop trying to intercept and wait for the drill to end", "Say the drill is pointless"],
    fb: ["Struggling in a drill is how you learn. Asking for a tip shows maturity.", "Fouling in training risks injuring a teammate and gets you taken out of the drill.", "Giving up is the one way to make sure you don’t improve.", "Blaming the drill won’t make it easier next time."],
    coach: "Kai asked how to cut out the pass. Two rounds later he won the ball.",
    why: { you: "Players who learn from struggling improve the most.", club: "Coaches make drills hard on purpose.", game: "Even the best players get stuck in the middle sometimes." },
    tip: "Being stuck isn’t failing. Giving up is." },
  { id: "t3", sec: "train", title: "The trialist", type: "rank",
    panels: [{ cap: "A trialist joins training. He plays in Mateo’s position." }, { who: "Mateo", think: "What if he takes my place?" }],
    q: "Rank Mateo’s options from best (1) to worst (3).",
    opts: ["Help him settle in, and compete hard for the ball", "Compete hard, but ignore him off the ball", "Pass to him less in the small-sided game"],
    fb: ["Competition makes you better. Being welcoming at the same time shows real confidence.", "Competing is good, but ignoring him off the pitch isn’t the academy’s way.", "Freezing someone out hurts the team, and coaches notice it straight away."],
    coach: "Mateo showed the trialist where everything was, then competed hard against him all session. That’s what we want.",
    why: { you: "Coaches select players who perform, not players who sabotage.", club: "Trialists tell other players what the academy is like.", game: "You’ll compete with teammates for places your whole career." },
    tip: "Remember how it felt on your own first day." },

  { id: "m1", sec: "match", title: "Two voices", type: "mcq",
    panels: [{ cap: "Home match. Sofia’s dad is shouting from the touchline." }, { who: "Dad", say: "Get forward, Sofia! Shoot!" }, { who: "Coach", say: "Sofia, hold your position!" }],
    q: "What should Sofia do?",
    opts: ["Follow the coach, and talk to her dad calmly after the game", "Follow her dad. He knows her game best", "Shout at her dad to stop", "Ignore both and do her own thing"],
    fb: ["In a match, the coach decides. Talking to your parent calmly afterwards protects your relationship and the team.", "During a match the coach’s plan comes first. Two sets of instructions break the team’s shape.", "Shouting back creates a scene in front of everyone.", "Doing your own thing lets your team down."],
    coach: "Sofia held her position. After the game she told her dad the shouting confused her. Academies have a parents’ code too, so staff can help.",
    why: { you: "Two sets of instructions slow your decisions down.", club: "Staff can support you with touchline pressure.", game: "Touchline pressure is one of the reasons young players stop enjoying football." },
    tip: "It’s OK to tell a parent, kindly, that you only want encouragement during games." },
  { id: "m2", sec: "match", title: "Off at half-time", type: "mcq",
    panels: [{ cap: "Half-time in a showcase game. The coach takes Leo off." }, { who: "Leo", think: "Everyone’s watching. That’s embarrassing." }],
    q: "What should Leo do?",
    opts: ["High-five the player coming on, sit with the team, and ask later what to work on", "Ask the coach right there why he’s been taken off", "Go and sit with his parents for the second half", "Go straight to the changing room to cool down"],
    fb: ["Supporting the team when you’re disappointed shows staff exactly the character they want.", "Asking is fine, but half-time is the coach’s busiest moment. Ask when things are calm.", "You’re still part of the team for the second half.", "Leaving your teammates looks like sulking, even if you just need a minute."],
    coach: "Leo was the first to congratulate the sub. In his review, staff noted it as a positive.",
    why: { you: "How you react to being subbed is watched as closely as how you play.", club: "Coaches share minutes so every player develops.", game: "Squads win games, not eleven players." },
    tip: "Disappointed is fine. Sulking isn’t." },
  { id: "m3", sec: "match", title: "Abuse on the pitch", type: "mcq",
    panels: [{ cap: "Away match. An opponent makes a racist comment to Kai." }, { who: "Kai", think: "I want to hit him." }, { who: "Captain", say: "Kai, what happened?" }],
    q: "What should Kai do?",
    opts: ["Tell the referee and the captain straight away, and don’t retaliate", "Push the opponent. He deserves it", "Say nothing and try to forget it", "Get him back with a hard tackle later"],
    fb: ["Reporting it straight away is brave and protects you. Referees and the academy have procedures for discriminatory abuse.", "If you retaliate, you could be sent off while he gets away with it.", "You shouldn’t have to put up with abuse. Reporting it is how it stops.", "A revenge tackle risks injuring someone and a long ban for you."],
    coach: "Kai told the referee and his captain. The club reported it, and staff checked in with Kai after the game.",
    why: { you: "Reporting protects you. Retaliating could get you banned.", club: "The academy needs to know so it can act and support you.", game: "Abuse only stops when it’s reported every time." },
    tip: "Every incident gets reported. You will always be supported.",
    next: { q: "The referee didn’t hear it and says play on.", opts: ["Tell the coach at the next break, so the club can report it", "Deal with it himself", "Let it go, because the referee didn’t hear it"], fb: ["The club can still report it after the game. Your coach needs to know.", "Dealing with it yourself usually means retaliating.", "It still happened, and it still gets reported."] } },

  { id: "o1", sec: "off", title: "The DM", type: "mcq",
    panels: [{ cap: "10pm. An account Amara doesn’t know sends her a message." }, { who: "Agent?", say: "I can get you trials at bigger clubs. Send me your number." }, { who: "Amara", think: "Is this my big chance?" }],
    q: "What should Amara do?",
    opts: ["Don’t reply, and show her parents and the academy’s player care team", "Reply to find out more. It could be real", "Send her highlights, but no personal details", "Block the account and tell nobody"],
    fb: ["Approaches to academy players should go through the club and parents. Unknown accounts making offers are a warning sign.", "Real agents and clubs contact academy players through their club and parents, not private messages.", "Anything you send can be used to keep contacting you. Let adults check first.", "Blocking is good, but staff need to know. The same account may be messaging your teammates."],
    coach: "Amara showed her mum and player care. It wasn’t a real agent. Staff warned the rest of the squad that week.",
    why: { you: "Showing a trusted adult keeps you safe.", club: "Clubs have strict rules about approaches to academy players.", game: "Protecting young players keeps football safe." },
    tip: "Anyone who tells you to keep football contact secret is a red flag.",
    next: { q: "The account messages again: “Don’t tell your club. They’ll hold you back.”", opts: ["That’s a red flag. Show player care today", "Reply to ask why", "Keep it quiet for now"], fb: ["Asking you to keep secrets from the club is a serious warning sign. Tell staff today.", "Replying keeps the conversation going. Let adults handle it.", "Secrecy is exactly what they want."] } },
  { id: "o2", sec: "off", title: "Filmed in the hotel", type: "mcq",

    opts: ["Ask Ben not to post it, because anything with the badge on goes public", "Let him post it. It’s funny", "Let him post it to close friends only", "Grab his phone and delete it"],

    coach: "Theo asked Ben not to post it, and Ben agreed. Nobody had to explain anything to the hotel or the academy.",
    why: { you: "Clips last for years, and clubs check social media.", club: "The academy’s reputation travels with the badge.", game: "Young players are role models, even off the pitch." },
    tip: "Before posting, ask: would I be happy if the head of the academy saw this?" },
  { id: "o3", sec: "off", title: "Behind in maths", type: "rank",
    panels: [{ cap: "Parents’ evening. Nia’s maths teacher says she’s falling behind." }, { who: "Nia", think: "Football’s my career now anyway." }],
    q: "Rank Nia’s options from best (1) to worst (3).",
    opts: ["Tell the academy’s education officer and use the study sessions", "Try to catch up alone at weekends", "Don’t worry about it. Football is her career now"],
    fb: ["Academies have education staff for exactly this. Asking early is easiest.", "Trying is good, but weekends are also for rest and family. Get help.", "Most academy players don’t become professional footballers. School keeps your options open."],
    coach: "Nia talked to the education officer. Two study sessions a week got her back on track.",

    tip: "Good study habits and good training habits are the same habits." }
];

/*LIBRARY:START*/const LIBRARY = [{"id":"c4","sec":"commit","wk":1,"title":"Cancelled bus","type":"mcq","panels":[{"cap":"Training starts at 5pm. Ollie’s bus has just been cancelled."},{"who":"Ollie","think":"The next one gets me there 40 minutes late."},{"cap":"His phone is in his hand."}],"q":"What should Ollie do?","opts":["Message the coach now with the problem and when he’ll arrive, then join in quietly when he gets there","Explain to the coach when he arrives","Go home. He’ll miss too much of the session anyway","Get there, skip the warm-up and run straight into the drill"],"fb":["A quick message lets the coach plan the groups. Turning up late but ready still shows commitment.","By then the coach has already planned without you. A message now costs ten seconds.","Forty minutes of training is still worth having, and the coach would rather you came.","Skipping the warm-up is how players pull muscles. Ask the coach how to warm up on your own."],"coach":"Ollie’s message arrived before the session started, so the coach kept a place for him in the second half. He warmed up at the side, then joined in.","why":{"you":"Late but honest is far better than missing without a word.","club":"Coaches plan drills around the number of players coming.","game":"Professionals tell staff early when something goes wrong."},"tip":"Save the coach’s number and your academy’s group chat rules in your phone today."},{"id":"c5","sec":"commit","wk":1,"title":"Away day bag","type":"rank","panels":[{"cap":"Saturday is an away match. The coach leaves at 7:30am."},{"who":"Zara","say":"Mum, can you pack my kit in the morning?"},{"who":"Mum","say":"It’s your kit, love."}],"q":"Rank Zara’s options from best (1) to worst (3).","opts":["Pack the night before using a checklist: boots, shin pads, kit, water, food","Pack quickly in the morning before the coach leaves","Let Mum pack it and hope everything is there"],"fb":["A checklist the night before means nothing is forgotten and the morning is calm.","It can work, but rushing at 6:45am is when boots get left behind.","Your kit is your job. If something is missing, you can’t play."],"coach":"Zara wrote a checklist and stuck it inside her wardrobe door. She has not forgotten anything since.","why":{"you":"A calm morning means a calm warm-up.","club":"Staff can’t solve missing kit at an away ground.","game":"Every professional has a routine before a game."},"tip":"Make your checklist once. Use it every week."},{"id":"c6","sec":"commit","wk":1,"title":"The family wedding","type":"mcq","panels":[{"cap":"Sami’s cousin is getting married on a Saturday in six weeks. It’s a match day."},{"who":"Sami","think":"The coach might be annoyed. Maybe I’ll mention it nearer the time."}],"q":"What should Sami do?","opts":["Tell the coach this week, so they can plan","Tell the coach the day before","Ask his dad to tell the coach on the morning of the match","Say he’s ill on the day"],"fb":["Family events matter, and coaches understand when they hear early. Six weeks’ notice makes it easy for them.","The day before leaves the coach scrambling to change the team.","It’s your commitment, so it’s your message to send. On the morning is far too late.","Lying to the coach breaks trust, and stories like that usually come out."],"coach":"Sami told the coach six weeks early. The coach thanked him and gave another player a chance to start.","why":{"you":"Honesty early means no awkward conversation later.","club":"Staff plan squads weeks ahead.","game":"Clubs trust players who communicate."},"tip":"As soon as you know about a clash, tell the coach. Early is always better."},{"id":"c7","sec":"commit","wk":1,"title":"One more game","type":"mcq","panels":[{"cap":"11:45pm. Leo has training at 8am."},{"who":"Friend (online)","say":"One more game? Just one!"},{"who":"Leo","think":"I’m not even tired."}],"q":"What should Leo do?","opts":["Log off, and put his phone outside his room to charge","Play one more quick game","Get into bed but keep scrolling with the brightness down","Stay up, then nap after training"],"fb":["Teenagers need around nine hours of sleep. Sleep is when your body recovers and your brain stores what you learned.","One more game is rarely one, and screens before bed make it harder to fall asleep.","Scrolling in bed still keeps your brain awake.","A nap after training doesn’t fix being slow and tired during it."],"coach":"Leo agreed a ‘phones off’ time with his parents. His reaction times in testing improved over the next block.","why":{"you":"Sleep makes you faster, sharper and less likely to get injured.","club":"Staff can see when players are tired.","game":"Recovery is part of being a footballer."},"tip":"Phone charges outside your bedroom. It’s the easiest win in football."},{"id":"c8","sec":"commit","wk":1,"title":"The off-season plan","type":"mcq","panels":[{"cap":"Two weeks before the season. The academy gave everyone a running plan to log in an app."},{"who":"Theo","think":"I’ve done about half of it."},{"who":"Teammate","say":"Just tick them all. Nobody checks."}],"q":"What should Theo do?","opts":["Log honestly what he did, and do the rest of the plan from now","Tick every session as done","Skip it and cram all the running into the last week","Do double sessions every day to catch up"],"fb":["Honest logs help staff plan your fitness. Doing the rest of the plan now still helps.","Staff test fitness on day one. False logs get found out, and trust is hard to win back.","Cramming running into a week is a recipe for sore shins and injury.","Doubling the load suddenly is one of the main causes of overuse injuries."],"coach":"Theo’s honest log showed staff he needed a gentler start. He was fully fit by week three.","why":{"you":"Honest data keeps you safe.","club":"Fitness plans only work if staff know the truth.","game":"Professionals are tested constantly. Honesty is easier."},"tip":"Staff would rather see ‘did 6 of 10’ than a fake ‘did 10 of 10’."},{"id":"c9","sec":"commit","wk":1,"title":"Gym Wednesday","type":"mcq","panels":[{"cap":"Wednesday is the gym session. Ollie hates it."},{"who":"Ollie","say":"Why can’t we just play football?"},{"who":"Coach","say":"This is football. It keeps you on the pitch."}],"q":"What should Ollie do?","opts":["Give it full effort, and ask the coach what each exercise is for","Do the minimum and save energy for Thursday","Say he has a knock so he can sit out","Chat through it so it goes faster"],"fb":["Asking why turns a boring session into a useful one. Strength work prevents injuries.","Strength work only helps if you actually do it.","Faking an injury wastes the physio’s time and costs trust.","Chatting distracts others and makes the exercises unsafe."],"coach":"Ollie asked what the exercises were for. The coach explained they protect his knees during growth spurts. He’s never missed a set since.","why":{"you":"Strong players get injured less.","club":"Gym sessions are planned by specialists.","game":"Every top player does strength work."},"tip":"If a session feels pointless, ask what it’s for. Don’t just switch off."},{"id":"c10","sec":"commit","wk":1,"title":"Tournament snacks","type":"mcq","panels":[{"cap":"Tournament day. Four games, with gaps in between."},{"who":"Teammate","say":"Energy drinks and sweets from the shop?"},{"who":"Maya","think":"The nutrition sheet said fruit, sandwiches and water."}],"q":"What should Maya do?","opts":["Stick to the plan: water, fruit and the food she brought","Have an energy drink for a boost","Skip lunch so she feels light","Live on sweets between games"],"fb":["Steady food and water keep your energy level across four games.","Energy drinks are not recommended for under-16s, and the crash comes mid-game.","Not eating means you run out of energy by game three.","Sweets give a quick spike, then a drop."],"coach":"Maya’s team finished the day stronger than most. The coach mentioned their nutrition in the review.","why":{"you":"Food is fuel. The right fuel lasts all day.","club":"Nutrition plans are part of academy training.","game":"Professionals plan what they eat on match days."},"tip":"Pack a water bottle and two snacks from the plan. Every time."},{"id":"c11","sec":"commit","wk":1,"title":"The school cup","type":"mcq","panels":[{"cap":"Zara’s school team is in the county cup final on Friday. The academy plays on Saturday."},{"who":"PE teacher","say":"We really need you, Zara."},{"who":"Zara","think":"I don’t want to let anyone down."}],"q":"What should Zara do?","opts":["Ask the academy staff before she agrees, so they can help her decide","Play both and say nothing","Tell the school no, without explaining","Tell the school she’s injured"],"fb":["Academies often have rules about playing for other teams, and they plan your training load. Staff can help you find a fair answer for both.","Two games in two days can be too much, and academies often need to know.","Your school deserves an honest reason.","Lying to the school hurts your relationship with them."],"coach":"Zara asked. The academy agreed she could play half the school final and rest on Saturday morning. Everyone knew the plan.","why":{"you":"Asking first keeps you out of trouble with both teams.","club":"Academies manage players’ load to protect them.","game":"Being honest with every team you play for builds trust."},"tip":"Before you agree to play for anyone else, ask the academy first."},{"id":"c12","sec":"commit","wk":1,"title":"The long journey","type":"mcq","panels":[{"cap":"Sami travels two hours each way to the academy, three evenings a week."},{"who":"Sami","think":"I’m exhausted, and my homework is piling up."},{"cap":"He hasn’t told anyone."}],"q":"What should Sami do?","opts":["Talk to player care about his travel, sleep and homework","Quietly start missing the odd session","Complain to teammates but not the staff","Quit without talking to anyone"],"fb":["Player care staff deal with this all the time. They may help with transport, study time or the timetable.","Missing sessions without explaining looks like low commitment, when the real problem is fixable.","Teammates can’t change your timetable. Staff can.","Big decisions should never be made tired and alone."],"coach":"Player care helped Sami use the journey for reading and moved one session to a study session. He felt much better within a month.","why":{"you":"Problems shrink when you share them early.","club":"Academies have staff whose job is your wellbeing.","game":"Lots of players travel long distances. You’re not alone."},"tip":"Feeling stretched is not a weakness. Tell player care."},{"id":"c13","sec":"commit","wk":7,"title":"Knee pain","type":"mcq","panels":[{"cap":"Ade has grown five centimetres since summer. His knees ache after every session."},{"who":"Ade","think":"Everyone gets sore. I don’t want to look soft."}],"q":"What should Ade do?","opts":["Tell the physio about the pain and the growth spurt","Ignore it. It’s just soreness","Stop training without telling anyone","Look up treatments online and try them himself"],"fb":["Growth-related knee pain is common at 13, and physios can adjust your training so it settles.","Pain that keeps coming back is a signal, not something to ignore.","Staff need to know, so they can help you keep training safely.","Online advice isn’t made for your body. The physio can examine you."],"coach":"The physio changed Ade’s jumping and sprinting load for a few weeks. The pain eased and he kept training.","why":{"you":"Speaking up early keeps small problems small.","club":"Academy staff track growth so they can protect players.","game":"Many top players had growing pains at your age."},"tip":"Growth spurts are normal. Pain is information. Tell someone."},{"id":"c14","sec":"commit","wk":7,"title":"Hot day, no bottle","type":"mcq","panels":[{"cap":"30°C. Training starts in five minutes."},{"who":"Finn","think":"I left my water bottle on the bus."},{"who":"Teammate","say":"Just share mine."}],"q":"What should Finn do?","opts":["Tell staff straight away and get a bottle or fill a cup before the session","Share his teammate’s bottle","Train without water. It’s only 90 minutes","Buy a fizzy drink from the machine"],"fb":["Staff can sort water quickly, and being hydrated keeps you sharp in the heat.","Sharing bottles spreads bugs around a squad.","Training in heat without water can make you ill.","Fizzy drinks don’t hydrate as well as water."],"coach":"Finn told the coach, who had spare bottles. He trained the full session without a problem.","why":{"you":"Dehydration makes you slower and can make you ill.","club":"Staff would rather know than treat a player who feels faint.","game":"Hydration is basic professional practice."},"tip":"In hot weather, drink before you feel thirsty."},{"id":"c15","sec":"commit","wk":7,"title":"The cool-down","type":"rank","panels":[{"cap":"Final whistle. The coach calls everyone for a 10-minute cool-down."},{"who":"Theo","think":"My dad’s waiting in the car park."}],"q":"Rank Theo’s options from best (1) to worst (3).","opts":["Do the full cool-down with the team","Do a quick stretch on his own and leave","Skip it and go straight to the car"],"fb":["A cool-down helps recovery and is part of the session. It’s ten minutes.","Some stretching is better than none, but you miss the plan and your team.","Skipping recovery means stiffer muscles for the next session."],"coach":"Theo did the cool-down. His dad waited ten minutes. It’s now part of their routine.","why":{"you":"You’ll feel better at the next session.","club":"Staff plan recovery as carefully as training.","game":"Recovery separates good players from great ones."},"tip":"The session ends when the coach says so, not at the final whistle."},{"id":"c16","sec":"commit","wk":7,"title":"The powder","type":"mcq","panels":[{"cap":"In the changing room, an older player has a tub of pre-workout powder."},{"who":"Older player","say":"Want some? Makes you fly."},{"who":"Leo","think":"If it works for him…"}],"q":"What should Leo do?","opts":["Say no thanks, and ask the academy’s nutrition staff or his parents if he’s curious","Try a small amount just once","Order a cheap one online","Take it because professionals use supplements"],"fb":["Supplements aren’t recommended for young players, and some contain banned substances. Food does the job at your age.","Even a small amount can contain ingredients that are unsafe or banned.","Cheap online products are the most likely to contain things that aren’t on the label.","Professionals use tested products under medical supervision. That isn’t the same."],"coach":"Leo said no and asked the nutritionist. She explained what to eat instead and why supplements aren’t for under-16s.","why":{"you":"Your body is still growing. Real food is what it needs.","club":"Academies follow anti-doping rules.","game":"A failed test can end a career before it starts."},"tip":"Never take anything you haven’t checked with the academy’s medical or nutrition staff."},{"id":"c17","sec":"commit","wk":7,"title":"The bleep test","type":"mcq","panels":[{"cap":"Fitness testing. Mateo reaches level 11. His legs burn."},{"who":"Mateo","think":"I could stop now and say that was my best."},{"cap":"His friend stopped at level 10."}],"q":"What should Mateo do?","opts":["Keep going until he truly can’t, and tell staff if he feels unwell","Stop now to save energy for the match","Pretend to get cramp so he can stop","Stop at the same level as his friend"],"fb":["Honest results help staff plan your training. And you find out what you can really do.","Tests only help if they show your real level.","Faking cramp is dishonest and wastes the staff’s attention.","Your test is about you, not your friend."],"coach":"Mateo reached level 12. Staff used his result to plan his speed work, and he beat it next time.","why":{"you":"Real scores show real progress.","club":"Staff plan training from test results.","game":"Effort in tests is a habit that shows in matches."},"tip":"Tests aren’t a competition with your mates. Beat your last score."},{"id":"c18","sec":"commit","wk":7,"title":"Food diary","type":"mcq","panels":[{"cap":"The nutritionist asks players to log everything they eat for a week."},{"who":"Priya","think":"I had chips twice and a fizzy drink. Should I leave those out?"}],"q":"What should Priya do?","opts":["Log everything honestly, including the chips and the drink","Log what she thinks the nutritionist wants to see","Skip the diary. It’s private","Only log the healthy days"],"fb":["The nutritionist can only help with what’s real. Chips sometimes are fine. They’re looking for patterns.","A made-up diary makes the advice useless.","If you’re uncomfortable, talk to the nutritionist, but don’t just skip it.","Leaving days out gives a false picture."],"coach":"Priya’s honest diary showed she skipped breakfast on school days. One small change gave her more energy in evening sessions.","why":{"you":"Honest data means advice that actually helps you.","club":"Staff aren’t judging. They’re helping.","game":"Professionals share food logs with nutritionists all the time."},"tip":"Nobody eats perfectly. Honest is more useful than perfect."},{"id":"c19","sec":"commit","wk":7,"title":"Feverish morning","type":"mcq","panels":[{"cap":"Ben wakes up hot, achy and coughing. Training is at 10am."},{"who":"Ben","think":"If I miss it, someone else might take my place."}],"q":"What should Ben do?","opts":["Stay home, tell the coach early, and follow medical advice","Go and train to show commitment","Go, but sit out and watch","Take medicine to hide the symptoms and play"],"fb":["Training with a fever can make you more ill, and it can spread to the squad. Telling the coach early is the committed thing to do.","Training while ill can make it worse and puts teammates at risk.","Sitting in a group still spreads the illness.","Hiding symptoms with medicine can make training with a fever dangerous."],"coach":"Ben stayed home and messaged the coach at 8am. He was back in two days instead of being off for two weeks.","why":{"you":"Rest now means a quicker return.","club":"One sick player can take out half a squad.","game":"Commitment includes looking after your health."},"tip":"‘Above the neck’ sniffles might be OK. Fever or aches means stay home and tell staff."},{"id":"c20","sec":"commit","wk":7,"title":"Six weeks out","type":"mcq","panels":[{"cap":"Sami has broken his wrist. He’s out for six weeks."},{"who":"Sami","think":"What’s the point of going in if I can’t play?"}],"q":"What should Sami do?","opts":["Do his rehab, and keep coming to some sessions and matches to stay part of the team","Stay away until he’s fit","Come to everything, but sulk on the sidelines","Skip the rehab exercises at home"],"fb":["Injured players who stay involved come back fitter and still feel part of the squad.","Disappearing can make it harder to come back, and you miss learning from the side.","Being there in a bad mood brings everyone down.","Rehab is how you return. Skipping it slows you down."],"coach":"Sami helped the analyst film sessions while he was injured. He came back knowing the new tactics better than anyone.","why":{"you":"Injuries are part of football. How you handle them matters.","club":"Staff notice who stays involved.","game":"Many players learn the most while injured."},"tip":"Injured? Ask staff how you can still help the team."},{"id":"c21","sec":"commit","wk":7,"title":"Extra work","type":"rank","panels":[{"cap":"After training, Jayden wants to improve faster."},{"who":"Jayden","think":"What’s the best way to do extra?"}],"q":"Rank Jayden’s options from best (1) to worst (3).","opts":["Practise his weaker foot for 15 minutes, with the coach’s OK","Go home and rest","Do an hour of hard extra running without telling anyone"],"fb":["Short, focused extra work that staff know about helps without overloading you.","Rest is fine too. Recovery is part of improving.","Hard extra running that staff don’t know about can tip you into injury."],"coach":"Jayden agreed 15 minutes of weaker-foot work with his coach twice a week. Six weeks later he scored with it in a match.","why":{"you":"Smart extra work beats more extra work.","club":"Staff manage your total load to keep you safe.","game":"Professionals plan their extra sessions with coaches."},"tip":"Before doing extra, ask: does my coach know?"},{"id":"c22","sec":"commit","wk":13,"title":"New position","type":"mcq","panels":[{"cap":"The coach tells Lucas he’ll play right-back this season. He’s always been a winger."},{"who":"Lucas","think":"This is a demotion."},{"who":"Lucas’s dad","say":"I’ll have a word with them."}],"q":"What should Lucas do?","opts":["Commit to the role, and ask the coach what he needs to learn for it","Let his dad complain to the coaches","Play there, but without much effort","Ask to move clubs"],"fb":["Coaches often move players to develop them. Many top full-backs were wingers.","Parents speaking for you takes away your chance to show maturity.","Half effort guarantees the move won’t work.","Moving clubs over one decision is a big choice. Talk first."],"coach":"Lucas asked what to learn. Two months later he was one of the best attacking full-backs in the age group.","why":{"you":"Being able to play more than one position makes you more valuable.","club":"Coaches plan positions for your development, not just this week.","game":"The game needs adaptable players."},"tip":"Ask: ‘What would make me great in this position?’"},{"id":"c23","sec":"commit","wk":13,"title":"Team goals","type":"rank","panels":[{"cap":"The captain asks the squad to agree three team goals for the season."},{"who":"Captain","say":"Ideas, anyone?"},{"cap":"Silence. Priya has an idea but feels shy."}],"q":"Rank Priya’s options from best (1) to worst (3).","opts":["Share her idea. Short and simple is fine","Stay quiet, then back whatever the others choose","Say goals are pointless"],"fb":["Every voice helps. Squads that agree their own goals stick to them better.","Backing the team’s choice is fine, but your idea might have been the best one.","Goals give the team something to work towards together."],"coach":"Priya suggested ‘nobody walks back after losing the ball’. It became a team goal, and the squad held each other to it.","why":{"you":"Speaking up builds your confidence.","club":"The team works better when everyone is involved.","game":"Leaders start by sharing ideas."},"tip":"You don’t need a perfect idea to speak. You need one idea."},{"id":"c24","sec":"commit","wk":13,"title":"Who takes it?","type":"mcq","panels":[{"cap":"2–0 up. Penalty. Ben is the named penalty taker."},{"who":"Theo","say":"Let me take it! I need a goal."},{"who":"Theo","think":"I haven’t scored in five games."}],"q":"What should Theo do?","opts":["Let Ben take it, as the coach decided","Grab the ball and take it","Argue with Ben about who takes it","Shout to the coach to ask mid-game"],"fb":["The coach chose the taker for a reason. Respecting it keeps the team together.","Grabbing the ball can cause a row in front of everyone.","Arguing over the ball is embarrassing and wastes time.","The decision was already made before the game."],"coach":"Ben scored. After the game, Theo asked the coach about being second taker. That was the right time to ask.","why":{"you":"Your goals will come. Team rows don’t help them.","club":"Clear roles stop arguments on the pitch.","game":"Even superstars respect agreed penalty takers."},"tip":"Want a role? Ask the coach after the game, not during it."},{"id":"c25","sec":"commit","wk":13,"title":"The square pass","type":"rank","panels":[{"cap":"Jayden is through on goal at a tight angle. Lucas is unmarked in the middle."},{"who":"Lucas","say":"Square it!"}],"q":"Rank Jayden’s options from best (1) to worst (3).","opts":["Square it to Lucas for a tap-in","Shoot from the tight angle","Try to dribble past the keeper as well"],"fb":["The best chance for the team is the best choice. Coaches notice it.","A shot isn’t terrible, but the chance is far lower.","Adding another dribble usually loses the chance completely."],"coach":"Jayden squared it. Lucas scored. In the review, the coach paused the clip on Jayden’s decision.","why":{"you":"Assists show you understand the game.","club":"Teams that share the ball score more.","game":"Unselfish decisions win matches."},"tip":"Look up before you shoot. Is there a better chance?"},{"id":"c26","sec":"commit","wk":13,"title":"The excuse","type":"mcq","panels":[{"cap":"Last week Ollie skipped a gym session. He said he had homework. He was really at a friend’s house."},{"who":"Coach","say":"How did the homework go, Ollie?"}],"q":"What should Ollie do?","opts":["Tell the truth and apologise","Stick to the story","Say his parents made him stay home","Say he forgot about the session"],"fb":["Owning a mistake is hard, but trust can be rebuilt. More lies can’t be undone.","A lie gets harder to keep up, and coaches often know.","Blaming parents adds a second lie.","That’s another untrue story."],"coach":"Ollie told the truth. The coach was disappointed but thanked him for being honest. They agreed he’d make up the session.","why":{"you":"Honesty is part of your reputation.","club":"Staff trust players who own mistakes.","game":"Every player messes up. Owning it is what counts."},"tip":"If you’ve made a mistake, fix it before someone else finds it."},{"id":"c27","sec":"commit","wk":13,"title":"No phones in the changing room","type":"mcq","panels":[{"cap":"The squad agreed: no phones in the changing room before matches."},{"cap":"Jayden is filming on his phone again."},{"who":"Jayden","say":"Just one quick video!"}],"q":"What should Maya do?","opts":["Remind him of the team agreement, calmly","Tell the coach straight away in front of everyone","Get her phone out too","Ignore it"],"fb":["Teammates holding each other to agreements is what makes them work.","A quiet word first is often better than calling someone out publicly.","If everyone breaks it, the agreement means nothing.","Saying nothing tells everyone the rule doesn’t matter."],"coach":"Maya said, ‘We agreed, Jay.’ He put it away. Nobody had to involve the coach.","why":{"you":"Speaking up is a leadership skill.","club":"Team rules work when players own them.","game":"Good teams police their own standards."},"tip":"A calm reminder from a teammate works better than a telling-off."},{"id":"c28","sec":"commit","wk":13,"title":"Captain for a day","type":"mcq","panels":[{"cap":"Friendly match. The coach gives Nia the armband for the first time."},{"who":"Nia","think":"What does a captain actually do?"}],"q":"What should Nia do?","opts":["Lead by example, encourage teammates, and speak to the referee politely","Shout at teammates when they make mistakes","Play normally and not do anything different","Argue with the referee for the team"],"fb":["Captains set the standard with effort, encouragement and calm.","Shouting makes players nervous and more likely to make mistakes.","The armband is a chance to show leadership. Use it.","Captains speak to the referee calmly, not to argue."],"coach":"Nia led the warm-up, encouraged the defenders and spoke to the referee once, politely. The coach gave her the armband again.","why":{"you":"Leadership skills help you everywhere, not just in football.","club":"Captains represent the academy’s values.","game":"Good captains make everyone else better."},"tip":"A captain’s best tool is encouragement."},{"id":"c29","sec":"commit","wk":13,"title":"A promise","type":"mcq","panels":[{"cap":"Finn promised Priya he’d practise passing with her after school."},{"who":"Friends","say":"Cinema tonight? We’ve got you a ticket!"}],"q":"What should Finn do?","opts":["Keep the promise, or ask Priya first if they can move it","Just not turn up","Tell Priya at the last minute","Bring Priya to the cinema without asking"],"fb":["Keeping promises, or rearranging them fairly, is how teammates trust you.","Not turning up lets her down and wastes her time.","A last-minute cancel still leaves her stuck.","She wanted to practise, not go to the cinema."],"coach":"Finn asked Priya if they could practise the next day instead. She said yes. Both were happy.","why":{"you":"People trust players who keep their word.","club":"Teams are built on trust.","game":"Reliability is noticed."},"tip":"Need to change plans? Ask first, early."},{"id":"c30","sec":"commit","wk":13,"title":"Bench warm-up","type":"mcq","panels":[{"cap":"Ade is a substitute. The coach tells the subs to keep warming up."},{"who":"Ade","think":"I’ve been warming up for 20 minutes. Nobody is looking."}],"q":"What should Ade do?","opts":["Keep moving, so he’s ready the second he’s needed","Warm up once, then sit down","Chat with his parents behind the barrier","Only warm up when the coach looks over"],"fb":["Subs who are ready make a difference straight away. Coaches notice who is ready.","A cold sub takes ten minutes to get into the game.","You’re still part of the team on the bench.","Coaches notice the difference between being ready and looking ready."],"coach":"Ade came on in the 70th minute fully warm and set up the winner within five minutes.","why":{"you":"Being ready is how subs earn starts.","club":"Staff need subs who can change a game.","game":"Every squad member matters."},"tip":"Warm up like you’re coming on in the next minute."},{"id":"a4","sec":"attitude","wk":2,"title":"The swear word","type":"mcq","panels":[{"cap":"Kai blazes a sitter over the bar. He swears loudly."},{"cap":"The opposition parents and the referee all hear it."},{"who":"Kai","think":"Oops."}],"q":"What should Kai do now?","opts":["Say “Sorry, ref” straight away, then reset and focus on the next ball","Laugh it off. Everyone swears","Blame the bobbly pitch out loud","Keep muttering under his breath"],"fb":["A quick apology shows you know the standard. Then the best thing is to move on.","Swearing can earn a card, and the academy is judged on how its players behave.","Blaming the pitch tells everyone you don’t own your mistakes.","Muttering keeps you angry and stuck on the last chance."],"coach":"Kai apologised and the referee nodded. Ten minutes later he scored. Owning it helped him reset.","why":{"you":"Calm players make better decisions.","club":"Parents and referees remember how academy players behave.","game":"Respect is part of the game, even when you’re frustrated."},"tip":"Have a reset word ready, like “next”. Use it instead of a swear word."},{"id":"a5","sec":"attitude","wk":2,"title":"Stay wide","type":"mcq","panels":[{"cap":"The coach has told Sofia to stay wide on the left."},{"who":"Sofia","think":"There’s loads of space inside. I could drift in."},{"who":"Coach","say":"Width, Sofia!"}],"q":"What should Sofia do?","opts":["Stay wide as asked, and tell the coach about the space at the next break","Drift inside anyway. She can see it better than the coach","Argue back from the pitch","Stop running, to show she disagrees"],"fb":["Following the plan and sharing what you see at the right time helps the whole team.","If you leave your position, a teammate is left covering two players.","Arguing during play distracts you and the coach.","Not running lets the team down."],"coach":"At half-time Sofia said the space was inside. The coach changed the shape, and her idea set up the second goal.","why":{"you":"Coaches value players who see the game, and share it calmly.","club":"The team’s shape only works if everyone holds their job.","game":"Good ideas get heard when they’re shared well."},"tip":"See something? Save it for a break, then say it clearly."},{"id":"a6","sec":"attitude","wk":2,"title":"Boots off","type":"mcq","panels":[{"cap":"The academy’s building has a rule: boots off before going inside."},{"who":"Groundsman","say":"Boots off please, lads."},{"who":"Teammate","say":"It’s only the corridor."}],"q":"What should Finn do?","opts":["Take his boots off and say thanks","Walk in with his boots on. It’s only the corridor","Moan that the rule is pointless","Take them off, but leave mud everywhere"],"fb":["Respecting the people who look after the facilities is part of the code.","Rules like this keep floors safe and stop extra work for staff.","The groundsman is doing his job. Moaning isn’t respect.","Leaving mud just moves the work to someone else."],"coach":"Finn took his boots off and banged them clean outside. The groundsman remembered his name after that.","why":{"you":"Small habits show who you are.","club":"Every staff member at the academy matters.","game":"Top players treat everyone at their club with respect."},"tip":"Learn the names of the staff who look after you, and use them."},{"id":"a7","sec":"attitude","wk":2,"title":"A bad day","type":"rank","panels":[{"cap":"Ollie had his worst game of the season. He gave the ball away four times."},{"who":"Ollie","think":"I want to disappear."}],"q":"Rank Ollie’s options from best (1) to worst (3).","opts":["Write down one thing to improve and ask the coach about it next session","Go quiet for a day, then move on","Post “worst day ever” online that night"],"fb":["Turning a bad game into one clear thing to work on is how good players bounce back.","Taking time to cool off is OK, as long as you come back to it.","Public posts about bad days invite comments, and they stay online."],"coach":"Ollie wrote ‘scan before I receive’ in his notes. The coach worked on it with him. He was back to his best within two weeks.","why":{"you":"Everyone has bad games. What you do next matters most.","club":"Coaches love players who come back with a question.","game":"Bouncing back is a skill you can train."},"tip":"After a bad game: one lesson, one plan, then let it go."},{"id":"a8","sec":"attitude","wk":2,"title":"The keeper’s mistake","type":"mcq","panels":[{"cap":"Cup final. The keeper lets a soft shot through his legs. 1–0 down."},{"cap":"He’s staring at the ground."},{"who":"Teammate","say":"What was that?!"}],"q":"What should Amara do?","opts":["Run over and say “Head up, we’ll get it back”","Tell him what he did wrong","Throw her arms up so everyone sees she’s annoyed","Ignore him for the rest of the game"],"fb":["The keeper needs his confidence for the next 70 minutes. Encouragement gets it back.","He knows what went wrong. Now isn’t the time.","Body language like that tells the keeper and the opponents that your team is cracking.","Freezing him out makes another mistake more likely."],"coach":"Amara jogged back and told the keeper to keep his head up. He made three big saves in the second half and they won on penalties.","why":{"you":"You’ll want the same support when you make a mistake.","club":"Teams that stick together recover from setbacks.","game":"Every great keeper has let in a soft goal."},"tip":"After a teammate’s mistake, your next words matter more than theirs."},{"id":"a9","sec":"attitude","wk":2,"title":"The new coach","type":"mcq","panels":[{"cap":"A new coach starts. She changes the warm-up, the drills and the team talks."},{"who":"Teammate","say":"The old coach was better."},{"who":"Lucas","think":"I miss the old way too."}],"q":"What should Lucas do?","opts":["Give the new methods a fair go, and ask questions when he’s unsure","Agree out loud that the old coach was better","Ask his parents to complain","Do the new warm-up the old way"],"fb":["New coaches bring new ideas. Asking questions helps you learn faster.","Moaning spreads fast in a squad and makes it harder for everyone.","It’s too early to judge, and it’s your job to speak up, not your parents’.","Ignoring the new coach’s plan is disrespectful."],"coach":"Lucas asked why the warm-up had changed. The coach explained it was injury prevention. The squad came round within a month.","why":{"you":"Adapting to new coaches is part of an academy career.","club":"Coaches change. The academy’s values don’t.","game":"Professionals work under many different managers."},"tip":"Try it properly before you judge it."},{"id":"a10","sec":"attitude","wk":2,"title":
